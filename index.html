  // What the ⊕ button does depends on where you are, so the primary action for the
  // current tab is always one thumb-reach away instead of buried in a toolbar.
  function fabAction(){
    if(state.view === 'calendar') return { label:'New event', run:function(){ openAddEventModal(state.calAnchor); } };
    if(state.view === 'compass')  return { label:'New goal',  run:openAddGoalModal };
    if(state.view === 'dreams')   return { label:'New dream', run:openAddDreamModal };
    // Only offered once we know who you'd be posting as.
    if(state.view === 'messages') return state.currentFamilyMember
      ? { label:'New message', run:function(){ openMessageModal(null); } }
      : null;
    if(state.view === 'archive')  return null;
    return { label:'New task', run:openAddTaskModal };
  }

  function syncMobileChrome(){
    var fabEl = document.getElementById('fab');
    if(fabEl && !fabEl.querySelector('svg')) fabEl.innerHTML = icon('plus');
    document.querySelectorAll('#mobile-nav-inner button[data-view]').forEach(function(b){
      b.classList.toggle('active', b.dataset.view === state.view);
    });
    var fab = document.getElementById('fab');
    if(!fab) return;
    var act = fabAction();
    fab.classList.toggle('hidden', !act);
    // Every other view has its own Add button in the toolbar; the message board doesn't, so
    // its + is the only way in and has to show on a laptop as well as a phone.
    fab.classList.toggle('always', state.view === 'messages');
    if(act) fab.setAttribute('aria-label', act.label);
  }

  function openDaySheet(dateStr){
    var eventOccs = expandOccurrences(dateStr, dateStr).map(function(o){ o.kind = 'event'; return o; });
    var taskOccs = taskOccurrencesInRange(dateStr, dateStr);
    var list = eventOccs.concat(taskOccs).filter(eventMatchesFilter).sort(function(a,b){
      if(a.kind === 'task' && b.kind !== 'task') return 1;
      if(a.kind !== 'task' && b.kind === 'task') return -1;
      return (a.time||'').localeCompare(b.time||'');
    });
    var dt = new Date(dateStr+'T00:00:00');
    var body = list.length
      ? list.map(agendaCardHtml).join('')
      : '<div class="agenda-empty">Nothing on this day yet.</div>';

    document.getElementById('modal-root').innerHTML =
      '<div class="scrim" id="scrim"><div class="modal" style="max-width:520px;">'
      + '<div class="day-sheet-title"><h3>'+dt.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})+'</h3>'
      + '<span class="dst-sub">'+(dateStr===todayStr()?'Today':'')+'</span></div>'
      + '<div class="day-sheet-list">'+body+'</div>'
      + '<div class="modal-footer"><button class="btn-close" id="ds-add">'+icon('plus')+' Add event</button>'
      + '<button class="btn-sm" id="ds-close">Close</button></div>'
      + '</div></div>';

    function close(){ document.getElementById('modal-root').innerHTML = ''; }
    document.getElementById('scrim').addEventListener('click', function(e){ if(e.target.id==='scrim') close(); });
    document.getElementById('ds-close').addEventListener('click', close);
    document.getElementById('ds-add').addEventListener('click', function(){ close(); openAddEventModal(dateStr); });
    document.querySelectorAll('.day-sheet-list [data-occ]').forEach(function(el){
      el.addEventListener('click', function(){
        var occ = occFromOccurrenceId(el.dataset.occ);
        if(occ){ close(); openEventModal(occ); }
      });
    });
    document.querySelectorAll('.day-sheet-list [data-task]').forEach(function(el){
      el.addEventListener('click', function(){ var id = el.dataset.task; close(); openTaskModal(id); });
    });
  }

  /* ---- Touch drag between quadrants ----
     HTML5 drag-and-drop simply does not fire on touch screens, so on a phone the
     matrix was read-only unless you opened each task. Long-press a card and it
     follows your finger; release it over a quadrant to re-file it. */
  function attachTouchDrag(){
    var card = null, ghost = null, holdTimer = null, startX = 0, startY = 0, dragging = false, lastTarget = null;

    function cleanup(){
      clearTimeout(holdTimer);
      if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      if(card) card.classList.remove('dragging');
      if(lastTarget) lastTarget.classList.remove('drag-over');
      card = null; ghost = null; dragging = false; lastTarget = null;
      document.body.style.overflow = '';
    }

    function onStart(e){
      var t = e.target.closest('.task-card');
      if(!t || e.touches.length !== 1) return;
      if(e.target.closest('[data-action="toggle"]')) return;
      card = t;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      holdTimer = setTimeout(function(){
        dragging = true;
        if(navigator.vibrate) navigator.vibrate(12);
        var r = card.getBoundingClientRect();
        ghost = card.cloneNode(true);
        ghost.style.cssText = 'position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;'
          + 'pointer-events:none;z-index:300;opacity:.95;transform:scale(1.03);box-shadow:var(--shadow-lg);margin:0;';
        document.body.appendChild(ghost);
        card.classList.add('dragging');
        document.body.style.overflow = 'hidden';
      }, 260);
    }

    function onMove(e){
      if(!card) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      if(!dragging){
        // Moved before the long-press landed: that's a scroll, not a drag.
        if(Math.abs(x-startX) > 8 || Math.abs(y-startY) > 8) cleanup();
        return;
      }
      e.preventDefault();
      ghost.style.left = (x - ghost.offsetWidth/2) + 'px';
      ghost.style.top  = (y - 28) + 'px';
      var under = document.elementFromPoint(x, y);
      var body = under && under.closest('.q-body');
      if(body !== lastTarget){
        if(lastTarget) lastTarget.classList.remove('drag-over');
        if(body) body.classList.add('drag-over');
        lastTarget = body;
      }
    }

    function onEnd(){
      if(dragging && lastTarget && card){
        var qkey = lastTarget.dataset.quadrant;
        var id = card.dataset.id;
        if(qkey && id) { cleanup(); moveToQuadrant(id, qkey); return; }
      }
      cleanup();
    }

    var root = document.getElementById('view-root');
    root.addEventListener('touchstart', onStart, {passive:true});
    root.addEventListener('touchmove', onMove, {passive:false});
    root.addEventListener('touchend', onEnd);
    root.addEventListener('touchcancel', cleanup);
  }

  decorateViewSwitcher();
  buildMobileNav();
  attachTouchDrag();
  // A rotation or a resize across the phone/desktop boundary changes which layout the
  // calendar should be drawing, so re-render when we cross it.
  var wasPhone = isPhone();
  window.addEventListener('resize', debounce(function(){
    var now = isPhone();
    if(now !== wasPhone){ wasPhone = now; render(); }
    else { syncChromeHeight(); applyFillHeights(); }
  }, 180));
  syncChromeHeight();

  /* ================= EVENT WIRING (static header controls) ================= */
  document.getElementById('sync-status').addEventListener('click', function(){
    if(state.syncStatus === 'setup') openSettingsModal();
    else retrySyncNow();
  });
  document.getElementById('view-switcher').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-view]');
    if(btn) setView(btn.dataset.view);
  });
  document.getElementById('fab').addEventListener('click', function(){
    var act = fabAction();
    if(act) act.run();
  });
  function wireSearchToggle(btnId, toolbarId, inputId){
    var btn = document.getElementById(btnId);
    if(!btn) return;
    btn.addEventListener('click', function(){
      var bar = document.getElementById(toolbarId);
      var open = bar.classList.toggle('search-open');
      btn.classList.toggle('active', open);
      if(open) setTimeout(function(){ document.getElementById(inputId).focus(); }, 30);
    });
  }
  wireSearchToggle('toggle-search', 'task-toolbar', 'search-input');
  wireSearchToggle('cal-toggle-search', 'calendar-toolbar', 'cal-search-input');

  document.getElementById('search-input').addEventListener('input', function(e){
    state.search = e.target.value;
    render();
  });
  document.getElementById('open-settings').addEventListener('click', openSettingsModal);
  document.getElementById('add-task-full-btn').addEventListener('click', openAddTaskModal);
  document.getElementById('setup-banner-connect').addEventListener('click', openSettingsModal);
  document.getElementById('setup-banner-dismiss').addEventListener('click', function(){
    document.getElementById('setup-banner').classList.add('hidden');
  });

  /* Calendar toolbar (static controls) */
  document.getElementById('cal-subview-tabs').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-subview]');
    if(!btn) return;
    state.calSubView = btn.dataset.subview;
    render();
  });
  document.getElementById('cal-prev').addEventListener('click', function(){ calNavStep(-1); });
  document.getElementById('cal-next').addEventListener('click', function(){ calNavStep(1); });
  document.getElementById('cal-today').addEventListener('click', function(){ state.calAnchor = todayStr(); render(); });
  document.getElementById('cal-search-input').addEventListener('input', function(e){
    state.calSearch = e.target.value;
    render();
  });
  document.getElementById('add-event-btn').addEventListener('click', function(){ openAddEventModal(state.calAnchor); });
  document.getElementById('open-my-calendars').addEventListener('click', openMyCalendarsModal);
  document.getElementById('open-family-settings').addEventListener('click', openFamilySettingsModal);
  document.getElementById('add-dream-btn').addEventListener('click', openAddDreamModal);
  document.getElementById('add-goal-btn').addEventListener('click', openAddGoalModal);
  document.getElementById('compass-mode-toggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if(!btn || !state.compassFilter) return;
    var p = ensureCompassProfile(state.compassFilter);
    p.mode = btn.dataset.mode;
    p.updatedAt = nowISO();
    persistCompass();
    render();
  });

  /* app title/subtitle persistence (local only, cosmetic) */
  function loadMeta(){
    try{
      var m = JSON.parse(localStorage.getItem(LS_META) || 'null');
      if(m){
        document.getElementById('app-title').textContent = m.title;
        document.getElementById('app-subtitle').textContent = m.subtitle;
      }
    }catch(e){}
  }
  function saveMeta(){
    localStorage.setItem(LS_META, JSON.stringify({
      title: document.getElementById('app-title').textContent,
      subtitle: document.getElementById('app-subtitle').textContent
    }));
  }
  document.getElementById('app-title').addEventListener('blur', saveMeta);
  document.getElementById('app-subtitle').addEventListener('blur', saveMeta);

  /* ================= INIT ================= */
  loadMeta();
  // Identity first: which family member you are decides what the first paint even
  // shows (kid mode, locked person filter), so resolve it before the data lands.
  loadIdentity().then(function(){
    return bootSync();
  }).catch(function(){
    // Identity is a nice-to-have; never let it stop the app from starting.
    return bootSync();
  });

})();
