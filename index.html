  function renderStats(){
    renderPersonTabs();
    var counts = {doFirst:0,schedule:0,delegate:0,eliminate:0};
    var doneToday = 0;
    state.tasks.filter(personMatch).forEach(function(t){
      if(t.deleted) return;
      if(!t.completed) counts[quadrantOf(t)]++;
      if(t.completed && t.completedAt && t.completedAt.slice(0,10) === todayStr()) doneToday++;
    });
    var html = QUADRANT_ORDER.map(function(k){
      var q = QUADRANTS[k];
      return '<span class="stat-pill"><span class="stat-dot" style="background:'+q.accent+'"></span>'+counts[k]+' '+q.title+'</span>';
    }).join('');
    if(doneToday > 0){
      html += '<span class="stat-pill done-today">'+icon('check')+' '+doneToday+' done today</span>';
    }
    document.getElementById('stats-row').innerHTML = html;
  }

  /* ================= FILTERING ================= */
  function isSharedTask(t){ return (t.assignees||[]).length > 1; } // "shared" = assigned to more than one specific person
  // Normalizes tasks to the current assignees:[memberId,...] shape (any task missing it -- e.g.
  // old test/dummy data -- just starts out unassigned rather than trying to guess).
  function migrateTasks(tasks){
    return (tasks||[]).map(function(t){
      var copy = Object.assign({ deleted:false, deletedAt:null }, t);
      if(!copy.assignees) copy.assignees = [];
      delete copy.assignee;
      return copy;
    });
  }
  function personMatch(t){
    var filter = lockedPersonId() || state.person;
    var assignees = t.assignees || [];
    if(filter === 'all') return true;
    if(filter === 'shared') return assignees.length > 1;
    return assignees.indexOf(filter) !== -1;
  }
  function searchMatch(t){
    if(!state.search) return true;
    var q = state.search.toLowerCase();
    if(t.title && t.title.toLowerCase().indexOf(q) !== -1) return true;
    if(t.tags && t.tags.some(function(tag){ return tag.toLowerCase().indexOf(q) !== -1; })) return true;
    return false;
  }
  function visibleTasks(){
    return state.tasks.filter(function(t){ return !t.completed && !t.deleted && personMatch(t) && searchMatch(t); });
  }

  /* ================= RENDER: MATRIX / LIST / ARCHIVE ================= */
  function avatarHtml(assignees){
    var list = (assignees||[]).map(familyMember).filter(Boolean);
    if(!list.length) return '<span class="tc-avatars"><span class="avatar" style="background:var(--ink-muted)">?</span></span>';
    return '<span class="tc-avatars">'+list.slice(0,4).map(function(m,i){
      return '<span class="avatar" style="background:'+m.color+';'+(i>0?'margin-left:-8px;':'')+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('')+'</span>';
  }
  function metaPillsHtml(t){
    var pills = '';
    if(t.due){
      var overdue = t.due < todayStr();
      var isToday = t.due === todayStr();
      var cls = overdue ? 'due-overdue' : (isToday ? 'due-today' : '');
      pills += '<span class="meta-pill '+cls+'">'+(overdue?'Overdue ':'')+fmtDate(t.due)+'</span>';
    }
    var days = agingDays(t);
    if(days >= 3){
      var isDoFirst = quadrantOf(t) === 'doFirst';
      pills += '<span class="meta-pill aging'+(isDoFirst?' alert':'')+'">'+icon('clock')+days+'d here</span>';
    }
    if(t.subtasks && t.subtasks.length){
      var done = t.subtasks.filter(function(s){return s.done;}).length;
      pills += '<span class="meta-pill">'+icon('checksq')+done+'/'+t.subtasks.length+'</span>';
    }
    (t.tags||[]).forEach(function(tag){
      pills += '<span class="meta-pill tag">'+escapeHtml(tag)+'</span>';
    });
    return pills;
  }
  function taskCardHtml(t){
    return '<div class="task-card" draggable="true" data-id="'+t.id+'">'
      + '<div class="tc-top">'
      + '<span class="tc-check'+(t.completed?' checked':'')+'" data-action="toggle" data-id="'+t.id+'">'+(t.completed?icon('check'):'')+'</span>'
      + '<span class="tc-title'+(t.completed?' done':'')+'">'+escapeHtml(t.title)+'</span>'
      + avatarHtml(t.assignees)
      + '</div>'
      + '<div class="tc-meta">'+metaPillsHtml(t)+'</div>'
      + '</div>';
  }

  function renderMatrix(){
    var tasks = visibleTasks();
    var byQ = {doFirst:[],schedule:[],delegate:[],eliminate:[]};
    tasks.forEach(function(t){ byQ[quadrantOf(t)].push(t); });

    function panel(qkey){
      var q = QUADRANTS[qkey];
      var list = byQ[qkey];
      var body = list.length
        ? list.map(taskCardHtml).join('')
        : '<div class="q-empty">Nothing here — drag a task over, or add one above.</div>';
      return '<div class="quadrant '+q.cls+'">'
        + '<div class="q-header">'
        + '<span class="dot" style="background:'+q.accent+'"></span>'
        + '<div class="q-header-text"><div class="q-title">'+q.title+'</div><div class="q-subtitle">'+q.subtitle+'</div></div>'
        + '<span class="q-count">'+list.length+'</span>'
        + '</div>'
        + '<div class="q-body" data-quadrant="'+qkey+'">'+body+'</div>'
        + '</div>';
    }

    var html = '<div class="matrix-outer"><div class="matrix-cross">'
      + '<span></span>'
      + '<span class="axis-top urgent">Urgent</span>'
      + '<span class="axis-top not-urgent">Not Urgent</span>'

    attachDragAndDrop();

  function renderArchive(){
    // Archive holds both completed tasks and soft-deleted tasks. Deleting a task anywhere else
    // in the app just moves it here (deleted:true) - it stays fully recoverable via Restore.
    // Only the Delete button in this view actually removes a record for good.
    var items = state.tasks.filter(function(t){ return (t.completed || t.deleted) && personMatch(t); })
      .sort(function(a,b){ return ((b.deletedAt||b.completedAt)||'').localeCompare((a.deletedAt||a.completedAt)||''); });
    var html = items.length ? items.map(function(t){
      var label = t.deleted
        ? 'Deleted '+(t.deletedAt?fmtDate(t.deletedAt.slice(0,10)):'')
        : 'Completed '+(t.completedAt?fmtDate(t.completedAt.slice(0,10)):'');
      return '<div class="archive-row'+(t.deleted?' deleted':'')+'" data-id="'+t.id+'">'
        + avatarHtml(t.assignees)
        + '<span class="tc-title done" style="flex:1">'+escapeHtml(t.title)+'</span>'
        + '<span class="archive-date">'+label+'</span>'
        + '<button class="btn-sm" data-action="restore" data-id="'+t.id+'">Restore</button>'
        + '<button class="btn-sm danger" data-action="delete" data-id="'+t.id+'">Delete</button>'
        + '</div>';
    }).join('') : '<div class="list-empty">Nothing archived yet.</div>';
    document.getElementById('view-root').innerHTML = '<div class="archive-view">'+html+'</div>';

    document.getElementById('view-root').querySelectorAll('[data-action="restore"]').forEach(function(btn){
      btn.addEventListener('click', function(){ restoreTask(btn.dataset.id); });
    });
    document.getElementById('view-root').querySelectorAll('[data-action="delete"]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteTask(btn.dataset.id, true); });
    });
    document.getElementById('view-root').querySelectorAll('.archive-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if(e.target.closest('button')) return;
        openTaskModal(row.dataset.id);
      });
    });
  }

  /* ================= CALENDAR: RENDER ================= */
  function familyMember(id){ return state.family.find(function(m){ return m.id===id; }); }
  function categoryOf(occ){ return EVENT_CATEGORIES[occ.category] || EVENT_CATEGORIES.other; }

  function occFromOccurrenceId(occId){
    var sep = occId.indexOf('::');
    if(sep === -1){
      var ev = findEventById(occId);
      if(!ev) return null;
      return Object.assign({}, ev, { occurrenceId: ev.id, occurrenceDate: ev.date, isOverride: !!ev.recurrenceId, isVirtual:false });
    }
    var masterId = occId.slice(0,sep), date = occId.slice(sep+2);
    var master = findEventById(masterId);
    if(!master) return null;
    var span = eventSpanDays(master);
    return Object.assign({}, master, {
      occurrenceId: occId, occurrenceDate: date, date: date,
      endDate: span ? dateAdd(date, span) : master.endDate,
      isOverride:false, isVirtual:true, masterId: masterId
    });
  }

  function eventMatchesFilter(occ){
    if(state.calFilter !== 'all'){
      if(occ.kind === 'task'){
        var as = occ.attendees || [];
        if(as.indexOf(state.calFilter) === -1) return false;
      } else {
        var att = occ.attendees || ['all'];
        if(att.indexOf('all') === -1 && att.indexOf(state.calFilter) === -1) return false;
      }
    }
    if(state.calSearch){
      var q = state.calSearch.toLowerCase();
      var hay = ((occ.title||'')+' '+(occ.location||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  // Formats an occurrence's time-of-day for display, converted from the family's home timezone
  // into the CURRENT VIEWER's own timezone (if they've set a different one in Family Settings).
  // Imported (ICS) events are formatted but not zone-converted -- we don't reliably know what zone
  // they were parsed in, so we show their time-of-day as-is rather than guess and get it wrong.
  function displayEventTime(occ){
    if(occ.allDay || !occ.time) return 'All day';
    if(occ.source === 'ics') return formatTime12(occ.time);
    var home = state.homeTimezone || DEFAULT_TIMEZONE;
    var viewerZone = (state.currentFamilyMember && state.currentFamilyMember.timezone) || home;
    if(viewerZone === home) return formatTime12(occ.time);
    var converted = convertWallClockZone(occ.occurrenceDate, occ.time, home, viewerZone);
    return formatTime12(converted.time);
  }

  function attendeeAvatarsHtml(occ){
    var att = occ.attendees || ['all'];
    var members = (att.indexOf('all') !== -1) ? state.family.slice(0,4) : att.map(familyMember).filter(Boolean);
    return members.map(function(m){
      return '<span class="avatar" style="background:'+m.color+';margin-left:-6px;" title="'+escapeHtml(m.name)+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('');
  }

  function eventChipHtml(occ){
    var cat = categoryOf(occ);
    var importedMark = occ.source === 'ics' ? icon('download')+' ' : '';
    return '<div class="event-chip" style="background:'+cat.color+'" data-occ="'+occ.occurrenceId+'" title="'+escapeHtml((occ.source==='ics'?'Imported · ':'')+occ.title)+'">'
      + '<span class="ec-icon">'+icon(cat.icon)+'</span><span class="ec-title">'+importedMark+escapeHtml(occ.title)+'</span></div>';
  }

  /* ---- Tasks-with-due-dates, shown alongside events on the calendar ---- */
  // Tasks stay a separate data model from Events (per design), but any task with a due date is
  // projected into a lightweight pseudo-occurrence so it can slot into the same day cells / agenda
  // rows as events. Clicking one opens the real Task modal, not the Event modal.
  function taskAsCalOccurrence(t){
    return {
      kind:'task',
      occurrenceId: 'task::'+t.id,
      taskId: t.id,
      occurrenceDate: t.due,
      title: t.title,
      attendees: (t.assignees || []).slice(),
      completed: !!t.completed,
      quadrant: quadrantOf(t)
    };
  }
  function taskOccurrencesInRange(rangeStart, rangeEnd){
    return state.tasks.filter(function(t){ return t.due && !t.deleted && t.due >= rangeStart && t.due <= rangeEnd; }).map(taskAsCalOccurrence);
  }
  function taskAssigneeAvatarsHtml(occ){
    var members = (occ.attendees||[]).map(familyMember).filter(Boolean);
    return members.map(function(m){
      return '<span class="avatar" style="background:'+m.color+';margin-left:-6px;" title="'+escapeHtml(m.name)+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('');
  }
  function taskChipHtml(occ){
    var q = QUADRANTS[occ.quadrant];
    var style = occ.completed
      ? 'background:transparent;border:1.5px dashed var(--hairline);color:var(--ink-muted);'
      : 'background:'+q.accent+';';
    return '<div class="event-chip task-chip" style="'+style+'" data-task="'+occ.taskId+'" title="'+escapeHtml('Task · '+occ.title)+'">'
      + '<span class="ec-icon">'+icon(occ.completed?'checkcirc':'circle')+'</span><span class="ec-title'+(occ.completed?' done':'')+'">'+escapeHtml(occ.title)+'</span></div>';
  }
  function chipHtml(occ){ return occ.kind === 'task' ? taskChipHtml(occ) : eventChipHtml(occ); }

  function agendaCardHtml(occ){
    if(occ.kind === 'task'){
      var q = QUADRANTS[occ.quadrant];
      return '<div class="agenda-card task-agenda-card'+(occ.completed?' done':'')+'" style="border-left-color:'+(occ.completed?'var(--hairline)':q.accent)+'" data-task="'+occ.taskId+'">'
        + '<span class="ac-icon" style="background:'+(occ.completed?'var(--ink-faint)':q.accent)+'">'+icon(occ.completed?'checkcirc':'circle')+'</span>'
        + '<div class="ac-body"><div class="ac-title'+(occ.completed?' done':'')+'">'+escapeHtml(occ.title)+'</div><div class="ac-meta">Task · '+escapeHtml(q.title)+'</div></div>'
        + '<span class="ac-avatars">'+taskAssigneeAvatarsHtml(occ)+'</span>'
        + '</div>';
    }
    var cat = categoryOf(occ);
    var timeLabel = displayEventTime(occ);
    var loc = occ.location ? ' · '+escapeHtml(occ.location) : '';
    var importedMark = occ.source === 'ics' ? icon('download')+' ' : '';
    return '<div class="agenda-card" style="border-left-color:'+cat.color+'" data-occ="'+occ.occurrenceId+'">'
      + '<span class="ac-icon" style="background:'+cat.color+'">'+icon(cat.icon)+'</span>'
      + '<div class="ac-body"><div class="ac-title">'+importedMark+escapeHtml(occ.title)+'</div><div class="ac-meta">'+timeLabel+loc+'</div></div>'
      + '<span class="ac-avatars">'+attendeeAvatarsHtml(occ)+'</span>'
      + '</div>';
  }

  function renderCountdownStrip(){
    var today = todayStr();
    var occ = expandOccurrences(today, dateAdd(today,7)).filter(function(o){
      if(state.calFilter !== 'all'){
        var att = o.attendees || ['all'];
        if(att.indexOf('all') === -1 && att.indexOf(state.calFilter) === -1) return false;
      }
      return true;
    }).slice(0,6);
    if(!occ.length) return '';
    var cards = occ.map(function(o){
      var days = dateDiffDays(today, o.occurrenceDate);
      var when = days===0 ? 'Today' : days===1 ? 'Tomorrow' : 'in '+days+' days';
      var cat = categoryOf(o);
      return '<div class="countdown-card" data-occ="'+o.occurrenceId+'">'
        + '<div class="cc-icon" style="background:'+cat.color+'">'+icon(cat.icon)+'</div>'
        + '<div class="cc-title">'+escapeHtml(o.title)+'</div>'
        + '<div class="cc-when'+(days===0?' today':'')+'">'+when+' · '+fmtDate(o.occurrenceDate)+'</div>'
        + '</div>';
    }).join('');
    return '<div class="countdown-strip">'+cards+'</div>';
  }

  // Colour that represents an occurrence in compact (dot) form.
  function occDotColor(occ){
    if(occ.kind === 'task') return occ.completed ? '' : QUADRANTS[occ.quadrant].accent;
    return categoryOf(occ).color;
  }

  function renderMonthGrid(rangeStart, rangeEnd, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var monthNum = state.calAnchor.slice(0,7);
    var phone = isPhone();
    var weekdayHead = WEEKDAY_LABELS.map(function(l){ return '<div class="month-weekday">'+l+'</div>'; }).join('');
    var cells = '';
    var d = rangeStart;
    for(var i=0;i<42;i++){
      var inMonth = d.slice(0,7) === monthNum;
      var isToday = d === today;
      var dayList = byDate[d] || [];

      if(phone){
        // A 9px event chip is unreadable on a phone, so a day is summarised as up to four
        // dots (one per event, coloured by category / quadrant) and tapping it opens the
        // day sheet with the full detail. Same pattern the native calendar apps use.
        var dots = dayList.slice(0,4).map(function(o){
          var c = occDotColor(o);
          return '<span class="mc-dot'+(c?'':' hollow')+'" style="background:'+(c||'transparent')+'"></span>';
        }).join('');
        var more = dayList.length > 4 ? '<span class="mc-plus">+'+(dayList.length-4)+'</span>' : '';
        cells += '<div class="month-cell compact'+(inMonth?'':' outside')+(isToday?' today':'')+(dayList.length?' has-events':'')+'" data-date="'+d+'" data-day-sheet="'+d+'">'
          + '<div class="mc-num">'+parseInt(d.slice(8,10),10)+'</div>'
          + '<div class="mc-dots">'+dots+more+'</div>'
          + '</div>';
      } else {
        var list = dayList.slice(0,3);
        var extra = dayList.length - list.length;
        cells += '<div class="month-cell'+(inMonth?'':' outside')+(isToday?' today':'')+'" data-date="'+d+'">'
          + '<div class="mc-num">'+parseInt(d.slice(8,10),10)+'</div>'
          + list.map(chipHtml).join('')
          + (extra>0 ? '<div class="month-more" data-jump="'+d+'">+'+extra+' more</div>' : '')
          + '</div>';
      }
      d = dateAdd(d,1);
    }
    return '<div class="month-grid">'+weekdayHead+cells+'</div>';
  }

  // Phone week view: seven stacked day cards. The desktop version is a 7-column lane grid
  // that can only exist at 700px+, which on a phone meant sideways scrolling to find
  // Thursday. Here the week reads top to bottom like everything else on the page.
  function renderWeekStack(rangeStart, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var out = '';
    for(var i=0;i<7;i++){
      var d = dateAdd(rangeStart,i);
      var dt = new Date(d+'T00:00:00');
      var list = (byDate[d]||[]).slice().sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
      // A free day collapses to a single quiet line so the busy days are what you see.
      var head = '<div class="wk-day-head"><span>'+dt.toLocaleDateString(undefined,{weekday:'long'})+'</span>'
        + '<span class="wk-dow">'+dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>'
        + (d===today?'<span class="today-badge" style="margin-left:auto">Today</span>':'')
        + '</div>';
      if(!list.length){
        out += '<div class="wk-day empty'+(d===today?' today':'')+'" data-date="'+d+'">'+head+'</div>';
        continue;
      }
      var rows = list.map(function(o){
        var avatars = o.kind === 'task' ? taskAssigneeAvatarsHtml(o) : attendeeAvatarsHtml(o);
        return '<div class="wk-row">'+chipHtml(o)+'<span class="ac-avatars" style="display:flex">'+avatars+'</span></div>';
      }).join('');
      out += '<div class="wk-day'+(d===today?' today':'')+'">'
        + head
        + '<div class="wk-day-body">'+rows+'</div>'
        + '</div>';
    }
    return '<div class="week-stack">'+out+'</div>';
  }

  function renderWeekLanes(rangeStart, rangeEnd, occurrences){
    if(isPhone()) return renderWeekStack(rangeStart, occurrences);
    var today = todayStr();
    var days = [];
    for(var i=0;i<7;i++) days.push(dateAdd(rangeStart,i));

    var byPersonDate = {};
    occurrences.forEach(function(o){
      var att = o.attendees || ['all'];
      if(att.indexOf('all') !== -1){
        byPersonDate.everyone = byPersonDate.everyone || {};
        (byPersonDate.everyone[o.occurrenceDate] = byPersonDate.everyone[o.occurrenceDate]||[]).push(o);
      } else {
        att.forEach(function(pid){
          byPersonDate[pid] = byPersonDate[pid] || {};
          (byPersonDate[pid][o.occurrenceDate] = byPersonDate[pid][o.occurrenceDate]||[]).push(o);
        });
      }
    });

    var head = '<div></div>' + days.map(function(d){
      var dow = new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
      return '<div class="week-head'+(d===today?' today':'')+'">'+dow+' '+parseInt(d.slice(8,10),10)+'</div>';
    }).join('');

    var rows = '<div class="week-lane-label"><span class="adot" style="background:var(--primary-btn)"></span>Everyone</div>'
      + days.map(function(d){
          var list = (byPersonDate.everyone && byPersonDate.everyone[d]) || [];
          return '<div class="week-cell'+(d===today?' today':'')+'" data-date="'+d+'">'+list.map(chipHtml).join('')+'</div>';
        }).join('');

    state.family.forEach(function(m){
      if(state.calFilter !== 'all' && state.calFilter !== m.id) return;
      rows += '<div class="week-lane-label"><span class="adot" style="background:'+m.color+'"></span>'+escapeHtml(m.name)+'</div>'
        + days.map(function(d){
            var list = (byPersonDate[m.id] && byPersonDate[m.id][d]) || [];
            return '<div class="week-cell'+(d===today?' today':'')+'" data-date="'+d+'">'+list.map(chipHtml).join('')+'</div>';
          }).join('');
    });

    return '<div class="week-wrap"><div class="week-grid">'+head+rows+'</div></div>';
  }

  function renderAgendaRail(rangeStart, rangeEnd, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var dates = Object.keys(byDate).sort();
    if(!dates.length){
      return '<div class="agenda-rail"><div class="agenda-empty">Nothing coming up in this window.</div></div>';
    }
    var days = dates.map(function(d){
      var isToday = d === today;
      var isTomorrow = d === dateAdd(today,1);
      var list = byDate[d].slice().sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
      var cards = list.map(agendaCardHtml).join('');
      return '<div class="agenda-day">'
        + '<div class="agenda-day-label">'+fmtLong(d)+(isToday?'<span class="today-badge">Today</span>':(isTomorrow?'<span class="today-badge" style="background:var(--ink-muted)">Tomorrow</span>':''))+'</div>'
        + '<div class="agenda-cards">'+cards+'</div>'
        + '</div>';
    }).join('');
    return '<div class="agenda-rail">'+days+'</div>';
  }

  function renderTodaySection(){
    var today = todayStr();
    var list = expandOccurrences(today, today).map(function(o){ o.kind='event'; return o; })
      .concat(taskOccurrencesInRange(today, today))
      .filter(eventMatchesFilter)
      .sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
    return '<div class="month-day-section">'
      + '<div class="agenda-day-label">Today<span class="today-badge">'+fmtDate(today)+'</span></div>'
      + '<div class="agenda-cards">'
      + (list.length ? list.map(agendaCardHtml).join('') : '<div class="agenda-empty">Nothing scheduled today.</div>')
      + '</div></div>';
  }

  function renderCalToolbar(){
    document.querySelectorAll('#cal-subview-tabs button').forEach(function(b){
      b.classList.toggle('active', b.dataset.subview === state.calSubView);
    });
    var famTabs = document.getElementById('cal-family-tabs');
    var locked = lockedPersonId();
    if(locked){
      state.calFilter = locked;
      famTabs.innerHTML = '';
      famTabs.classList.add('hidden');
      return;
    }
    famTabs.classList.remove('hidden');
    var famHtml = '<button data-fam="all" class="'+(state.calFilter==='all'?'active':'')+'">All</button>'
      + state.family.map(function(m){
          return '<button data-fam="'+m.id+'" class="'+(state.calFilter===m.id?'active':'')+'">'+escapeHtml(m.name)+'</button>';
        }).join('');
    famTabs.innerHTML = famHtml;
    famTabs.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ state.calFilter = b.dataset.fam; render(); });
    });
  }

  function updateCalPeriodLabel(rangeStart, rangeEnd){
    var el = document.getElementById('cal-period-label');
    if(!el) return;
    if(state.calSubView === 'month') el.textContent = fmtMonthYear(state.calAnchor);
    else if(state.calSubView === 'week') el.textContent = fmtDate(rangeStart)+' – '+fmtDate(rangeEnd);
    else el.textContent = 'Next 3 weeks';
  }

  function calNavStep(dir){
    if(state.calSubView === 'month') state.calAnchor = addMonths(state.calAnchor, dir);
    else state.calAnchor = dateAdd(state.calAnchor, dir*7);
    render();
  }

  function renderCalendar(){
    renderCalToolbar();

    var today = todayStr();
    var rangeStart, rangeEnd;
    if(state.calSubView === 'month'){
      rangeStart = startOfWeek(startOfMonth(state.calAnchor));
      rangeEnd = dateAdd(rangeStart, 41);
    } else if(state.calSubView === 'week'){
      rangeStart = startOfWeek(state.calAnchor);
      rangeEnd = dateAdd(rangeStart, 6);
    } else {
      rangeStart = state.calAnchor;
      rangeEnd = dateAdd(rangeStart, 20);
    }

    var eventOccs = expandOccurrences(rangeStart, rangeEnd).map(function(o){ o.kind = 'event'; return o; });
    var taskOccs = taskOccurrencesInRange(rangeStart, rangeEnd);
    var occurrences = eventOccs.concat(taskOccs).filter(eventMatchesFilter);

    // The countdown strip is a lovely at-a-glance rail, but on a phone it pushes the month
    // grid below the fold — so there it rides along with the agenda only.
    var showStrip = !isPhone() || state.calSubView === 'agenda';
    var html = '<div class="cal-wrap">' + (showStrip ? renderCountdownStrip() : '');
    if(state.calSubView === 'month'){
      html += renderMonthGrid(rangeStart, rangeEnd, occurrences);
      // The phone grid is only dots, so today's actual plan goes right underneath it
      // instead of leaving dead space — no tap required to see what's on now.
      if(isPhone()) html += renderTodaySection();
    }
    else if(state.calSubView === 'week') html += renderWeekLanes(rangeStart, rangeEnd, occurrences);
    else html += renderAgendaRail(rangeStart, rangeEnd, occurrences);
    html += '</div>';

    document.getElementById('view-root').innerHTML = html;

    document.getElementById('view-root').querySelectorAll('[data-occ]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var occ = occFromOccurrenceId(el.dataset.occ);
        if(occ) openEventModal(occ);
      });
    });
    document.getElementById('view-root').querySelectorAll('[data-task]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        openTaskModal(el.dataset.task);
      });
    });
    document.getElementById('view-root').querySelectorAll('.month-more').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        state.calAnchor = el.dataset.jump;
        state.calSubView = 'agenda';
        render();
      });
    });
    document.getElementById('view-root').querySelectorAll('.month-cell,.week-cell').forEach(function(cell){
      cell.addEventListener('click', function(e){
        if(e.target.closest('[data-occ]') || e.target.closest('[data-task]') || e.target.closest('.month-more')) return;
        // On a phone the compact month cell is a summary, so tapping it opens that day's
        // detail sheet rather than jumping straight into "new event".
        if(cell.dataset.daySheet) openDaySheet(cell.dataset.daySheet);
        else openAddEventModal(cell.dataset.date);
      });
    });

    updateCalPeriodLabel(rangeStart, rangeEnd);
  }

  function toggleToolbars(){
    var isCal = state.view === 'calendar';
    var isDreams = state.view === 'dreams';
    var isCompass = state.view === 'compass';
    var isTaskView = !isCal && !isDreams && !isCompass;
    document.getElementById('task-toolbar').classList.toggle('hidden', !isTaskView);
    document.getElementById('calendar-toolbar').classList.toggle('hidden', !isCal);
    document.getElementById('dream-toolbar').classList.toggle('hidden', !isDreams);
    document.getElementById('compass-toolbar').classList.toggle('hidden', !isCompass);
    document.getElementById('stats-row').classList.toggle('hidden', !isTaskView);
    document.body.classList.toggle('kid-mode', isKidMode()); // applies app-wide, not just on the calendar tab
    document.getElementById('open-family-settings').classList.toggle('hidden', isKidMode()); // roster management is adults-only
    syncMobileChrome();
  }

  function render(){
    toggleToolbars();
    if(state.view === 'calendar'){
      renderCalendar();
      return;
    }
    if(state.view === 'dreams'){
      renderDreams();
      return;
    }
    if(state.view === 'compass'){
      renderCompass();
      return;
    }
    renderStats();
    if(state.view === 'matrix') renderMatrix();
    else if(state.view === 'list') renderList();
    else renderArchive();
  }

  /* ================= CARD INTERACTIONS ================= */
  function attachCardHandlers(){
    var root = document.getElementById('view-root');
    root.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        toggleComplete(el.dataset.id);
      });
    });
    root.querySelectorAll('.task-card, .list-row').forEach(function(el){
      el.addEventListener('click', function(e){
        if(e.target.closest('[data-action]')) return;
        openTaskModal(el.dataset.id);
      });
    });
  }

  function attachDragAndDrop(){
    var root = document.getElementById('view-root');
    var cards = root.querySelectorAll('.task-card');
    cards.forEach(function(card){
      card.addEventListener('dragstart', function(e){
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    });
    var zones = root.querySelectorAll('.q-body');
    zones.forEach(function(zone){
      zone.addEventListener('dragover', function(e){
        e.preventDefault();
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function(e){
        e.preventDefault();
        zone.classList.remove('drag-over');
        var id = e.dataTransfer.getData('text/plain');
        moveToQuadrant(id, zone.dataset.quadrant);
      });
    });
  }

  /* ================= TASK MUTATIONS ================= */
  function findTask(id){ return state.tasks.find(function(t){ return t.id === id; }); }

  function logActivity(task, text){
    if(!task.activity) task.activity = [];
    task.activity.unshift({ id: uid(), text: text, ts: nowISO() });
  }

  function toggleComplete(id){
    var t = findTask(id);
    if(!t) return;
    t.completed = !t.completed;
    t.completedAt = t.completed ? nowISO() : null;
    if(isSharedTask(t)) logActivity(t, t.completed ? 'Marked complete' : 'Marked incomplete');
    persist(); render();
  }

  function moveToQuadrant(id, qkey){
    var t = findTask(id);
    if(!t) return;
    var q = QUADRANTS[qkey];
    var changed = (t.importance !== q.important) || (t.urgency !== q.urgent);
    t.importance = q.important;
    t.urgency = q.urgent;
    if(changed){
      t.quadrantEnteredAt = nowISO();
      if(isSharedTask(t)) logActivity(t, 'Moved to '+q.title);
    }
    persist(); render();
  }

  // Restore un-does whichever removal state put a task in the Archive: if it was soft-deleted,
  // clear that; otherwise it was just completed, so un-complete it.
  function restoreTask(id){
    var t = findTask(id);
    if(!t) return;
    if(t.deleted){
      t.deleted = false;
      t.deletedAt = null;
    } else {
      t.completed = false;
      t.completedAt = null;
    }
    persist(); render();
  }

  // Deleting a task normally just moves it to the Archive (deleted:true) - the record is kept
  // and fully recoverable via Restore. Only when `permanent` is true (the Archive view's own
  // Delete button) does the record actually get removed from state.
  function deleteTask(id, permanent){
    var idx = state.tasks.findIndex(function(t){ return t.id === id; });
    if(idx === -1) return;
    var task = state.tasks[idx];
    if(permanent){
      state.tasks.splice(idx,1);
      persist(); render();
      state.deletedBuffer = { mode:'hard', task: task, index: idx };
      showToast('Permanently deleted "'+escapeHtml(task.title)+'"', true, 5000);
    } else {
      task.deleted = true;
      task.deletedAt = nowISO();
      persist(); render();
      state.deletedBuffer = { mode:'soft', taskId: id };
      showToast('Moved "'+escapeHtml(task.title)+'" to Archive', true, 5000);
    }
  }

  function undoDelete(){
    if(!state.deletedBuffer) return;
    var buf = state.deletedBuffer;
    if(buf.mode === 'hard'){
      var idx = Math.min(buf.index, state.tasks.length);
      state.tasks.splice(idx, 0, buf.task);
    } else {
      var t = findTask(buf.taskId);
      if(t){ t.deleted = false; t.deletedAt = null; }
    }
    state.deletedBuffer = null;
    persist(); render();
    hideToast();
  }

  function guessQuadrantFromText(text){
    var lower = text.toLowerCase();
    var urgent = URGENT_WORDS.some(function(w){ return lower.indexOf(w) !== -1; });
    var notImportant = NOT_IMPORTANT_WORDS.some(function(w){ return lower.indexOf(w) !== -1; });
    return { importance: !notImportant, urgency: urgent };
  }

  function quickAddTask(text){
    text = text.trim();
    if(!text) return;
    var guess = guessQuadrantFromText(text);
    var task = {
      id: uid(), title: text, notes: '',
      importance: guess.importance, urgency: guess.urgency,
      assignees: defaultTaskAssignees(), due: null, tags: [],
      subtasks: [], completed: false, completedAt: null,
      quadrantEnteredAt: nowISO(), activity: []
    };
    state.tasks.push(task);
    persist(); render();
    var qkey = quadrantOf(task);
    showToast('Added to '+QUADRANTS[qkey].title, false, 2400);
  }

  /* ================= TOAST ================= */
  var toastTimer;
  function showToast(message, withUndo, duration){
    var el = document.getElementById('toast');
    el.innerHTML = escapeHtml(message) + (withUndo ? ' <button id="toast-undo">Undo</button>' : '');
    el.classList.add('show');
    if(withUndo){
      document.getElementById('toast-undo').addEventListener('click', undoDelete);
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      hideToast();
      if(withUndo) state.deletedBuffer = null;
    }, duration || 2400);
  }
  function hideToast(){
    document.getElementById('toast').classList.remove('show');
  }

  /* ================= TASK MODAL ================= */
  function openAddTaskModal(){
    var t = {
      id: uid(), title: '', notes: '',
      importance: true, urgency: false, // default: Schedule quadrant, same "no signal" default as quick-add
      assignees: defaultTaskAssignees(), due: null, tags: [],
      subtasks: [], completed: false, completedAt: null,
      quadrantEnteredAt: nowISO(), activity: []
    };
    state.tasks.push(t);
    pendingNewTaskId = t.id;
    render();
    openTaskModal(t.id);
  }

  function openTaskModal(id){
    var sourceTask = findTask(id);
    if(!sourceTask) return;
    var isNew = (pendingNewTaskId === id);

    // Everything in this modal edits a draft copy -- nothing touches real data (or GitHub) until
    // Save is clicked. Cancel, or clicking outside the modal, throws the draft away untouched.
    var draft = Object.assign({}, sourceTask);
    draft.tags = (sourceTask.tags || []).slice();
    draft.subtasks = (sourceTask.subtasks || []).map(function(s){ return Object.assign({}, s); });
    draft.assignees = (sourceTask.assignees || []).slice();
    draft.activity = (sourceTask.activity || []).slice();

    function renderTaskForm(){
      var qkey = quadrantOf(draft);
      var priorityBtns = QUADRANT_ORDER.map(function(k){
        var q = QUADRANTS[k];
        var sel = (k === qkey) ? ' sel-'+ (k==='doFirst'?'do-first':k) : '';
        return '<button class="priority-btn'+sel+'" data-q="'+k+'">'+q.title+'</button>';
      }).join('');

      var assignees = draft.assignees || [];
      var assigneeChips = state.family.length ? state.family.map(function(m){
        var on = assignees.indexOf(m.id) !== -1;
        return '<span class="tag-chip attendee-chip'+(on?' active':'')+'" data-a="'+m.id+'"><span class="adot" style="background:'+m.color+'"></span>'+escapeHtml(m.name)+'</span>';
      }).join('') : '<span class="settings-help" style="margin:0;">Add family members in Family Settings to assign tasks to specific people.</span>';

      var tagsHtml = (draft.tags||[]).map(function(tag,i){
        return '<span class="tag-chip">'+escapeHtml(tag)+'<button data-idx="'+i+'" data-action="rm-tag" aria-label="Remove tag">'+icon('close')+'</button></span>';
      }).join('');

      var subtasksHtml = (draft.subtasks||[]).map(function(s){
        return '<div class="subtask-row" data-id="'+s.id+'">'
          + '<input type="checkbox" '+(s.done?'checked':'')+' data-action="st-toggle">'
          + '<span class="st-text'+(s.done?' done':'')+'">'+escapeHtml(s.text)+'</span>'
          + '<button class="rm" data-action="st-remove" aria-label="Remove">'+icon('close')+'</button></div>';
      }).join('');

      var activityHtml = '';
      if(isSharedTask(draft) && draft.activity && draft.activity.length){
        activityHtml = '<div class="field-label">Activity</div><div class="activity-log">'
          + draft.activity.map(function(a){ return '<div>'+escapeHtml(a.text)+' — '+fmtRelative(a.ts)+'</div>'; }).join('')
          + '</div>';
      }

      var html = ''
        + '<div class="scrim" id="scrim">'
        + '<div class="modal">'
        + '<input class="modal-title-input" id="m-title" placeholder="Task title" value="'+escapeHtml(draft.title)+'">'
        + '<div class="field-label">Priority</div><div class="priority-grid">'+priorityBtns+'</div>'
        + '<div class="field-label">Assigned to</div><div class="tag-list" id="m-assignee">'+assigneeChips+'</div>'
        + '<div class="row-2" style="margin-top:18px;">'
        + '<div><div class="field-label" style="margin-top:0;">Due date</div><input type="date" id="m-due" value="'+(draft.due||'')+'"></div>'
        + '<div><div class="field-label" style="margin-top:0;">Status</div><button class="status-toggle'+(draft.completed?' complete':'')+'" id="m-status">'+(draft.completed?icon('refresh')+' Mark incomplete':icon('check')+' Mark complete')+'</button></div>'
        + '</div>'
        + '<div class="field-label">Tags</div><div class="tag-list" id="m-tags">'+tagsHtml+'</div>'
        + '<input class="dashed-input" id="m-tag-input" placeholder="Add a tag, press Enter">'
        + '<div class="field-label">Subtasks</div><div id="m-subtasks">'+subtasksHtml+'</div>'
        + '<input class="dashed-input" id="m-subtask-input" placeholder="Add a subtask, press Enter">'
        + '<div class="field-label">Notes</div><textarea class="notes" id="m-notes">'+escapeHtml(draft.notes||'')+'</textarea>'
        + activityHtml
        + '<div class="modal-footer">'
        + '<button class="btn-delete" id="m-delete">Delete task</button>'
        + '<div style="display:flex;gap:10px;">'
        + '<button class="btn-sm" id="m-cancel">Cancel</button>'
        + '<button class="btn-close" id="m-save">Save</button>'
        + '</div>'
        + '</div>'
        + '</div></div>';

      document.getElementById('modal-root').innerHTML = html;

      if(isNew) document.getElementById('m-title').focus();

      document.getElementById('scrim').addEventListener('click', function(e){ if(e.target.id === 'scrim') doCancel(); });
      document.getElementById('m-cancel').addEventListener('click', doCancel);
      document.getElementById('m-save').addEventListener('click', doSave);

      document.getElementById('m-title').addEventListener('input', function(e){ draft.title = e.target.value; });

      document.querySelectorAll('.priority-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var qk = btn.dataset.q, q = QUADRANTS[qk];
          var changed = (draft.importance !== q.important) || (draft.urgency !== q.urgent);
          draft.importance = q.important; draft.urgency = q.urgent;
          if(changed){
            draft.quadrantEnteredAt = nowISO();
            if(isSharedTask(draft)) logActivity(draft, 'Reassigned to '+q.title);
          }
          renderTaskForm();
        });
      });

      document.querySelectorAll('#m-assignee .attendee-chip').forEach(function(chip){
        chip.addEventListener('click', function(){
          var memberId = chip.dataset.a;
          draft.assignees = draft.assignees || [];
          var wasShared = isSharedTask(draft);
          var idx = draft.assignees.indexOf(memberId);
          if(idx === -1) draft.assignees.push(memberId); else draft.assignees.splice(idx,1);
          if(wasShared || isSharedTask(draft)){
            var names = draft.assignees.map(function(aid){ return (familyMember(aid)||{}).name; }).filter(Boolean).join(', ');
            logActivity(draft, 'Reassigned to '+(names || 'nobody'));
          }
          renderTaskForm();
        });
      });

      document.getElementById('m-due').addEventListener('change', function(e){ draft.due = e.target.value || null; });

      document.getElementById('m-status').addEventListener('click', function(){
        draft.completed = !draft.completed;
        draft.completedAt = draft.completed ? nowISO() : null;
        if(isSharedTask(draft)) logActivity(draft, draft.completed?'Marked complete':'Marked incomplete');
        renderTaskForm();
      });

      document.querySelectorAll('[data-action="rm-tag"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          draft.tags.splice(parseInt(btn.dataset.idx,10),1);
          renderTaskForm();
        });
      });
      document.getElementById('m-tag-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter' && e.target.value.trim()){
          draft.tags = draft.tags || [];
          draft.tags.push(e.target.value.trim());
          renderTaskForm();
        }
      });

      document.querySelectorAll('[data-action="st-toggle"]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var row = cb.closest('.subtask-row');
          var s = (draft.subtasks||[]).find(function(x){ return x.id === row.dataset.id; });
          if(s) s.done = cb.checked;
          renderTaskForm();
        });
      });
      document.querySelectorAll('[data-action="st-remove"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var row = btn.closest('.subtask-row');
          draft.subtasks = (draft.subtasks||[]).filter(function(x){ return x.id !== row.dataset.id; });
          renderTaskForm();
        });
      });
      document.getElementById('m-subtask-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter' && e.target.value.trim()){
          draft.subtasks = draft.subtasks || [];
          draft.subtasks.push({ id: uid(), text: e.target.value.trim(), done:false });
          renderTaskForm();
        }
      });

      document.getElementById('m-notes').addEventListener('input', function(e){ draft.notes = e.target.value; });

      document.getElementById('m-delete').addEventListener('click', function(){
        document.getElementById('modal-root').innerHTML = '';
        if(pendingNewTaskId === id) pendingNewTaskId = null;
        deleteTask(id);
      });
    }

    function doCancel(){
      document.getElementById('modal-root').innerHTML = '';
      if(isNew){
        pendingNewTaskId = null;
        state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
      }
      render();
    }

    function doSave(){
      // The tag/subtask inputs only add their entry to the draft on Enter - if the user typed
      // something and clicked Save directly instead, that text would otherwise just be sitting
      // unread in the input when we wipe the modal below, and silently vanish. Commit it first.
      var pendingTag = (document.getElementById('m-tag-input')||{}).value;
      if(pendingTag && pendingTag.trim()){
        draft.tags = draft.tags || [];
        draft.tags.push(pendingTag.trim());
      }
      var pendingSubtask = (document.getElementById('m-subtask-input')||{}).value;
      if(pendingSubtask && pendingSubtask.trim()){
        draft.subtasks = draft.subtasks || [];
        draft.subtasks.push({ id: uid(), text: pendingSubtask.trim(), done:false });
      }
      var titleTrim = (draft.title||'').trim();
      document.getElementById('modal-root').innerHTML = '';
      if(isNew && !titleTrim){
        pendingNewTaskId = null;
        state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
        render();
        return;
      }
      var fields = {
        title: titleTrim || sourceTask.title,
        importance: draft.importance, urgency: draft.urgency,
        assignees: (draft.assignees||[]).slice(),
        due: draft.due || null,
        tags: (draft.tags||[]).slice(),
        subtasks: (draft.subtasks||[]).map(function(s){ return Object.assign({}, s); }),
        completed: draft.completed, completedAt: draft.completedAt,
        quadrantEnteredAt: draft.quadrantEnteredAt,
        notes: draft.notes || '',
        activity: (draft.activity||[]).slice()
      };
      Object.assign(sourceTask, fields);
      persist(); render();
      if(isNew){
        pendingNewTaskId = null;
        var addedQ = quadrantOf(sourceTask);
        showToast('Added to '+QUADRANTS[addedQ].title, false, 2400);
      }
    }

    renderTaskForm();
  }

  /* ================= CALENDAR: DATE HELPERS ================= */
  function dateAdd(dateStr, days){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+days);
    return toLocalDateStr(d);
  }
  function dateDiffDays(a,b){
    return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
  }
  function addMonths(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toLocalDateStr(d);
  }
  function addYears(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    d.setFullYear(d.getFullYear()+n);
    return toLocalDateStr(d);
  }
  function startOfWeek(dateStr){ // Sunday-start week
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()-d.getDay());
    return toLocalDateStr(d);
  }
  function startOfMonth(dateStr){
    return dateStr.slice(0,7)+'-01';
  }
  function fmtLong(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  }
  function fmtMonthYear(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  }
  var WEEKDAY_LABELS = ['S','M','T','W','T','F','S'];

  /* ================= CALENDAR: RECURRENCE ENGINE ================= */
  var MAX_RECUR_ITERATIONS = 400;

  function eventSpanDays(ev){
    if(!ev.endDate) return 0;
    return Math.max(0, dateDiffDays(ev.date, ev.endDate));
  }
  function occurrenceInRange(startDate, spanDays, rangeStart, rangeEnd){
    var endDate = spanDays ? dateAdd(startDate, spanDays) : startDate;
    return !(endDate < rangeStart || startDate > rangeEnd);
  }
  function findEventById(id){
    return state.events.find(function(e){ return e.id === id; });
  }
  // Expands all events into concrete occurrences intersecting [rangeStart, rangeEnd] (inclusive, 'YYYY-MM-DD').
  function expandOccurrences(rangeStart, rangeEnd){
    var out = [];
    var safetyLimit = dateAdd(rangeEnd, 3);

    state.events.forEach(function(ev){
      var span = eventSpanDays(ev);

      if(ev.recurrenceId || !ev.recurrence){
        // one-off event, or a standalone override tied to a series
        if(occurrenceInRange(ev.date, span, rangeStart, rangeEnd)){
          out.push(Object.assign({}, ev, { occurrenceId: ev.id, occurrenceDate: ev.date, isOverride: !!ev.recurrenceId, isVirtual:false }));
        }
        return;
      }

      // recurring master
      var rule = ev.recurrence;
      var cursor = ev.date;
      var weekdayMode = rule.freq === 'weekly' && rule.byWeekday && rule.byWeekday.length;
      var iterations = 0, matched = 0;

      while(iterations < MAX_RECUR_ITERATIONS){
        iterations++;
        if(rule.until && cursor > rule.until) break;
        if(cursor > safetyLimit) break;

        var include = true;
        if(weekdayMode){
          var dow = new Date(cursor+'T00:00:00').getDay();
          include = rule.byWeekday.indexOf(dow) !== -1;
        }
        if(include){
          matched++;
          if(rule.count && matched > rule.count) break;
          if((ev.exceptionDates||[]).indexOf(cursor) === -1 && occurrenceInRange(cursor, span, rangeStart, rangeEnd)){
            out.push(Object.assign({}, ev, {
              occurrenceId: ev.id+'::'+cursor, occurrenceDate: cursor, date: cursor,
              endDate: span ? dateAdd(cursor, span) : ev.endDate,
              isOverride:false, isVirtual:true, masterId: ev.id
            }));
          }
        }

        if(weekdayMode) cursor = dateAdd(cursor, 1);
        else if(rule.freq === 'daily') cursor = dateAdd(cursor, rule.interval||1);
        else if(rule.freq === 'weekly') cursor = dateAdd(cursor, 7*(rule.interval||1));
        else if(rule.freq === 'monthly') cursor = addMonths(cursor, rule.interval||1);
        else if(rule.freq === 'yearly') cursor = addYears(cursor, rule.interval||1);
        else break;
      }
    });

    out.sort(function(a,b){ return (a.occurrenceDate+(a.time||'')).localeCompare(b.occurrenceDate+(b.time||'')); });
    return out;
  }

  // scope: 'this' | 'following' | 'all'. occ must be a virtual occurrence (occ.isVirtual === true).
  function applyEditScope(occ, scope, fields){
    var master = findEventById(occ.masterId);
    if(!master) return;
    if(scope === 'all'){
      var f = Object.assign({}, fields);
      delete f.date; // series start date doesn't move on an "all" edit
      Object.assign(master, f);
    } else if(scope === 'this'){
      master.exceptionDates = master.exceptionDates || [];
      if(master.exceptionDates.indexOf(occ.occurrenceDate) === -1) master.exceptionDates.push(occ.occurrenceDate);
      state.events.push(Object.assign({}, master, fields, {
        id: uid(), recurrence: null, exceptionDates: [],
        recurrenceId: master.id, overrideDate: occ.occurrenceDate,
        date: fields.date || occ.occurrenceDate
      }));
    } else if(scope === 'following'){
      var cutoff = dateAdd(occ.occurrenceDate, -1);
      var oldUntil = master.recurrence.until;
      master.recurrence = Object.assign({}, master.recurrence, { until: cutoff });
      var newRule = Object.assign({}, master.recurrence, { until: oldUntil });
      if(fields.recurrence) newRule = Object.assign(newRule, fields.recurrence);
      state.events.push(Object.assign({}, master, fields, {
        id: uid(), date: occ.occurrenceDate, exceptionDates: [],
        recurrence: newRule, recurrenceId: null, overrideDate: null
      }));
    }
  }

  function deleteOccurrence(occ, scope){
    if(occ.isOverride || !occ.isVirtual){
      state.events = state.events.filter(function(e){ return e.id !== occ.occurrenceId; });
      return;
    }
    var master = findEventById(occ.masterId);
    if(!master) return;
    if(scope === 'this'){
      master.exceptionDates = master.exceptionDates || [];
      master.exceptionDates.push(occ.occurrenceDate);
    } else if(scope === 'following'){
      master.recurrence.until = dateAdd(occ.occurrenceDate, -1);
    } else if(scope === 'all'){
      state.events = state.events.filter(function(e){ return e.id !== master.id && e.recurrenceId !== master.id; });
    }
  }

  function promptScope(title, cb){
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="scrim" id="scope-scrim"><div class="modal" style="max-width:380px;">'
      + '<div class="field-label" style="margin-top:0;">'+escapeHtml(title)+'</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      + '<button class="btn-sm" data-scope="this" style="text-align:left;padding:11px 14px;">This event only</button>'
      + '<button class="btn-sm" data-scope="following" style="text-align:left;padding:11px 14px;">This and following events</button>'
      + '<button class="btn-sm" data-scope="all" style="text-align:left;padding:11px 14px;">All events in the series</button>'
      + '<button class="btn-sm" data-scope="cancel" style="text-align:left;padding:11px 14px;color:var(--ink-muted);">Cancel</button>'
      + '</div></div></div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#scope-scrim').addEventListener('click', function(e){
      if(e.target.id === 'scope-scrim') document.body.removeChild(wrap);
    });
    wrap.querySelectorAll('button[data-scope]').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.body.removeChild(wrap);
        if(btn.dataset.scope !== 'cancel') cb(btn.dataset.scope);
      });
    });
  }

  /* ================= CALENDAR: EVENT MODAL ================= */
  function openAddEventModal(defaultDate){
    var base = {
      id: uid(), title:'', category:'other', attendees:['all'],
      date: defaultDate || state.calAnchor || todayStr(), endDate:null, allDay:true, time:null,
      location:'', notes:'', recurrence:null, exceptionDates:[], recurrenceId:null, overrideDate:null,
      createdBy: state.currentFamilyMember ? state.currentFamilyMember.id : null, createdAt: nowISO()
    };
    openEventModal({ occurrenceId:null, occurrenceDate: base.date, isVirtual:false, isOverride:false, isNew:true, draftBase: base });
  }

  // Read-only view for events that came from an imported calendar subscription --
  // editing them locally would just be overwritten on the next sync, so we don't offer it.
  function openImportedEventView(occ, sourceEvent){
    var cat = categoryOf(sourceEvent);
    var sub = findSubscription(sourceEvent.subscriptionId);
    var owner = familyMember(sourceEvent.createdBy);
    var whenLabel = sourceEvent.allDay ? fmtLong(occ.occurrenceDate) : (fmtLong(occ.occurrenceDate) + ' at ' + formatTime12(sourceEvent.time));
    var syncedLabel = sub && sub.lastSyncedAt ? ('Synced '+fmtRelative(sub.lastSyncedAt)) : 'Not synced yet';
    var canManage = sub && state.currentFamilyMember && state.currentFamilyMember.id === sub.ownerFamilyMemberId;

    var html = ''
      + '<div class="scrim" id="scrim">'
      + '<div class="modal">'
      + '<div class="settings-help" style="margin-top:0;">'+icon('download')+' Imported from '+escapeHtml(sub ? sub.name : 'a subscribed calendar')+(owner?' · '+escapeHtml(owner.name):'')+' · '+syncedLabel+'</div>'
      + '<div style="font-family:var(--font-serif);font-size:21px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:9px;"><span style="color:'+cat.color+'">'+icon(cat.icon)+'</span>'+escapeHtml(sourceEvent.title)+'</div>'
      + '<div class="field-label" style="margin-top:0;">When</div><div style="font-size:13px;">'+whenLabel+(sourceEvent.endDate?' – '+fmtLong(sourceEvent.endDate):'')+'</div>'

      + (sourceEvent.notes ? '<div class="field-label">Notes</div><div style="font-size:13px;white-space:pre-wrap;">'+escapeHtml(sourceEvent.notes)+'</div>' : '')
      + '<div class="settings-help">This event is read-only here — it\'s managed by the source calendar. To change it, edit it there; to stop seeing it, remove the subscription from My Calendars.</div>'
      + '<div class="modal-footer">'
      + (canManage ? '<button class="btn-sm" id="ie-manage">Manage subscription</button>' : '<span></span>')
