    task:         { get: function(){ return state.tasks; },              set: function(v){ state.tasks = v; },              idOf: function(o){ return o.id; } },
    event:        { get: function(){ return state.events; },             set: function(v){ state.events = v; },             idOf: function(o){ return o.id; } },
    subscription: { get: function(){ return state.calendarSubscriptions;},set: function(v){ state.calendarSubscriptions = v;},idOf: function(o){ return o.id; } },
    member:       { get: function(){ return state.family; },             set: function(v){ state.family = v; },             idOf: function(o){ return o.id; } },
    dream:        { get: function(){ return state.dreams; },             set: function(v){ state.dreams = v; },             idOf: function(o){ return o.id; } },
    goal:         { get: function(){ return state.compassGoals; },       set: function(v){ state.compassGoals = v; },       idOf: function(o){ return o.id; } },
    priority:     { get: function(){ return state.compassPriorities; },  set: function(v){ state.compassPriorities = v; },  idOf: function(o){ return o.id; } },
    // Compass profiles are keyed by the kid they belong to, not by an id field.
    profile:      { get: function(){ return state.compassProfiles; },    set: function(v){ state.compassProfiles = v; },    idOf: function(o){ return 'profile:' + o.ownerId; } },
    category:     { get: function(){ return state.eventCategories; },    set: function(v){ state.eventCategories = v; },    idOf: function(o){ return 'category:' + o.id; } },
    message:      { get: function(){ return state.messages; },           set: function(v){ state.messages = v; },           idOf: function(o){ return 'message:' + o.id; } }
  };

  var sync = {
    cursor: 0,
    queue: [],            // ops waiting to reach the server
    shadow: {},           // id -> JSON string the server last confirmed
    inFlight: false,
    pollTimer: null,
    backoff: 0,
    lastError: null,
    started: false,
    unknownKinds: {},     // kinds this server rejected; see the bad_kind branch in flushQueue
    deferred: null,       // remote items held back while a modal is open
    online: true
  };

  function loadSyncLocal(){
    try{ sync.cursor = parseInt(localStorage.getItem(LS_CURSOR) || '0', 10) || 0; }catch(e){ sync.cursor = 0; }
    try{ sync.queue = JSON.parse(localStorage.getItem(LS_QUEUE) || '[]') || []; }catch(e){ sync.queue = []; }
  }
  function saveSyncLocal(){
    try{
      localStorage.setItem(LS_CURSOR, String(sync.cursor));
      localStorage.setItem(LS_QUEUE, JSON.stringify(sync.queue));
    }catch(e){ /* private mode / quota — the server is still the source of truth */ }
  }

  /* ---- local cache (instant paint, and the app still works offline) ---- */
  function loadLocalTasksOnly(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_TASKS) || 'null');
      return (raw && raw.tasks) || [];
    }catch(e){ return []; }
  }
  function loadLocal(){ state.tasks = migrateTasks(loadLocalTasksOnly()); }
  function cacheLocal(){
    try{ localStorage.setItem(LS_TASKS, JSON.stringify({tasks: state.tasks})); }catch(e){}
  }
  function loadCalendarLocalOnly(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_CALENDAR) || 'null');
      return { family: (raw && raw.family) || [], events: (raw && raw.events) || [], calendarSubscriptions: (raw && raw.calendarSubscriptions) || [], eventCategories: (raw && raw.eventCategories) || [], messages: (raw && raw.messages) || [], homeTimezone: (raw && raw.homeTimezone) || DEFAULT_TIMEZONE };
    }catch(e){ return { family: [], events: [], calendarSubscriptions: [], eventCategories: [], messages: [], homeTimezone: DEFAULT_TIMEZONE }; }
  }
  function loadCalendarLocal(){
    var c = loadCalendarLocalOnly();
    state.family = c.family; state.events = c.events; state.calendarSubscriptions = c.calendarSubscriptions;
    state.eventCategories = c.eventCategories; state.messages = c.messages; state.homeTimezone = c.homeTimezone;
  }
  function cacheCalendarLocal(){
    try{ localStorage.setItem(LS_CALENDAR, JSON.stringify({family: state.family, events: state.events, calendarSubscriptions: state.calendarSubscriptions, eventCategories: state.eventCategories, messages: state.messages, homeTimezone: state.homeTimezone})); }catch(e){}
  }
  function loadDreamsLocalOnly(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_DREAMS) || 'null');
      return (raw && raw.dreams) || [];
    }catch(e){ return []; }
  }
  function loadDreamsLocal(){ state.dreams = loadDreamsLocalOnly(); }
  function cacheDreamsLocal(){
    try{ localStorage.setItem(LS_DREAMS, JSON.stringify({dreams: state.dreams})); }catch(e){}
  }
  function loadCompassLocalOnly(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_COMPASS) || 'null');
      return { profiles: (raw && raw.profiles) || [], goals: (raw && raw.goals) || [], priorities: (raw && raw.priorities) || [] };
    }catch(e){ return { profiles: [], goals: [], priorities: [] }; }
  }
  function loadCompassLocal(){
    var c = loadCompassLocalOnly();
    state.compassProfiles = c.profiles; state.compassGoals = c.goals; state.compassPriorities = c.priorities;
  }
  function cacheCompassLocal(){
    try{ localStorage.setItem(LS_COMPASS, JSON.stringify({profiles: state.compassProfiles, goals: state.compassGoals, priorities: state.compassPriorities})); }catch(e){}
  }
  function cacheAllLocal(){ cacheLocal(); cacheCalendarLocal(); cacheDreamsLocal(); cacheCompassLocal(); }

  /* ---- shadow bookkeeping ----
     The shadow is what the server last told us each item looks like. Diffing
     against it is what lets the whole app keep calling a blunt persist() while
     the wire protocol stays per-item. */
  function shadowKey(kind, id){ return kind + ':' + id; }
  function rebuildShadow(){
    sync.shadow = {};
    Object.keys(SYNC_KINDS).forEach(function(kind){
      var k = SYNC_KINDS[kind];
      (k.get() || []).forEach(function(item){
        sync.shadow[shadowKey(kind, k.idOf(item))] = JSON.stringify(item);
      });
    });
  }

  /** Compare state to the shadow and queue an op for everything that moved. */
  function collectOps(){
    var ops = [];
    var seenKeys = {};
    Object.keys(SYNC_KINDS).forEach(function(kind){
      var k = SYNC_KINDS[kind];
      (k.get() || []).forEach(function(item){
        var id = k.idOf(item);
        if(!id) return;
        var key = shadowKey(kind, id);
        seenKeys[key] = true;
        var now = JSON.stringify(item);
        if(sync.shadow[key] !== now){
          sync.shadow[key] = now;
          ops.push({ opId: uid(), kind: kind, id: id, data: item });
        }
      });
    });
    // Anything the shadow knows about that state no longer holds was hard-deleted.
    // (A task sent to the archive is NOT this — it stays in the array with
    // deleted:true, so it syncs as an ordinary update.)
    Object.keys(sync.shadow).forEach(function(key){
      if(seenKeys[key]) return;
      var sep = key.indexOf(':');
      var kind = key.slice(0, sep), id = key.slice(sep + 1);
      delete sync.shadow[key];
      ops.push({ opId: uid(), kind: kind, id: id, gone: true });
    });
    return ops;
  }

  var META_SHADOW = {};
  function collectMetaOps(){
    var ops = [];
    var current = {
      homeTimezone: state.homeTimezone,
      appTitle: (document.getElementById('app-title') || {}).textContent,
      appSubtitle: (document.getElementById('app-subtitle') || {}).textContent
    };
    Object.keys(current).forEach(function(key){
      if(current[key] === undefined) return;
      var now = JSON.stringify(current[key]);
      if(META_SHADOW[key] !== now){
        META_SHADOW[key] = now;
        ops.push({ opId: uid(), meta: key, value: current[key] });
      }
    });
    return ops;
  }

  /* ---- the four persist() entry points the rest of the app already calls ----
     They all funnel into the same diff now; which module changed doesn't matter
     because the diff finds it either way. */
  function persist(){ queueChanges(); }
  function persistCalendar(){ queueChanges(); }
  function persistDreams(){ queueChanges(); }
  function persistCompass(){ queueChanges(); }

  var flushSoon = debounce(function(){ flushQueue(); }, 600);

  function queueChanges(){
    // Anything of a kind this server has already rejected stays local rather than being
    // re-queued each time only to be dropped again on the next flush.
    var ops = collectOps().concat(collectMetaOps()).filter(function(op){
      return !op.kind || serverKnowsKind(op.kind);
    });
    cacheAllLocal();
    if(!ops.length) return;
    sync.queue = sync.queue.concat(ops);
    saveSyncLocal();
    updateSyncStatus(sync.online ? 'busy' : 'offline');
    flushSoon();
  }

  function apiFetch(path, opts){
    var o = Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts || {});
    o.headers = Object.assign({ 'accept': 'application/json' }, o.headers || {});
    return fetch(path, o).then(function(res){
      return res.text().then(function(text){
        var body = null;
        try{ body = text ? JSON.parse(text) : null; }catch(e){ body = null; }
        if(!res.ok){
          var err = new Error((body && body.error) || ('Sync error ' + res.status));
          err.status = res.status;
          err.code = body && body.code;
          throw err;
        }
        return body;
      });
    });
  }

  function flushQueue(){
    if(sync.inFlight || !sync.queue.length) return Promise.resolve();
    sync.inFlight = true;
    updateSyncStatus('busy');
    // Send at most a batch at a time so one enormous first push (a migration, say)
    // doesn't hit the request ceiling.
    var batch = sync.queue.slice(0, 200);
    return apiFetch('/api/mutate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ops: batch })
    }).then(function(res){
      var done = {};
      (res.applied || []).forEach(function(id){ done[id] = true; });
      (res.skipped || []).forEach(function(id){ done[id] = true; });
      sync.queue = sync.queue.filter(function(op){ return !done[op.opId]; });
      sync.backoff = 0;
      sync.lastError = null;
      sync.online = true;
      saveSyncLocal();
      sync.inFlight = false;
      // Pull straight away: our own write bumped the cursor, and anyone else's
      // changes since the last poll are sitting there too.
      return pull().then(function(){
        if(sync.queue.length) return flushQueue();
      });
    }).catch(function(err){
      sync.inFlight = false;
      // The server rejects the WHOLE batch on an unknown kind, and the ops stay queued -- so a
      // server one version behind the app would retry forever and block every other change on
      // the device. Note the kind, drop those ops, and keep the rest moving. Those items still
      // work locally; they just don't sync until the API files are updated too.
      if(err.status === 400 && err.code === 'bad_kind'){
        var m = /Unknown kind:\s*([\w-]+)/.exec(err.message || '');
        if(m && !sync.unknownKinds[m[1]]){
          sync.unknownKinds[m[1]] = true;
          sync.queue = sync.queue.filter(function(op){ return serverKnowsKind(op.kind); });
          saveSyncLocal();
          return flushQueue();
        }
      }
      handleSyncError(err, function(){ flushQueue(); });
    });
  }

  // Kinds this server has said it doesn't understand. Only a real rejection populates this,
  // so a fully updated deployment never takes this path.
  function serverKnowsKind(kind){ return !sync.unknownKinds[kind]; }

  function pull(){
    return apiFetch('/api/state?since=' + sync.cursor).then(function(res){
      applyRemote(res);
      sync.backoff = 0;
      sync.lastError = null;
      sync.online = true;
      updateSyncStatus(sync.queue.length ? 'busy' : 'ok');
      // A truncated first page means there is more history to walk through.
      if(res && res.caughtUp === false) return pull();
    }).catch(function(err){
      handleSyncError(err, function(){ pull(); });
    });
  }

  function applyRemote(res){
    if(!res) return;
    var items = res.items || [];
    var meta = res.meta || {};
    var changed = false;

    // Never let a remote copy overwrite an item we have unsent edits for — ours
    // is newer by definition and is about to be pushed.
    var pending = {};
    sync.queue.forEach(function(op){ if(op.id) pending[shadowKey(op.kind, op.id)] = true; });

    // While a modal is open the user is editing a draft of one of these; applying
    // underneath them is how you get a save that silently reverts. Hold and apply
    // on close instead.
    if(items.length && document.getElementById('modal-root').innerHTML !== ''){
      sync.deferred = (sync.deferred || []).concat(items);
      if(res.seq) { sync.cursor = res.seq; saveSyncLocal(); }
      return;
    }

    items.forEach(function(item){
      var k = SYNC_KINDS[item.kind];
      if(!k) return;
      var key = shadowKey(item.kind, item.id);
      if(pending[key]) return;
      var list = k.get() || [];
      var idx = -1;
      for(var i=0;i<list.length;i++){ if(k.idOf(list[i]) === item.id){ idx = i; break; } }
      if(item.gone){
        if(idx !== -1){ list.splice(idx, 1); changed = true; }
        delete sync.shadow[key];
      } else {
        var incoming = item.data;
        if(idx === -1){ list.push(incoming); changed = true; }
        else if(JSON.stringify(list[idx]) !== JSON.stringify(incoming)){ list[idx] = incoming; changed = true; }
        sync.shadow[key] = JSON.stringify(incoming);
      }
      k.set(list);
    });

    Object.keys(meta).forEach(function(key){
      var value = meta[key];
      META_SHADOW[key] = JSON.stringify(value);
      if(key === 'homeTimezone' && value && value !== state.homeTimezone){ state.homeTimezone = value; changed = true; }
      if(key === 'appTitle' && value){ var t = document.getElementById('app-title'); if(t && t.textContent !== value) t.textContent = value; }
      if(key === 'appSubtitle' && value){ var s2 = document.getElementById('app-subtitle'); if(s2 && s2.textContent !== value) s2.textContent = value; }
    });

    if(res.seq){ sync.cursor = res.seq; }
    saveSyncLocal();

    if(changed){
      state.tasks = migrateTasks(state.tasks);
      rebuildShadowForTasks();
      resolveCurrentFamilyMember();
      cacheAllLocal();
      render();
    }
  }

  // migrateTasks() can add default fields, which would otherwise look like a local
  // edit on the very next diff and cause a pointless write loop.
  function rebuildShadowForTasks(){
    (state.tasks || []).forEach(function(t){
      sync.shadow[shadowKey('task', t.id)] = JSON.stringify(t);
    });
  }

  function applyDeferred(){
    if(!sync.deferred || !sync.deferred.length) return;
    var items = sync.deferred;
    sync.deferred = null;
    applyRemote({ items: items, meta: {}, seq: sync.cursor });
  }

  function handleSyncError(err, retry){
    sync.lastError = err;
    var offline = (typeof navigator !== 'undefined' && navigator.onLine === false) || err.status === undefined;
    sync.online = !offline;
    updateSyncStatus(offline ? 'offline' : (err.code === 'no_db' || err.code === 'no_schema' ? 'setup' : 'err'));
    // Exponential backoff, capped — a flaky café wifi shouldn't hammer the API.
    sync.backoff = Math.min(sync.backoff ? sync.backoff * 2 : 5000, 60000);
    setTimeout(function(){ if(retry) retry(); }, sync.backoff);
  }

  function startSync(){
    if(sync.started) return;
    sync.started = true;
    if(sync.pollTimer) clearInterval(sync.pollTimer);
    // 30s is frequent enough that "Mum already did that one" shows up before you
    // duplicate it, and cheap enough to leave running on six devices all day.
    sync.pollTimer = setInterval(function(){
      if(document.hidden) return;
      if(sync.queue.length) flushQueue(); else pull();
    }, 30000);

    document.addEventListener('visibilitychange', function(){
      if(!document.hidden){ if(sync.queue.length) flushQueue(); else pull(); }
    });
    window.addEventListener('focus', function(){ if(sync.queue.length) flushQueue(); else pull(); });
    window.addEventListener('online', function(){ sync.online = true; sync.backoff = 0; flushQueue(); pull(); });
    window.addEventListener('offline', function(){ sync.online = false; updateSyncStatus('offline'); });
    // Last-ditch: warn if someone closes the tab with unsent edits.
    window.addEventListener('beforeunload', function(e){
      if(sync.queue.length){ e.preventDefault(); e.returnValue = ''; return ''; }
    });
  }

  function bootSync(){
    loadCalSources();
    loadSyncLocal();
    // Paint from cache first so the app is usable before the network answers.
    loadLocal(); loadCalendarLocal(); loadDreamsLocal(); loadCompassLocal();
    rebuildShadow();
    META_SHADOW = {
      homeTimezone: JSON.stringify(state.homeTimezone),
      appTitle: JSON.stringify((document.getElementById('app-title')||{}).textContent),
      appSubtitle: JSON.stringify((document.getElementById('app-subtitle')||{}).textContent)
    };
    resolveCurrentFamilyMember();
    render();
    updateSyncStatus('busy');

    return apiFetch('/api/health').then(function(h){
      if(h && h.ok === false) throw Object.assign(new Error(h.message), { code: h.code, status: 503 });
      // A store with nothing in it and no cursor means this device has never
      // synced and nobody has migrated yet — say so rather than looking "synced".
      var empty = h && h.seq === 0;
      return pull().then(function(){
        // Only after a real pull: seeding before we know what the store holds would resurrect
        // categories the family had deleted.
        seedCategoriesIfEmpty(true);
        startSync();
        if(sync.queue.length) flushQueue();
        showSetupBanner(empty && !state.tasks.length && !state.events.length);
      });
    }).catch(function(err){
      // No server to ask, so this device is on its own copy -- it still needs categories to
      // render, but it must not write them to the cache yet: a boot that failed hasn't loaded
      // anyone else's data, and persisting here would overwrite the cache with a half-empty
      // state. The next boot that reaches the server persists them properly.
      seedCategoriesIfEmpty(false);
      handleSyncError(err, function(){ bootSync(); });
      startSync();
    });
  }

  /* The seed runs once per store. "Other" can't be deleted, so a store that has ever been
     seeded always has at least one category -- which makes "empty" a safe test for "new",
     and stops a second device re-adding categories someone deliberately removed. */
  function seedCategoriesIfEmpty(persist){
    if((state.eventCategories || []).length) return;
    state.eventCategories = EVENT_CATEGORY_SEED.map(function(c, i){
      return { id:c.id, label:c.label, icon:c.icon, color:c.color, order:i };
    });
    if(persist) persistCalendar();
    render();
  }

  function updateSyncStatus(s){
    state.syncStatus = s;
    var el = document.getElementById('sync-status');
    if(!el) return;
    var cls = (s === 'ok') ? 'ok' : (s === 'busy') ? 'busy' : (s === 'err' || s === 'setup') ? 'err' : (s === 'offline') ? 'busy' : '';
    el.className = 'sync-status ' + cls;
    var queued = sync.queue.length;
    var label;
    if(s === 'ok')            label = 'All changes saved';
    else if(s === 'busy')     label = queued ? ('Saving ' + queued + ' change' + (queued===1?'':'s') + '…') : 'Syncing…';
    else if(s === 'offline')  label = queued ? ('Offline — ' + queued + ' change' + (queued===1?'':'s') + ' waiting') : 'Offline — will sync when you reconnect';
    else if(s === 'setup')    label = 'Sync not set up yet — open settings';
    else if(s === 'err')      label = 'Sync problem — click to retry' + (sync.lastError && sync.lastError.message ? ' (' + sync.lastError.message + ')' : '');
    else                      label = s;
    el.innerHTML = '<span class="dot"></span>' + escapeHtml(label);
  }

  function showSetupBanner(show){
    var b = document.getElementById('setup-banner');
    if(!b) return;
    if(show) b.classList.remove('hidden'); else b.classList.add('hidden');
  }

  // Small diagnostic handle. When someone says "it's not saving", this answers
  // the only three questions that matter without a debugger: what's the status,
  // how much is queued, and what did the server last complain about.
  window.taskManagerSync = {
    get status(){ return state.syncStatus; },
    get queued(){ return sync.queue.length; },
    get cursor(){ return sync.cursor; },
    get lastError(){ return sync.lastError ? String(sync.lastError.message) : null; },
    pull: function(){ return pull(); },
    flush: function(){ return flushQueue(); },
    now: function(){ retrySyncNow(); },
    // Inspection handles: what this device currently holds, and a way to ask the recurrence
    // engine what it would produce for a date range without reading it off the screen.
    get data(){ return state; },
    expand: function(from, to){ return expandOccurrences(from, to); },
    // Re-runs the "who is this?" step the app does after Cloudflare Access answers. Handy for
    // checking what a different family member's app looks like without logging out.
    whoami: function(){ resolveCurrentFamilyMember(); render(); return state.currentFamilyMember; }
  };

  function retrySyncNow(){
    sync.backoff = 0;
    if(sync.queue.length) flushQueue(); else pull();
  }

  /* ---- one-time migration off GitHub ----
     Read-only: it fetches the four old JSON files and hands them to /api/import.
     Nothing is ever written back to GitHub, and the token is used for this call
     only — it is not stored for ongoing sync any more. */
  function fetchGithubJson(cfg, path){
    var url = 'https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+encodeURIComponent(path)+'?ref='+encodeURIComponent(cfg.branch||'main');
    var headers = { 'Accept':'application/vnd.github+json' };
    if(cfg.token) headers['Authorization'] = 'token ' + cfg.token;
    return fetch(url, { headers: headers }).then(function(res){
      if(res.status === 404) return null;
      if(!res.ok) throw new Error('GitHub said ' + res.status + ' for ' + path);
      return res.json().then(function(data){
        if(!data.content) return null;
        try{ return JSON.parse(b64DecodeUnicode(data.content)); }catch(e){ throw new Error('Could not parse ' + path); }
      });
    });
  }

  function importFromGithub(cfg, force){
    return Promise.all([
      fetchGithubJson(cfg, cfg.path || 'tasks.json'),
      fetchGithubJson(cfg, cfg.calendarPath || 'family-calendar.json'),
      fetchGithubJson(cfg, cfg.dreamsPath || 'vision-board.json'),
      fetchGithubJson(cfg, cfg.compassPath || 'compass.json')
    ]).then(function(files){
      return importPayload({
        tasks: (files[0] && files[0].tasks) || [],
        calendar: files[1] || {},
        dreams: (files[2] && files[2].dreams) || [],
        compass: files[3] || {}
      }, force);
    });
  }

  function importPayload(payload, force){
    return apiFetch('/api/import' + (force ? '?force=1' : ''), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      // Start clean: take the imported store as the new truth on this device.
      sync.cursor = 0;
      sync.queue = [];
      sync.shadow = {};
      saveSyncLocal();
      return pull().then(function(){ return res; });
    });
  }

  /* ================= RENDER: HEADER ================= */
  function renderPersonTabs(){
    var container = document.getElementById('person-tabs');
    var locked = lockedPersonId();
    if(locked){
      state.person = locked;
      container.innerHTML = '';
      container.classList.add('hidden');
      return;
    }
    container.classList.remove('hidden');
    var html = '<button data-person="all" class="'+(state.person==='all'?'active':'')+'">All</button>'
      + state.family.map(function(m){
          return '<button data-person="'+m.id+'" class="'+(state.person===m.id?'active':'')+'">'+escapeHtml(m.name)+'</button>';
        }).join('')
      + '<button data-person="shared" class="'+(state.person==='shared'?'active':'')+'">Shared</button>';
    container.innerHTML = html;
    container.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        state.person = b.dataset.person;
        state.personTouched = true;   // stop the identity default from stealing the tab back
        state.dayFilter = null;       // a different person's week is a different week
        render();
      });
    });
  }

  /* ================= FILTERING ================= */
  function isSharedTask(t){ return (t.assignees||[]).length > 1; } // "shared" = assigned to more than one specific person
  // Normalizes tasks to the current assignees:[memberId,...] shape (any task missing it -- e.g.
  // old test/dummy data -- just starts out unassigned rather than trying to guess).
  function migrateTasks(tasks){
    return (tasks||[]).map(function(t){
      var copy = Object.assign({ deleted:false, deletedAt:null }, t);
      if(!copy.assignees) copy.assignees = [];
      delete copy.assignee;
      return copy;
    });
  }
  function personMatch(t){
    var filter = lockedPersonId() || state.person;
    var assignees = t.assignees || [];
    if(filter === 'all') return true;
    if(filter === 'shared') return assignees.length > 1;
    return assignees.indexOf(filter) !== -1;
  }
  function searchMatch(t){
    if(!state.search) return true;
    var q = state.search.toLowerCase();
    if(t.title && t.title.toLowerCase().indexOf(q) !== -1) return true;
    if(t.tags && t.tags.some(function(tag){ return tag.toLowerCase().indexOf(q) !== -1; })) return true;
    return false;
  }
  /* Board order: undated tasks first, then by due date with the soonest at the top.
     Overdue items therefore rise above today's, which is what you want on a board whose
     whole job is showing what needs attention. Dates are ISO strings, so a plain string
     compare is already chronological. sort() is stable, so tasks that tie keep the order
     they were added in rather than shuffling on every render. */
  function compareByDue(a, b){
    if(!a.due && !b.due) return 0;
    if(!a.due) return -1;
    if(!b.due) return 1;
    return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
  }

  function visibleTasks(){
    return state.tasks.filter(function(t){ return !t.completed && !t.deleted && personMatch(t) && searchMatch(t); });
  }

  /* ================= RENDER: MATRIX / LIST / ARCHIVE ================= */
  function avatarHtml(assignees){
    var list = (assignees||[]).map(familyMember).filter(Boolean);
    if(!list.length) return '<span class="tc-avatars"><span class="avatar" style="background:var(--ink-muted)">?</span></span>';
    return '<span class="tc-avatars">'+list.slice(0,4).map(function(m,i){
      return '<span class="avatar" style="background:'+m.color+';'+(i>0?'margin-left:-8px;':'')+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('')+'</span>';
  }
  function metaPillsHtml(t){
    var pills = '';
    if(t.due){
      var overdue = t.due < todayStr();
      var isToday = t.due === todayStr();
      var cls = overdue ? 'due-overdue' : (isToday ? 'due-today' : '');
      pills += '<span class="meta-pill '+cls+'">'+(overdue?'Overdue ':'')+fmtDate(t.due)+'</span>';
    }
    if(t.recurrence && t.recurrence.freq){
      pills += '<span class="meta-pill repeats" title="'+escapeHtml(describeRecurrence(t.recurrence))+'">'+icon('refresh')+shortRecurrence(t.recurrence)+'</span>';
    }
    if(t.subtasks && t.subtasks.length){
      var done = t.subtasks.filter(function(s){return s.done;}).length;
      pills += '<span class="meta-pill">'+icon('checksq')+done+'/'+t.subtasks.length+'</span>';
    }
    (t.tags||[]).forEach(function(tag){
      pills += '<span class="meta-pill tag">'+escapeHtml(tag)+'</span>';
    });
    return pills;
  }
  function taskCardHtml(t){
    return '<div class="task-card" draggable="true" data-id="'+t.id+'">'
      + '<div class="tc-top">'
      + '<span class="tc-check'+(t.completed?' checked':'')+'" data-action="toggle" data-id="'+t.id+'">'+(t.completed?icon('check'):'')+'</span>'
      + '<span class="tc-title'+(t.completed?' done':'')+'">'+escapeHtml(t.title)+'</span>'
      + avatarHtml(t.assignees)
      + '</div>'
      + '<div class="tc-meta">'+metaPillsHtml(t)+'</div>'
      + '</div>';
  }

  function renderMatrix(){
    var tasks = visibleTasks().sort(compareByDue);
    var byQ = {doFirst:[],schedule:[],delegate:[],eliminate:[]};
    tasks.forEach(function(t){ byQ[quadrantOf(t)].push(t); });

    function panel(qkey){
      var q = QUADRANTS[qkey];
      var list = byQ[qkey];
      var header = '<div class="q-header">'
        + '<span class="dot" style="background:'+q.accent+'"></span>'
        + '<div class="q-header-text"><div class="q-title">'+q.title+'</div><div class="q-subtitle">'+q.subtitle+'</div></div>'
        + '<span class="q-count">'+list.length+'</span>'
        + '</div>';
      // An empty quadrant shrinks to its header rather than holding open 220px of nothing.
      // The drop target moves onto the panel itself so a task can still be dragged into an
      // empty quadrant -- collapsing it must not quietly remove the way to fill it.
      if(!list.length){
        return '<div class="quadrant '+q.cls+' is-collapsed" data-quadrant="'+qkey+'">' + header + '</div>';
      }
      return '<div class="quadrant '+q.cls+'">' + header
        + '<div class="q-body" data-quadrant="'+qkey+'">' + list.map(taskCardHtml).join('') + '</div>'
        + '</div>';
    }

    // A board with nothing on it shouldn't stretch to fill a 1080px-tall window — that just
    // makes four large voids. It stays compact until there's something to show.
    var boardEmpty = !tasks.length;
    var anyCollapsed = QUADRANT_ORDER.some(function(k){ return !byQ[k].length; });
    var html = '<div class="matrix-outer"><div class="matrix-cross'+(boardEmpty?' matrix-empty':'')+(anyCollapsed?' has-collapsed':'')+'">'
      + '<span></span>'
      + '<span class="axis-top urgent">Urgent</span>'
      + '<span class="axis-top not-urgent">Not Urgent</span>'
      + '<span class="axis-left important">Important</span>'
      + panel('doFirst')
      + panel('schedule')
      + '<span class="axis-left not-important">Not Important</span>'
      + panel('delegate')
      + panel('eliminate')
      + '</div></div>';
    document.getElementById('view-root').innerHTML = html;
    attachDragAndDrop();
    attachCardHandlers();
  }

  /* Subjects come from task tags. Imported course calendars don't carry a per-course tag --
     they carry one category for the whole feed -- so this is the tag the task itself has. */
  function subjectsOf(tasks){
    var seen = {}, out = [];
    tasks.forEach(function(t){
      (t.tags||[]).forEach(function(tag){
        var k = tag.trim();
        if(k && !seen[k]){ seen[k] = true; out.push(k); }
      });
    });
    return out.sort(function(a,b){ return a.localeCompare(b); });
  }

  function renderWeekLoad(tasks){
    var today = todayStr();
    var days = [];
    for(var i = 0; i < 7; i++){
      var d = dateAdd(today, i);
      days.push({ date:d, n: tasks.filter(function(t){ return t.due === d; }).length });
    }
    var max = Math.max.apply(null, days.map(function(x){ return x.n; }));
    // Nothing due this week: the strip would just be a row of zeros. But if a day is currently
    // filtered -- say you ticked off the last thing while looking at it -- hiding the strip
    // would take the only way back out with it, so keep it.
    if(!max && !state.dayFilter) return '';
    var bars = days.map(function(x){
      var h = 10 + Math.round((x.n / (max || 1)) * 46);
      var cls = x.n === 0 ? ' empty' : (x.n === max && max > 1 ? ' busy' : '');
      if(state.dayFilter === x.date) cls += ' picked';
      // The strip runs seven days from today, so it usually crosses into next week. Marking
      // where that happens keeps it honest against the "This week" column beside it, which
      // stops at Saturday.
      if(x.date !== today && new Date(x.date+'T00:00:00').getDay() === 0) cls += ' newweek';
      var label = x.date === today ? 'Today' : new Date(x.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
      // A button, not a div: the whole point is that it's tappable, and a kid on a phone
      // shouldn't have to guess. Keyboard and screen readers get it for free.
      return '<button type="button" class="load-day'+cls+'" data-day="'+x.date+'"'
        + ' aria-pressed="'+(state.dayFilter === x.date)+'"'
        + ' title="'+escapeHtml(dayFilterLabel(x.date))+' — '+x.n+' due">'
        + '<span class="load-n">'+x.n+'</span>'
        + '<span class="load-bar" style="height:'+h+'px"></span>'
        + '<span class="load-label">'+escapeHtml(label)+'</span></button>';
    }).join('');
    var note;
    if(state.dayFilter){
      var picked = days.filter(function(x){ return x.date === state.dayFilter; })[0];
      var n = picked ? picked.n : 0;
      note = 'Showing ' + (n === 1 ? 'the 1 task' : n + ' tasks') + ' due ' + dayFilterLabel(state.dayFilter) + '.';
    } else {
      // Every day at the peak is highlighted, so the sentence has to name all of them --
      // flagging two bars and mentioning one reads like a bug.
      var peaks = days.filter(function(x){ return x.n === max; });
      var names = peaks.map(function(x){
        return x.date === today ? 'Today' : new Date(x.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'});
      });
      if(max < 2) note = 'Nothing stacked up in the next 7 days.';
      else if(names.length === 1) note = names[0] + ' has ' + max + ' things due.';
      else note = names.slice(0,-1).join(', ') + ' and ' + names[names.length-1] + ' each have ' + max + ' due.';
    }
    // Named for what it actually shows. It rolls forward from today, so calling it "the week"
    // would contradict the This week column, which stops on Saturday.
    return '<section class="week-load"><h2>The next 7 days</h2><div class="load-row" id="load-row">'+bars+'</div>'
      + '<p class="load-note">' + escapeHtml(note)
      + (state.dayFilter ? ' <button type="button" class="load-clear" id="load-clear">Show all 7 days</button>' : '')
      + '</p></section>';
  }

  // "Today"/"Tomorrow" beat a date anyone has to decode, and a weekday beats both for the
  // rest of the week -- nobody thinks of Thursday's homework as "the 3rd".
  function dayFilterLabel(date){
    var today = todayStr();
    if(date === today) return 'today';
    if(date === dateAdd(today, 1)) return 'tomorrow';
    return new Date(date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'});
  }

  function renderHorizon(){
    var tasks = visibleTasks().sort(compareByDue);
    if(state.subjectFilter){
      tasks = tasks.filter(function(t){ return (t.tags||[]).indexOf(state.subjectFilter) !== -1; });
    }
    var byBucket = { overdue:[], today:[], week:[], later:[], none:[] };
    tasks.forEach(function(t){ byBucket[horizonBucket(t)].push(t); });

    // Subject pills are drawn from every visible task, not the filtered set, so choosing one
    // doesn't make the others disappear from the control you'd use to switch back.
    var subjects = subjectsOf(visibleTasks());
    var subjectBar = subjects.length > 1
      ? '<section class="subject-bar"><h2>Filter by subject</h2><div class="pill-tabs" id="subject-pills">'
        + '<button data-subject="" class="'+(state.subjectFilter?'':'active')+'">All</button>'
        + subjects.map(function(sub){
            return '<button data-subject="'+escapeHtml(sub)+'" class="'+(state.subjectFilter===sub?'active':'')+'">'+escapeHtml(sub)+'</button>';
          }).join('')
        + '</div></section>'
      : '';

    // alwaysBody: the day-filtered view is the only thing on screen, so an empty one says so in
    // words. A bucket column among four others doesn't need to -- its header already reads "0".
    function section(cls, accent, title, subtitle, list, extraCls, alwaysBody){
      var collapse = !list.length && !alwaysBody;
      return '<section class="quadrant horizon-col '+cls+(extraCls?' '+extraCls:'')+(collapse?' is-collapsed':'')+'">'
        + '<div class="q-header">'
        + '<span class="dot" style="background:'+accent+'"></span>'
        + '<div class="q-header-text"><div class="q-title">'+escapeHtml(title)+'</div><div class="q-subtitle">'+escapeHtml(subtitle)+'</div></div>'
        + '<span class="q-count">'+list.length+'</span>'
        + '</div>'
        + (collapse ? ''
             : '<div class="q-body'+(list.length?'':' is-empty')+'">'
               + (list.length ? list.map(taskCardHtml).join('') : '<div class="q-empty">Nothing due then.</div>')
               + '</div>')
        + '</section>';
    }
    function col(key){
      var h = HORIZON[key];
      return section(h.cls, h.accent, h.title, horizonSubtitle(key), byBucket[key], key==='none' ? 'span-all' : '');
    }

    // Picking a day off the strip collapses the five columns into one. Keeping the grid would
    // put every match in a single column with four empty ones beside it, which reads as broken
    // rather than as a filter.
    var board;
    if(state.dayFilter){
      var dayList = tasks.filter(function(t){ return t.due === state.dayFilter; });
      var isToday = state.dayFilter === todayStr();
      board = section(isToday ? 'h-today' : 'h-week',
        isToday ? HORIZON.today.accent : HORIZON.week.accent,
        'Due ' + dayFilterLabel(state.dayFilter),
        new Date(state.dayFilter+'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric'}),
        dayList, 'span-all', true);
    } else {
      board = HORIZON_ORDER.map(col).join('');
    }

    document.getElementById('view-root').innerHTML =
      '<div class="horizon-outer">'
      + renderWeekLoad(visibleTasks())
      + subjectBar
      + '<div class="horizon-board">' + board + '</div>'
      + '</div>';

    document.querySelectorAll('#subject-pills button').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.subjectFilter = btn.dataset.subject || null;
        render();
      });
    });
    document.querySelectorAll('#load-row .load-day').forEach(function(btn){
      btn.addEventListener('click', function(){
        // Clicking the day you're already on is the obvious way to back out of the filter.
        state.dayFilter = (state.dayFilter === btn.dataset.day) ? null : btn.dataset.day;
        render();
      });
    });
    var clearBtn = document.getElementById('load-clear');
    if(clearBtn) clearBtn.addEventListener('click', function(){ state.dayFilter = null; render(); });
    attachCardHandlers();
  }

  /* ================= MESSAGE BOARD =================
     One shared wall for the whole family -- "back late tonight", "bins go out Tuesday". It is
     deliberately not per-person: there is no inbox, no unread count and nobody to address a
     note to. Everything anyone posts is on the same page, newest first, with pinned notes held
     at the top for the things that stay true for a while. */

  function messageAuthor(m){ return familyMember(m.authorId); }

  function sortedMessages(){
    return (state.messages || []).slice().sort(function(a, b){
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;   // pinned first, then newest
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }

  // Your own note, or any note if you're an adult -- somebody has to be able to fix or take
  // down what shouldn't be up there. Pinning is deliberately not gated: see renderMessages.
  function canManageMessage(m){
    var me = state.currentFamilyMember;
    return !!me && (m.authorId === me.id || me.role !== 'kid');
  }
  var canEditMessage = canManageMessage;
  var canDeleteMessage = canManageMessage;

  function renderMessages(){
    var list = sortedMessages();

    // The board is the board. Composing happens in a sheet off the + button, so opening the
    // tab shows what's on the wall rather than an empty box asking you to write something.
    var body = list.length
      ? list.map(function(m){
          var who = messageAuthor(m);
          var edited = m.updatedAt && m.updatedAt !== m.createdAt;
          return '<article class="msg-card' + (m.pinned ? ' pinned' : '') + '" data-msg="' + escapeHtml(m.id) + '">'
            + (m.pinned ? '<span class="msg-pinned-flag">' + icon('star') + 'Pinned</span>' : '')
            + '<div class="msg-head">'
            + avatarHtml([m.authorId])
            + '<span class="msg-who">' + escapeHtml(who ? who.name : 'Someone') + '</span>'
            + '<span class="msg-when" title="' + escapeHtml(m.createdAt || '') + '">' + escapeHtml(fmtRelative(m.createdAt)) + (edited ? ' · edited' : '') + '</span>'
            + '</div>'
            + '<div class="msg-text">' + escapeHtml(m.text || '') + '</div>'
            + '<div class="msg-actions">'
            // Pinning is how the family agrees what matters this week, so it isn't owned by
            // whoever happened to write the note -- anyone can pin or unpin anything.
            + '<button type="button" data-msg-pin="' + escapeHtml(m.id) + '">' + (m.pinned ? 'Unpin' : 'Pin') + '</button>'
            + (canEditMessage(m) ? '<button type="button" data-msg-edit="' + escapeHtml(m.id) + '">Edit</button>' : '')
            + (canDeleteMessage(m) ? '<button type="button" class="danger" data-msg-del="' + escapeHtml(m.id) + '">Delete</button>' : '')
            + '</div></article>';
        }).join('')
      : '<div class="msg-empty">'
        + '<p>Nothing on the board yet.</p>'
        + (state.currentFamilyMember
            ? '<button type="button" class="btn-primary" id="msg-first">Post the first note</button>'
            : '<p class="settings-help" style="margin:0;">We couldn\'t match your login to a family member yet, so there\'s nobody to post as. Ask an adult to add you in Family Settings with the email you log in with.</p>')
        + '</div>';

    document.getElementById('view-root').innerHTML = '<div class="msg-wrap"><div class="msg-list">' + body + '</div></div>';

    var first = document.getElementById('msg-first');
    if(first) first.addEventListener('click', function(){ openMessageModal(null); });

    document.querySelectorAll('[data-msg-pin]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = (state.messages || []).find(function(x){ return x.id === btn.dataset.msgPin; });
        if(!m) return;
        m.pinned = !m.pinned;
        m.updatedAt = nowISO();
        persistMessages(); render();
      });
    });
    document.querySelectorAll('[data-msg-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){ openMessageModal(btn.dataset.msgEdit); });
    });
    document.querySelectorAll('[data-msg-del]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var m = (state.messages || []).find(function(x){ return x.id === btn.dataset.msgDel; });
        if(!m) return;
        if(!window.confirm('Delete this note? Everyone loses it.')) return;
        state.messages = (state.messages || []).filter(function(x){ return x.id !== m.id; });
        persistMessages(); render();
      });
    });
  }

  /* The composer. A sheet rather than a box on the page: the draft lives in the modal's own
     DOM, which render() never touches, so a sync landing mid-sentence can't wipe it. */
  function openMessageModal(id){
    var me = state.currentFamilyMember;
    if(!me) return;
    var existing = id ? (state.messages || []).find(function(m){ return m.id === id; }) : null;
    if(id && !existing) return;

    document.getElementById('modal-root').innerHTML = ''
      + '<div class="scrim" id="scrim"><div class="modal">'
      + '<div class="msg-composer-head">'
      + avatarHtml([me.id])
      + '<span class="msg-composer-who">' + escapeHtml(existing ? 'Editing a note' : (me.name + ', what\'s happening?')) + '</span>'
      + '</div>'
      + '<textarea class="msg-input" id="msg-input" rows="4" placeholder="Back late tonight — dinner\'s in the fridge">'
      + escapeHtml(existing ? (existing.text || '') : '') + '</textarea>'
      + '<label class="check-inline" style="margin-top:12px;"><input type="checkbox" id="msg-pin-new"'
      + (existing && existing.pinned ? ' checked' : '') + '> Keep at the top</label>'
      + '<div class="modal-footer">'
      + '<span></span>'
      + '<div style="display:flex;gap:10px;">'
      + '<button class="btn-sm" id="msg-cancel">Cancel</button>'
      + '<button class="btn-close" id="msg-post">' + (existing ? 'Save' : 'Post') + '</button>'
      + '</div></div></div></div>';

    function close(){ document.getElementById('modal-root').innerHTML = ''; applyDeferred(); }
    document.getElementById('scrim').addEventListener('click', function(e){ if(e.target.id === 'scrim') close(); });
    document.getElementById('msg-cancel').addEventListener('click', close);

    var input = document.getElementById('msg-input');
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    function submit(){
      var text = input.value.trim();
      if(!text) return;   // an empty note is a mis-tap, not a post
      var pinned = document.getElementById('msg-pin-new').checked;
      if(existing){
        existing.text = text;
        existing.pinned = pinned;
        existing.updatedAt = nowISO();
      } else {
        state.messages.push({
          id: uid(), text: text, authorId: me.id,
          createdAt: nowISO(), updatedAt: nowISO(), pinned: pinned
        });
      }
      close();
      persistMessages();
      render();
      showToast(existing ? 'Note updated' : 'Posted to the board', false, 2200);
    }
    document.getElementById('msg-post').addEventListener('click', submit);
    // Ctrl/Cmd+Enter posts; a plain Enter has to stay available for a new line.
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); submit(); }
    });
  }

  function persistMessages(){ queueChanges(); }

  function renderList(){
    var tasks = visibleTasks().sort(compareByDue);
    var byQ = {doFirst:[],schedule:[],delegate:[],eliminate:[]};
    tasks.forEach(function(t){ byQ[quadrantOf(t)].push(t); });

    function group(qkey){
      var q = QUADRANTS[qkey];
      var list = byQ[qkey];
      var rows = list.length ? list.map(function(t){
        return '<div class="list-row" data-id="'+t.id+'">'
          + '<span class="tc-check'+(t.completed?' checked':'')+'" data-action="toggle" data-id="'+t.id+'">'+(t.completed?icon('check'):'')+'</span>'
          + '<span class="tc-title'+(t.completed?' done':'')+'">'+escapeHtml(t.title)+'</span>'
          + (t.due ? '<span class="meta-pill'+(t.due<todayStr()?' due-overdue':(t.due===todayStr()?' due-today':''))+'">'+fmtDate(t.due)+'</span>' : '')
          + avatarHtml(t.assignees)
          + '</div>';
      }).join('') : '<div class="list-empty">Nothing here.</div>';
      return '<div class="list-group"><div class="q-header" style="background:'+ {doFirst:'var(--do-first-tint)',schedule:'var(--schedule-tint)',delegate:'var(--delegate-tint)',eliminate:'var(--eliminate-tint)'}[qkey] +'">'
        + '<span class="dot" style="background:'+q.accent+'"></span>'
        + '<div class="q-header-text"><div class="q-title">'+q.title+'</div></div>'
        + '<span class="q-count">'+list.length+'</span></div>'+rows+'</div>';
    }
    document.getElementById('view-root').innerHTML = '<div class="list-view">'+QUADRANT_ORDER.map(group).join('')+'</div>';
    attachCardHandlers();
  }

  function renderArchive(){
    // Archive holds both completed tasks and soft-deleted tasks. Deleting a task anywhere else
    // in the app just moves it here (deleted:true) - it stays fully recoverable via Restore.
    // Only the Delete button in this view actually removes a record for good.
    var items = state.tasks.filter(function(t){ return (t.completed || t.deleted) && personMatch(t); })
      .sort(function(a,b){ return ((b.deletedAt||b.completedAt)||'').localeCompare((a.deletedAt||a.completedAt)||''); });
    var html = items.length ? items.map(function(t){
      var label = t.deleted
        ? 'Deleted '+(t.deletedAt?fmtDate(t.deletedAt.slice(0,10)):'')
        : 'Completed '+(t.completedAt?fmtDate(t.completedAt.slice(0,10)):'');
      return '<div class="archive-row'+(t.deleted?' deleted':'')+'" data-id="'+t.id+'">'
        + avatarHtml(t.assignees)
        + '<span class="tc-title done" style="flex:1">'+escapeHtml(t.title)+'</span>'
        + '<span class="archive-date">'+label+'</span>'
        + '<button class="btn-sm" data-action="restore" data-id="'+t.id+'">Restore</button>'
        + '<button class="btn-sm danger" data-action="delete" data-id="'+t.id+'">Delete</button>'
        + '</div>';
    }).join('') : '<div class="list-empty">Nothing archived yet.</div>';
    document.getElementById('view-root').innerHTML = '<div class="archive-view">'+html+'</div>';

    document.getElementById('view-root').querySelectorAll('[data-action="restore"]').forEach(function(btn){
      btn.addEventListener('click', function(){ restoreTask(btn.dataset.id); });
    });
    document.getElementById('view-root').querySelectorAll('[data-action="delete"]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteTask(btn.dataset.id, true); });
    });
    document.getElementById('view-root').querySelectorAll('.archive-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if(e.target.closest('button')) return;
        openTaskModal(row.dataset.id);
      });
    });
  }

  /* ================= CALENDAR: RENDER ================= */
  function familyMember(id){ return state.family.find(function(m){ return m.id===id; }); }
  function categoryOf(occ){ return categoryById(occ.category); }

  /* The colour an occurrence is drawn in. A calendar the user has given its own colour wins;
     otherwise it falls back to the colour of its category, which is what everything used
     before this existed. */
  function occColor(occ){
    if(occ && occ.subscriptionId){
      var sub = findSubscription(occ.subscriptionId);
      if(sub && sub.color) return sub.color;
    }
    return categoryOf(occ).color;
  }

  function occFromOccurrenceId(occId){
    var sep = occId.indexOf('::');
    if(sep === -1){
      var ev = findEventById(occId);
      if(!ev) return null;
      return Object.assign({}, ev, { occurrenceId: ev.id, occurrenceDate: ev.date, isOverride: !!ev.recurrenceId, isVirtual:false });
    }
    var masterId = occId.slice(0,sep), date = occId.slice(sep+2);
    var master = findEventById(masterId);
    if(!master) return null;
    var span = eventSpanDays(master);
    return Object.assign({}, master, {
      occurrenceId: occId, occurrenceDate: date, date: date,
      endDate: span ? dateAdd(date, span) : master.endDate,
      isOverride:false, isVirtual:true, masterId: masterId
    });
  }

  /* Hiding imported events.

     A subscribed feed is all-or-nothing at the source -- a school calendar carries every
     year group's assemblies, a sports feed carries fixtures for teams your kid isn't on.
     Removing the whole subscription is too blunt, so single events (or a whole repeating
     series) can be hidden instead.

     The list lives on the subscription rather than on the person: an imported event is only
     ever visible to the subscription's owner anyway, so keeping it there means it syncs to
     every device that person uses, survives a re-sync, and shows up in My Calendars -- which
     is where you'd go looking for it. Keys are the event id for a whole series, or
     "<id>::<date>" for one date of one. Both are stable across re-syncs because the imported
     id is derived from the feed's own UID. */
  function hideKeyFor(event, dateStr){ return dateStr ? (event.id + '::' + dateStr) : event.id; }

  function isHiddenImport(event, dateStr){
    if(!event || event.source !== 'ics') return false;
    var sub = findSubscription(event.subscriptionId);
    var list = sub && sub.hidden;
    if(!list || !list.length) return false;
    return list.indexOf(hideKeyFor(event, dateStr)) !== -1;
  }

  function setImportHidden(event, dateStr, hidden){
    var sub = findSubscription(event.subscriptionId);
    if(!sub) return;
    var key = hideKeyFor(event, dateStr);
    var list = (sub.hidden || []).slice();
    var i = list.indexOf(key);
    if(hidden && i === -1) list.push(key);
    else if(!hidden && i !== -1) list.splice(i, 1);
    sub.hidden = list;
    persistCalendar();
  }

  // Everything currently hidden on one subscription, resolved back to something readable.
  // A key whose event has since vanished from the feed is dropped -- it can't come back.
  function hiddenEntriesFor(sub){
    return (sub.hidden || []).map(function(key){
      var parts = key.split('::');
      var ev = state.events.find(function(e){ return e.id === parts[0]; });
      if(!ev) return null;
      return { key: key, title: ev.title, date: parts[1] || ev.date, wholeSeries: !parts[1] && !!ev.recurrence };
    }).filter(Boolean);
  }

  // Which "calendar" an occurrence belongs to, for the source pills.
  function occSourceKey(occ){
    if(occ.kind === 'task') return 'tasks';
    return occ.subscriptionId || 'manual';
  }

  function eventMatchesFilter(occ){
    if(state.calSources && state.calSources.length && state.calSources.indexOf(occSourceKey(occ)) === -1) return false;
    if(state.calFilter !== 'all'){
      if(occ.kind === 'task'){
        var as = occ.attendees || [];
        if(as.indexOf(state.calFilter) === -1) return false;
      } else {
        var att = occ.attendees || ['all'];
        if(att.indexOf('all') === -1 && att.indexOf(state.calFilter) === -1) return false;
      }
    }
    if(state.calSearch){
      var q = state.calSearch.toLowerCase();
      var hay = ((occ.title||'')+' '+(occ.location||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  // Formats an occurrence's time-of-day for display, converted from the family's home timezone
  // into the CURRENT VIEWER's own timezone (if they've set a different one in Family Settings).
  // Imported (ICS) events are formatted but not zone-converted -- we don't reliably know what zone
  // they were parsed in, so we show their time-of-day as-is rather than guess and get it wrong.
  function displayEventTime(occ){
    if(occ.allDay || !occ.time) return 'All day';
    if(occ.source === 'ics') return formatTime12(occ.time);
    var home = state.homeTimezone || DEFAULT_TIMEZONE;
    var viewerZone = (state.currentFamilyMember && state.currentFamilyMember.timezone) || home;
    if(viewerZone === home) return formatTime12(occ.time);
    var converted = convertWallClockZone(occ.occurrenceDate, occ.time, home, viewerZone);
    return formatTime12(converted.time);
  }

  function attendeeAvatarsHtml(occ){
    var att = occ.attendees || ['all'];
    var members = (att.indexOf('all') !== -1) ? state.family.slice(0,4) : att.map(familyMember).filter(Boolean);
    return members.map(function(m){
      return '<span class="avatar" style="background:'+m.color+';margin-left:-6px;" title="'+escapeHtml(m.name)+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('');
  }

  function eventChipHtml(occ){
    var cat = categoryOf(occ);
    var importedMark = occ.source === 'ics' ? icon('download')+' ' : '';
    return '<div class="event-chip" style="background:'+occColor(occ)+'" data-occ="'+occ.occurrenceId+'" title="'+escapeHtml((occ.source==='ics'?'Imported · ':'')+occ.title)+'">'
      + '<span class="ec-icon">'+icon(cat.icon)+'</span><span class="ec-title">'+importedMark+escapeHtml(occ.title)+'</span></div>';
  }

  /* ---- Tasks-with-due-dates, shown alongside events on the calendar ---- */
  // Tasks stay a separate data model from Events (per design), but any task with a due date is
  // projected into a lightweight pseudo-occurrence so it can slot into the same day cells / agenda
  // rows as events. Clicking one opens the real Task modal, not the Event modal.
  function taskAsCalOccurrence(t, dateStr, isFuture){
    return {
      kind:'task',
      occurrenceId: 'task::'+t.id+'::'+dateStr,
      taskId: t.id,
      occurrenceDate: dateStr,
      title: t.title,
      attendees: (t.assignees || []).slice(),
      completed: !isFuture && !!t.completed,   // a future repeat is never already done
      future: !!isFuture,
      quadrant: quadrantOf(t)
    };
  }
  function taskOccurrencesInRange(rangeStart, rangeEnd){
    var out = [];
    (state.tasks || []).forEach(function(t){
      if(!t.due || t.deleted) return;
      if(!t.recurrence){
        if(t.due >= rangeStart && t.due <= rangeEnd) out.push(taskAsCalOccurrence(t, t.due, false));
        return;
      }
      // Draw the upcoming ones too, so the calendar shows the bins go out every Tuesday
      // rather than only the very next time.
      var n = 0;
      walkRecurrence(t.due, t.recurrence, rangeEnd, function(d){
        n++;
        if(t.recurrence.count && (t.recurrenceDone || 0) + n > t.recurrence.count) return false;
        if(d >= rangeStart && d <= rangeEnd) out.push(taskAsCalOccurrence(t, d, d !== t.due));
        return true;
      });
    });
    return out;
  }
  function taskAssigneeAvatarsHtml(occ){
    var members = (occ.attendees||[]).map(familyMember).filter(Boolean);
    return members.map(function(m){
      return '<span class="avatar" style="background:'+m.color+';margin-left:-6px;" title="'+escapeHtml(m.name)+'">'+escapeHtml((m.name||'?')[0])+'</span>';
    }).join('');
  }
  function taskChipHtml(occ){
    var q = QUADRANTS[occ.quadrant];
    var style = occ.completed
      ? 'background:transparent;border:1.5px dashed var(--hairline);color:var(--ink-muted);'
      : 'background:'+q.accent+';';
    return '<div class="event-chip task-chip'+(occ.future?' future':'')+'" style="'+style+'" data-task="'+occ.taskId+'" title="'+escapeHtml('Task · '+occ.title)+'">'
      + '<span class="ec-icon">'+icon(occ.completed?'checkcirc':'circle')+'</span><span class="ec-title'+(occ.completed?' done':'')+'">'+escapeHtml(occ.title)+'</span></div>';
  }
  function chipHtml(occ){ return occ.kind === 'task' ? taskChipHtml(occ) : eventChipHtml(occ); }

  function agendaCardHtml(occ){
    if(occ.kind === 'task'){
      var q = QUADRANTS[occ.quadrant];
      return '<div class="agenda-card task-agenda-card'+(occ.completed?' done':'')+(occ.future?' future':'')+'" style="border-left-color:'+(occ.completed?'var(--hairline)':q.accent)+'" data-task="'+occ.taskId+'">'
        + '<span class="ac-icon" style="background:'+(occ.completed?'var(--ink-faint)':q.accent)+'">'+icon(occ.completed?'checkcirc':'circle')+'</span>'
        + '<div class="ac-body"><div class="ac-title'+(occ.completed?' done':'')+'">'+escapeHtml(occ.title)+'</div><div class="ac-meta">Task · '+escapeHtml(q.title)+'</div></div>'
        + '<span class="ac-avatars">'+taskAssigneeAvatarsHtml(occ)+'</span>'
        + '</div>';
    }
    var cat = categoryOf(occ);
    var timeLabel = displayEventTime(occ);
    var loc = occ.location ? ' · '+escapeHtml(occ.location) : '';
    var importedMark = occ.source === 'ics' ? icon('download')+' ' : '';
    var accent = occColor(occ);
    return '<div class="agenda-card" style="border-left-color:'+accent+'" data-occ="'+occ.occurrenceId+'">'
      + '<span class="ac-icon" style="background:'+accent+'">'+icon(cat.icon)+'</span>'
      + '<div class="ac-body"><div class="ac-title">'+importedMark+escapeHtml(occ.title)+'</div><div class="ac-meta">'+timeLabel+loc+'</div></div>'
      + '<span class="ac-avatars">'+attendeeAvatarsHtml(occ)+'</span>'
      + '</div>';
  }

  /* ---- Day grid (Outlook-style 30-minute slots) ---- */
  var DAY_SLOT_MINUTES = 30;
  var DEFAULT_EVENT_MINUTES = 30;   // what a timed event with no end time is drawn as
  var MIN_BLOCK_PX = 22;            // so a 15-minute item still has a readable label

  function daySlotPx(){ return isPhone() ? 30 : 26; }

  function minutesOf(timeStr){
    if(!timeStr) return null;
    var p = String(timeStr).split(':');
    var h = parseInt(p[0],10), m = parseInt(p[1],10);
    if(isNaN(h) || isNaN(m)) return null;
    return h*60 + m;
  }
  function addMinutesToTime(timeStr, add){
    var base = minutesOf(timeStr);
    if(base === null) return null;
    var total = Math.min(base + add, 24*60 - 1);
    return pad2(Math.floor(total/60)) + ':' + pad2(total % 60);
  }
  function minutesToLabel(mins){
    var h = Math.floor(mins/60) % 24, m = mins % 60;
    return formatTime12(pad2(h)+':'+pad2(m));
  }

  // Start/end in minutes from midnight, in the CURRENT VIEWER's timezone -- same conversion
  // the agenda's time label uses, so a block never disagrees with the text next to it.
  function occDisplayRange(occ){
    if(occ.allDay || !occ.time) return null;
    var startStr = occ.time, endStr = occ.endTime || null;
    if(occ.source !== 'ics'){
      var home = state.homeTimezone || DEFAULT_TIMEZONE;
      var viewerZone = (state.currentFamilyMember && state.currentFamilyMember.timezone) || home;
      if(viewerZone !== home){
        startStr = convertWallClockZone(occ.occurrenceDate, occ.time, home, viewerZone).time;
        if(endStr) endStr = convertWallClockZone(occ.occurrenceDate, occ.endTime, home, viewerZone).time;
      }
    }
    var start = minutesOf(startStr);
    if(start === null) return null;
    var end = minutesOf(endStr);
    // An end at or before the start means the event runs past midnight; clip at the day's edge
    // rather than drawing a negative-height block.
    if(end === null || end <= start) end = start + DEFAULT_EVENT_MINUTES;
    if(end > 24*60) end = 24*60;
    return { start: start, end: end, startStr: startStr, endStr: endStr };
  }

  // Side-by-side columns for anything that overlaps, the way a real calendar does it.
  function layoutDayBlocks(items){
    items.sort(function(a,b){ return a.start - b.start || a.end - b.end; });
    var cluster = [], clusterEnd = -1, clusters = [];
    items.forEach(function(it){
      if(cluster.length && it.start >= clusterEnd){ clusters.push(cluster); cluster = []; clusterEnd = -1; }
      cluster.push(it);
      clusterEnd = Math.max(clusterEnd, it.end);
    });
    if(cluster.length) clusters.push(cluster);
    clusters.forEach(function(group){
      var colEnds = [];
      group.forEach(function(it){
        var placed = false;
        for(var c = 0; c < colEnds.length; c++){
          if(it.start >= colEnds[c]){ it.col = c; colEnds[c] = it.end; placed = true; break; }
        }
        if(!placed){ it.col = colEnds.length; colEnds.push(it.end); }
      });
      group.forEach(function(it){ it.cols = colEnds.length; });
    });
    return items;
  }

  function dayBlockHtml(it){
    var occ = it.occ;
    var slot = daySlotPx();
    var top = (it.start / DAY_SLOT_MINUTES) * slot;
    var height = Math.max(MIN_BLOCK_PX, ((it.end - it.start) / DAY_SLOT_MINUTES) * slot - 2);
    var widthPct = 100 / it.cols;
    var leftPct = it.col * widthPct;
    var cat = categoryOf(occ);
    var timeLabel = minutesToLabel(it.start) + (it.hasRealEnd ? ' – ' + minutesToLabel(it.end) : '');
    var attr = occ.kind === 'task' ? 'data-task="'+occ.taskId+'"' : 'data-occ="'+occ.occurrenceId+'"';
    var accent = occ.kind === 'task' ? QUADRANTS[occ.quadrant].accent : occColor(occ);
    var compact = height < 44;
    return '<div class="day-block'+(compact?' compact':'')+'" '+attr
      + ' style="top:'+top+'px;height:'+height+'px;left:calc('+leftPct+'% + 2px);width:calc('+widthPct+'% - 4px);'
      + 'background:'+accent+';border-left-color:'+accent+';"'
      + ' title="'+escapeHtml(timeLabel+' · '+occ.title)+'">'
      + '<div class="db-title">'+escapeHtml(occ.title)+'</div>'
      + '<div class="db-meta">'+escapeHtml(timeLabel + (occ.location ? ' · '+occ.location : ''))+'</div>'
      + '</div>';
  }

  function renderDayGrid(dateStr, occurrences){
    var slot = daySlotPx();
    var gridHeight = 48 * slot;
    var today = todayStr();

    var timed = [], allDay = [];
    occurrences.forEach(function(o){
      var range = occDisplayRange(o);
      if(range) timed.push({ occ:o, start:range.start, end:range.end, hasRealEnd: !!o.endTime });
      else allDay.push(o);
    });
    layoutDayBlocks(timed);

    var hourLabels = '';
    for(var h = 0; h < 24; h++){
      hourLabels += '<div class="day-hour" style="top:'+(h*2*slot)+'px">'+minutesToLabel(h*60)+'</div>';
    }

    var allDayHtml = allDay.length
      ? allDay.map(chipHtml).join('')
      : '<span class="day-allday-empty">Nothing all day</span>';

    var nowHtml = '';
    if(dateStr === today){
      var n = new Date();
      var nowMin = n.getHours()*60 + n.getMinutes();
      nowHtml = '<div class="day-now" id="day-now" style="top:'+((nowMin/DAY_SLOT_MINUTES)*slot)+'px"><span class="day-now-dot"></span></div>';
    }

    var empty = (!timed.length && !allDay.length)
      ? '<div class="day-empty">Nothing scheduled — tap a slot to add something.</div>' : '';

    return '<div class="day-wrap" data-date="'+dateStr+'">'
      + '<div class="day-allday"><div class="day-allday-label">All day</div>'
      + '<div class="day-allday-items">'+allDayHtml+'</div></div>'
      + empty
      + '<div class="day-scroll" id="day-scroll"><div class="day-grid" id="day-grid" style="height:'+gridHeight+'px;--slot:'+slot+'px">'
      + '<div class="day-gutter">'+hourLabels+'</div>'
      + '<div class="day-canvas" id="day-canvas">'
      + timed.map(dayBlockHtml).join('')
      + nowHtml
      + '</div></div></div></div>';
  }

  // Opening on a 24-hour grid at midnight is useless; land where the day actually starts.
  function scrollDayIntoView(dateStr, occurrences){
    var scroller = document.getElementById('day-scroll');
    if(!scroller) return;
    var slot = daySlotPx();
    var target;
    if(dateStr === todayStr()){
      var n = new Date();
      target = n.getHours()*60 + n.getMinutes() - 60;
    } else {
      var earliest = null;
      occurrences.forEach(function(o){
        var r = occDisplayRange(o);
        if(r && (earliest === null || r.start < earliest)) earliest = r.start;
      });
      target = (earliest === null ? 8*60 : earliest - 30);
    }
    scroller.scrollTop = Math.max(0, (target / DAY_SLOT_MINUTES) * slot);
  }

  function startDayNowTimer(){
    if(state.dayNowTimer){ clearInterval(state.dayNowTimer); state.dayNowTimer = null; }
    if(state.calSubView !== 'day' || state.calAnchor !== todayStr()) return;
    state.dayNowTimer = setInterval(function(){
      var el = document.getElementById('day-now');
      if(!el){ clearInterval(state.dayNowTimer); state.dayNowTimer = null; return; }
      var n = new Date();
      el.style.top = (((n.getHours()*60 + n.getMinutes()) / DAY_SLOT_MINUTES) * daySlotPx()) + 'px';
    }, 60000);
  }

  function renderCountdownStrip(){
    var today = todayStr();
    var occ = expandOccurrences(today, dateAdd(today,7)).filter(function(o){
      if(state.calSources && state.calSources.length && state.calSources.indexOf(occSourceKey(o)) === -1) return false;
      if(state.calFilter !== 'all'){
        var att = o.attendees || ['all'];
        if(att.indexOf('all') === -1 && att.indexOf(state.calFilter) === -1) return false;
      }
      return true;
    }).slice(0,6);
    if(!occ.length) return '';
    var cards = occ.map(function(o){
      var days = dateDiffDays(today, o.occurrenceDate);
      var when = days===0 ? 'Today' : days===1 ? 'Tomorrow' : 'in '+days+' days';
      var cat = categoryOf(o);
      return '<div class="countdown-card" data-occ="'+o.occurrenceId+'">'
        + '<div class="cc-icon" style="background:'+occColor(o)+'">'+icon(cat.icon)+'</div>'
        + '<div class="cc-title">'+escapeHtml(o.title)+'</div>'
        + '<div class="cc-when'+(days===0?' today':'')+'">'+when+' · '+fmtDate(o.occurrenceDate)+'</div>'
        + '</div>';
    }).join('');
    return '<div class="countdown-strip">'+cards+'</div>';
  }

  // Colour that represents an occurrence in compact (dot) form.
  function occDotColor(occ){
    if(occ.kind === 'task') return occ.completed ? '' : QUADRANTS[occ.quadrant].accent;
    return occColor(occ);
  }

  function renderMonthGrid(rangeStart, rangeEnd, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var monthNum = state.calAnchor.slice(0,7);
    var phone = isPhone();
    var weekdayHead = WEEKDAY_LABELS.map(function(l){ return '<div class="month-weekday">'+l+'</div>'; }).join('');
    var cells = '';
    var d = rangeStart;
    for(var i=0;i<42;i++){
      var inMonth = d.slice(0,7) === monthNum;
      var isToday = d === today;
      var dayList = byDate[d] || [];

      if(phone){
        // A 9px event chip is unreadable on a phone, so a day is summarised as up to four
        // dots (one per event, coloured by category / quadrant) and tapping it opens the
        // day sheet with the full detail. Same pattern the native calendar apps use.
        var dots = dayList.slice(0,4).map(function(o){
          var c = occDotColor(o);
          return '<span class="mc-dot'+(c?'':' hollow')+'" style="background:'+(c||'transparent')+'"></span>';
        }).join('');
        var more = dayList.length > 4 ? '<span class="mc-plus">+'+(dayList.length-4)+'</span>' : '';
        cells += '<div class="month-cell compact'+(inMonth?'':' outside')+(isToday?' today':'')+(dayList.length?' has-events':'')+'" data-date="'+d+'" data-day-sheet="'+d+'">'
          + '<div class="mc-num">'+parseInt(d.slice(8,10),10)+'</div>'
          + '<div class="mc-dots">'+dots+more+'</div>'
          + '</div>';
      } else {
        var list = dayList.slice(0,3);
        var extra = dayList.length - list.length;
        cells += '<div class="month-cell'+(inMonth?'':' outside')+(isToday?' today':'')+'" data-date="'+d+'">'
          + '<div class="mc-num">'+parseInt(d.slice(8,10),10)+'</div>'
          + list.map(chipHtml).join('')
          + (extra>0 ? '<div class="month-more" data-jump="'+d+'">+'+extra+' more</div>' : '')
          + '</div>';
      }
      d = dateAdd(d,1);
    }
    return '<div class="month-grid">'+weekdayHead+cells+'</div>';
  }

  // Phone week view: seven stacked day cards. The desktop version is a 7-column lane grid
  // that can only exist at 700px+, which on a phone meant sideways scrolling to find
  // Thursday. Here the week reads top to bottom like everything else on the page.
  function renderWeekStack(rangeStart, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var out = '';
    for(var i=0;i<7;i++){
      var d = dateAdd(rangeStart,i);
      var dt = new Date(d+'T00:00:00');
      var list = (byDate[d]||[]).slice().sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
      // A free day collapses to a single quiet line so the busy days are what you see.
      var head = '<div class="wk-day-head"><span>'+dt.toLocaleDateString(undefined,{weekday:'long'})+'</span>'
        + '<span class="wk-dow">'+dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>'
        + (d===today?'<span class="today-badge" style="margin-left:auto">Today</span>':'')
        + '</div>';
      if(!list.length){
        out += '<div class="wk-day empty'+(d===today?' today':'')+'" data-date="'+d+'">'+head+'</div>';
        continue;
      }
      var rows = list.map(function(o){
        var avatars = o.kind === 'task' ? taskAssigneeAvatarsHtml(o) : attendeeAvatarsHtml(o);
        return '<div class="wk-row">'+chipHtml(o)+'<span class="ac-avatars" style="display:flex">'+avatars+'</span></div>';
      }).join('');
      out += '<div class="wk-day'+(d===today?' today':'')+'">'
        + head
        + '<div class="wk-day-body">'+rows+'</div>'
        + '</div>';
    }
    return '<div class="week-stack">'+out+'</div>';
  }

  function renderWeekLanes(rangeStart, rangeEnd, occurrences){
    if(isPhone()) return renderWeekStack(rangeStart, occurrences);
    var today = todayStr();
    var days = [];
    for(var i=0;i<7;i++) days.push(dateAdd(rangeStart,i));

    var byPersonDate = {};
    occurrences.forEach(function(o){
      var att = o.attendees || ['all'];
      if(att.indexOf('all') !== -1){
        byPersonDate.everyone = byPersonDate.everyone || {};
        (byPersonDate.everyone[o.occurrenceDate] = byPersonDate.everyone[o.occurrenceDate]||[]).push(o);
      } else {
        att.forEach(function(pid){
          byPersonDate[pid] = byPersonDate[pid] || {};
          (byPersonDate[pid][o.occurrenceDate] = byPersonDate[pid][o.occurrenceDate]||[]).push(o);
        });
      }
    });

    var head = '<div></div>' + days.map(function(d){
      var dow = new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
      return '<div class="week-head'+(d===today?' today':'')+'">'+dow+' '+parseInt(d.slice(8,10),10)+'</div>';
    }).join('');

    var rows = '<div class="week-lane-label"><span class="adot" style="background:var(--primary-btn)"></span>Everyone</div>'
      + days.map(function(d){
          var list = (byPersonDate.everyone && byPersonDate.everyone[d]) || [];
          return '<div class="week-cell'+(d===today?' today':'')+'" data-date="'+d+'">'+list.map(chipHtml).join('')+'</div>';
        }).join('');

    state.family.forEach(function(m){
      if(state.calFilter !== 'all' && state.calFilter !== m.id) return;
      rows += '<div class="week-lane-label"><span class="adot" style="background:'+m.color+'"></span>'+escapeHtml(m.name)+'</div>'
        + days.map(function(d){
            var list = (byPersonDate[m.id] && byPersonDate[m.id][d]) || [];
            return '<div class="week-cell'+(d===today?' today':'')+'" data-date="'+d+'">'+list.map(chipHtml).join('')+'</div>';
          }).join('');
    });

    return '<div class="week-wrap"><div class="week-grid">'+head+rows+'</div></div>';
  }

  function renderAgendaRail(rangeStart, rangeEnd, occurrences){
    var today = todayStr();
    var byDate = {};
    occurrences.forEach(function(o){ (byDate[o.occurrenceDate] = byDate[o.occurrenceDate]||[]).push(o); });
    var dates = Object.keys(byDate).sort();
    if(!dates.length){
      return '<div class="agenda-rail"><div class="agenda-empty">Nothing coming up in this window.</div></div>';
    }
    var days = dates.map(function(d){
      var isToday = d === today;
      var isTomorrow = d === dateAdd(today,1);
      var list = byDate[d].slice().sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
      var cards = list.map(agendaCardHtml).join('');
      return '<div class="agenda-day">'
        + '<div class="agenda-day-label">'+fmtLong(d)+(isToday?'<span class="today-badge">Today</span>':(isTomorrow?'<span class="today-badge" style="background:var(--ink-muted)">Tomorrow</span>':''))+'</div>'
        + '<div class="agenda-cards">'+cards+'</div>'
        + '</div>';
    }).join('');
    return '<div class="agenda-rail">'+days+'</div>';
  }

  function renderTodaySection(){
    var today = todayStr();
    var list = expandOccurrences(today, today).map(function(o){ o.kind='event'; return o; })
      .concat(taskOccurrencesInRange(today, today))
      .filter(eventMatchesFilter)
      .sort(function(a,b){
        if(a.kind === 'task' && b.kind !== 'task') return 1;
        if(a.kind !== 'task' && b.kind === 'task') return -1;
        return (a.time||'').localeCompare(b.time||'');
      });
    return '<div class="month-day-section">'
      + '<div class="agenda-day-label">Today<span class="today-badge">'+fmtDate(today)+'</span></div>'
      + '<div class="agenda-cards">'
      + (list.length ? list.map(agendaCardHtml).join('') : '<div class="agenda-empty">Nothing scheduled today.</div>')
      + '</div></div>';
  }

  function loadCalSources(){
    try{
      var raw = JSON.parse(localStorage.getItem(LS_CAL_SOURCES) || 'null');
      state.calSources = (raw && raw.length) ? raw : null;
    }catch(e){ state.calSources = null; }
  }
  function saveCalSources(){
    try{
      if(state.calSources && state.calSources.length) localStorage.setItem(LS_CAL_SOURCES, JSON.stringify(state.calSources));
      else localStorage.removeItem(LS_CAL_SOURCES);
    }catch(e){}
  }

  // Everything the calendar can draw from: hand-added events, dated tasks, and the calendars
  // YOU have imported. Other people's feeds aren't listed -- with six people each importing a
  // school and a sports calendar, a shared list would be a wall of pills that mostly aren't
  // yours. To look at someone else's, use the person filter next to this row.
  function calSourceList(){
    var me = state.currentFamilyMember;
    var subs = (state.calendarSubscriptions || []).filter(function(sub){
      // No resolved identity means we can't tell whose is whose; listing them all beats
      // showing an empty control.
      return !me || sub.ownerFamilyMemberId === me.id;
    }).sort(function(a,b){
      return (a.name||'').localeCompare(b.name||'');
    });
    var list = [{ key:'manual', label:'Added by hand', color:'var(--ink-muted)' }];
    if((state.tasks||[]).some(function(t){ return t.due && !t.deleted; })){
      list.push({ key:'tasks', label:'Tasks', color:'var(--schedule)' });
    }
    subs.forEach(function(sub){
      var owner = familyMember(sub.ownerFamilyMemberId);
      var cat = categoryById(sub.category);
      list.push({
        key: sub.id,
        label: sub.name || 'Untitled calendar',
        color: sub.color || cat.color,
        // Only worth naming the owner in the no-identity fallback, where the list isn't just yours.
        owner: (!me && owner) ? owner.name : null
      });
    });
    return list;
  }

  function renderCalSourceTabs(){
    var box = document.getElementById('cal-source-tabs');
    if(!box) return;
    var sources = calSourceList();
    // Nothing imported yet: a filter with one real option is just clutter.
    if((state.calendarSubscriptions || []).length === 0){
      box.innerHTML = '';
      box.classList.add('hidden');
      return;
    }
    box.classList.remove('hidden');

    // Drop any source that no longer exists (a calendar was removed while filtered to it).
    if(state.calSources){
      var valid = sources.map(function(s){ return s.key; });
      var pruned = state.calSources.filter(function(k){ return valid.indexOf(k) !== -1; });
      if(pruned.length !== state.calSources.length){
        state.calSources = pruned.length ? pruned : null;
        saveCalSources();
      }
    }

    var showingAll = !state.calSources || !state.calSources.length;
    box.innerHTML = '<button data-source="__all" class="'+(showingAll?'active':'')+'">All calendars</button>'
      + sources.map(function(s){
          var on = !showingAll && state.calSources.indexOf(s.key) !== -1;
          var title = s.owner ? s.label + ' · ' + s.owner : s.label;
