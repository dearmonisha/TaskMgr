          return '<button data-source="'+escapeHtml(s.key)+'" class="'+(on?'active':'')+'" title="'+escapeHtml(title)+'" aria-pressed="'+on+'">'
            + '<span class="src-dot" style="background:'+s.color+'"></span>'+escapeHtml(s.label)+'</button>';
        }).join('');

    box.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.dataset.source;
        if(key === '__all'){
          state.calSources = null;
        } else {
          var cur = (state.calSources || []).slice();
          var i = cur.indexOf(key);
          if(i === -1) cur.push(key); else cur.splice(i, 1);
          state.calSources = cur.length ? cur : null;   // nothing ticked means show everything
        }
        saveCalSources();
        render();
      });
    });
  }

  function renderCalToolbar(){
    document.querySelectorAll('#cal-subview-tabs button').forEach(function(b){
      b.classList.toggle('active', b.dataset.subview === state.calSubView);
    });
    renderCalSourceTabs();   // before the kid-mode early return: filtering by calendar is for everyone
    var famTabs = document.getElementById('cal-family-tabs');
    var locked = lockedPersonId();
    if(locked){
      state.calFilter = locked;

      famTabs.classList.add('hidden');

      + state.family.map(function(m){
          return '<button data-fam="'+m.id+'" class="'+(state.calFilter===m.id?'active':'')+'">'+escapeHtml(m.name)+'</button>';
        }).join('');

    famTabs.querySelectorAll('button').forEach(function(b){

  function updateCalPeriodLabel(rangeStart, rangeEnd){
    var el = document.getElementById('cal-period-label');
    if(!el) return;
    if(state.calSubView === 'month') el.textContent = fmtMonthYear(state.calAnchor);
    else if(state.calSubView === 'week') el.textContent = fmtDate(rangeStart)+' – '+fmtDate(rangeEnd);
    else if(state.calSubView === 'day'){
      // The long form crowds the nav row off a phone screen; the now-line and the Today
      // button already say whether you're looking at today.
      var dt = new Date(state.calAnchor+'T00:00:00');
      el.textContent = isPhone()
        ? dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'})
        : fmtLong(state.calAnchor) + (state.calAnchor === todayStr() ? ' · Today' : '');
    }
    else el.textContent = 'Next 3 weeks';
  }

  function calNavStep(dir){
    if(state.calSubView === 'month') state.calAnchor = addMonths(state.calAnchor, dir);
    else if(state.calSubView === 'day') state.calAnchor = dateAdd(state.calAnchor, dir);
    else state.calAnchor = dateAdd(state.calAnchor, dir*7);
    render();
  }

  function renderCalendar(){
    renderCalToolbar();

    var today = todayStr();
    var rangeStart, rangeEnd;
    if(state.calSubView === 'day'){
      rangeStart = state.calAnchor;
      rangeEnd = state.calAnchor;
    } else if(state.calSubView === 'month'){
      rangeStart = startOfWeek(startOfMonth(state.calAnchor));
      rangeEnd = dateAdd(rangeStart, 41);
    } else if(state.calSubView === 'week'){
      rangeStart = startOfWeek(state.calAnchor);
      rangeEnd = dateAdd(rangeStart, 6);
    } else {
      rangeStart = state.calAnchor;
      rangeEnd = dateAdd(rangeStart, 20);
    }

    var eventOccs = expandOccurrences(rangeStart, rangeEnd).map(function(o){ o.kind = 'event'; return o; });
    var taskOccs = taskOccurrencesInRange(rangeStart, rangeEnd);
    var occurrences = eventOccs.concat(taskOccs).filter(eventMatchesFilter);

    // The countdown strip is a lovely at-a-glance rail, but on a phone it pushes the month
    // grid below the fold — so there it rides along with the agenda only.
    // The day grid wants every vertical pixel it can get, on any screen.
    var showStrip = state.calSubView !== 'day' && (!isPhone() || state.calSubView === 'agenda');
    var html = '<div class="cal-wrap">' + (showStrip ? renderCountdownStrip() : '');
    if(state.calSubView === 'day'){
      html += renderDayGrid(rangeStart, occurrences);
    } else if(state.calSubView === 'month'){
      html += renderMonthGrid(rangeStart, rangeEnd, occurrences);
      // The phone grid is only dots, so today's actual plan goes right underneath it
      // instead of leaving dead space — no tap required to see what's on now.
      if(isPhone()) html += renderTodaySection();
    }
    else if(state.calSubView === 'week') html += renderWeekLanes(rangeStart, rangeEnd, occurrences);
    else html += renderAgendaRail(rangeStart, rangeEnd, occurrences);
    html += '</div>';

    document.getElementById('view-root').innerHTML = html;

    document.getElementById('view-root').querySelectorAll('[data-occ]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var occ = occFromOccurrenceId(el.dataset.occ);
        if(occ) openEventModal(occ);
      });
    });
    document.getElementById('view-root').querySelectorAll('[data-task]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        openTaskModal(el.dataset.task);
      });
    });
    document.getElementById('view-root').querySelectorAll('.month-more').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        state.calAnchor = el.dataset.jump;
        state.calSubView = 'day';
        render();
      });
    });
    document.getElementById('view-root').querySelectorAll('.month-cell,.week-cell').forEach(function(cell){
      cell.addEventListener('click', function(e){
        if(e.target.closest('[data-occ]') || e.target.closest('[data-task]') || e.target.closest('.month-more')) return;
        // On a phone the compact month cell is a summary, so tapping it opens that day's
        // detail sheet rather than jumping straight into "new event".
        if(cell.dataset.daySheet) openDaySheet(cell.dataset.daySheet);
        else openAddEventModal(cell.dataset.date);
      });
    });

    // Clicking empty space on the day grid creates an event at that half-hour.
    var canvas = document.getElementById('day-canvas');
    if(canvas){
      canvas.addEventListener('click', function(e){
        if(e.target.closest('.day-block')) return;
        var rect = canvas.getBoundingClientRect();
        var slotIndex = Math.floor((e.clientY - rect.top) / daySlotPx());
        if(slotIndex < 0) slotIndex = 0;
        if(slotIndex > 47) slotIndex = 47;
        var mins = slotIndex * DAY_SLOT_MINUTES;
        openAddEventModal(rangeStart, pad2(Math.floor(mins/60)) + ':' + pad2(mins % 60));
      });
      applyFillHeights();
      scrollDayIntoView(rangeStart, occurrences);
      startDayNowTimer();
    } else if(state.dayNowTimer){
      clearInterval(state.dayNowTimer);
      state.dayNowTimer = null;
    }

    updateCalPeriodLabel(rangeStart, rangeEnd);
  }

  function toggleToolbars(){
    var isCal = state.view === 'calendar';
    var isDreams = state.view === 'dreams';
    var isCompass = state.view === 'compass';
    var isMessages = state.view === 'messages';
    var isTaskView = !isCal && !isDreams && !isCompass && !isMessages;
    document.getElementById('task-toolbar').classList.toggle('hidden', !isTaskView);
    document.getElementById('calendar-toolbar').classList.toggle('hidden', !isCal);
    document.getElementById('dream-toolbar').classList.toggle('hidden', !isDreams);
    document.getElementById('compass-toolbar').classList.toggle('hidden', !isCompass);
    document.body.classList.toggle('kid-mode', isKidMode()); // applies app-wide, not just on the calendar tab
    document.getElementById('open-family-settings').classList.toggle('hidden', isKidMode()); // roster management is adults-only
    syncMobileChrome();
    syncBoardLabels();
  }

  // Everyone gets to choose their own board without going through Family Settings -- which
  // is adults-only, so before this a kid couldn't change their own view at all. The choice
  // lives on the family member, so it follows them to whatever device they log in on.
  // It lives in the settings sheet now: it's a preference you set once, not a control you
  // reach for while working, and the toolbar row is worth more on a phone.
  function renderBoardStyleToggle(){
    var el = document.getElementById('board-style-toggle');
    if(!el) return;
    var style = currentBoardStyle();
    el.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.dataset.board === style);
    });
  }

  // The toolbars change height per view (and per family size), so the "fill the rest of
  // the window" layouts below need the measured height rather than a guessed constant.
  function syncChromeHeight(){
    var h = document.querySelector('header.app-header');
    if(!h) return;
    document.documentElement.style.setProperty('--chrome-h', Math.round(h.getBoundingClientRect().bottom) + 'px');
  }

  // Grow the main work area to the bottom of the window (desktop only). Measuring the
  // element's own top beats any calc(100vh - guess): toolbars wrap, the countdown strip
  // comes and goes, and the family roster changes the header height.
  function applyFillHeights(){
    // The day grid is a scroller, so it needs a real height on every screen size — otherwise
    // it grows to its full 24-hour length and the page scrolls instead of the grid.
    var day = document.querySelector('.day-scroll');
    if(day){
      // Clearing the height briefly makes the scroller taller than its content, which the
      // browser answers by clamping scrollTop to 0 — that was silently throwing the day grid
      // back to midnight on every render and every resize. Save and put it back.
      var keepScroll = day.scrollTop;
      day.style.height = '';
      var dayTop = day.getBoundingClientRect().top;
      var reserve = isPhone() ? 96 : 34;   // phone: clear the bottom tab bar
      var dayH = window.innerHeight - dayTop - reserve;
      if(dayH > 240) day.style.height = Math.round(dayH) + 'px';
      if(keepScroll) day.scrollTop = keepScroll;
    }

    var targets = document.querySelectorAll('.matrix-cross, .month-grid');
    targets.forEach(function(el){ el.style.minHeight = ''; });
    if(window.innerWidth < 1025) return;
    targets.forEach(function(el){
      if(el.classList.contains('matrix-empty')) return;
      // The rows are 1fr, so stretching the grid to the viewport would hand a collapsed
      // quadrant's row a full share of the height anyway -- exactly the space collapsing was
      // meant to give back. With something empty, let the grid size to its content.
      if(el.querySelector('.is-collapsed')) return;
      var top = el.getBoundingClientRect().top + window.scrollY;
      var h = window.innerHeight - top - 34;
      if(h > 340) el.style.minHeight = Math.round(h) + 'px';
    });
  }

  function render(){
    toggleToolbars();
    if(state.view === 'calendar'){
      renderCalendar();
      syncChromeHeight();
    applyFillHeights();
      return;
    }
    if(state.view === 'messages'){
      renderMessages();
      syncChromeHeight();
    applyFillHeights();
      return;
    }
    if(state.view === 'dreams'){
      renderDreams();
      syncChromeHeight();
    applyFillHeights();
      return;
    }
    if(state.view === 'compass'){
      renderCompass();
      syncChromeHeight();
    applyFillHeights();
      return;
    }
    renderPersonTabs();
    if(state.view === 'matrix') (currentBoardStyle() === 'horizon' ? renderHorizon() : renderMatrix());
    else if(state.view === 'list') renderList();
    else renderArchive();
    syncChromeHeight();
    applyFillHeights();
  }

  /* ================= CARD INTERACTIONS ================= */
  function attachCardHandlers(){
    var root = document.getElementById('view-root');
    root.querySelectorAll('[data-action="toggle"]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();

  function attachDragAndDrop(){
    var root = document.getElementById('view-root');
    var cards = root.querySelectorAll('.task-card');
    cards.forEach(function(card){
      card.addEventListener('dragstart', function(e){
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    });
    // A collapsed (empty) quadrant carries data-quadrant on the panel itself, since it has no
    // body to drop into.
    var zones = root.querySelectorAll('[data-quadrant]');
    zones.forEach(function(zone){
      zone.addEventListener('dragover', function(e){
        e.preventDefault();
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function(e){
        e.preventDefault();
        zone.classList.remove('drag-over');
        var id = e.dataTransfer.getData('text/plain');
        moveToQuadrant(id, zone.dataset.quadrant);
      });
    });
  }

  /* ================= TASK MUTATIONS ================= */
  function findTask(id){ return state.tasks.find(function(t){ return t.id === id; }); }

  function logActivity(task, text){
    if(!task.activity) task.activity = [];
    task.activity.unshift({ id: uid(), text: text, ts: nowISO() });
  }

  /* The next date a repeating task is due after its current one, or null when the series has
     run out. Returning null is what lets the last occurrence complete normally and archive. */
  function nextTaskDue(task){
    if(!task || !task.recurrence || !task.due) return null;
    var rule = task.recurrence;
    // A "3 times" rule means three completions; this one is the last if two are already done.
    if(rule.count && (task.recurrenceDone || 0) + 1 >= rule.count) return null;
    var next = null;
    walkRecurrence(task.due, rule, dateAdd(task.due, 800), function(d){
      if(d <= task.due) return true;
      next = d;
      return false;
    });
    return next;
  }

  function toggleComplete(id){
    var t = findTask(id);
    if(!t) return;

    /* Ticking a repeating task rolls it to its next due date instead of archiving it, so the
       board keeps one live "Take the bins out" rather than one card per week. */
    if(!t.completed && t.recurrence && t.due){
      var next = nextTaskDue(t);
      if(next){
        var wasDue = t.due, wasDone = t.recurrenceDone || 0;
        t.recurrenceDone = wasDone + 1;
        t.lastCompletedFor = wasDue;
        t.due = next;
        t.quadrantEnteredAt = nowISO();   // this cycle started now, not when the series did
        logActivity(t, 'Completed for ' + fmtDate(wasDue) + ' - next ' + fmtDate(next));
        persist(); render();
        burstConfetti();   // this week's is done, even though the series carries on
        showToast('Done for ' + fmtDate(wasDue) + ' - next ' + fmtDate(next), function(){
          t.due = wasDue;
          t.recurrenceDone = wasDone;
          t.lastCompletedFor = null;
          logActivity(t, 'Undid the completion for ' + fmtDate(wasDue));
          persist(); render();
        }, 6000);
        return;
      }
      logActivity(t, 'Completed the final one in the series');
    }

    t.completed = !t.completed;
    t.completedAt = t.completed ? nowISO() : null;
    if(isSharedTask(t)) logActivity(t, t.completed ? 'Marked complete' : 'Marked incomplete');
    persist(); render();
    if(t.completed) burstConfetti();   // finishing is the win; un-ticking isn't
  }

  /* Confetti for a finished task: a short fall across the whole page rather than a puff at the
     checkbox, so it reads as a celebration of the task and not a click effect. Absolutely
     positioned pieces driven by the Web Animations API -- no canvas, no library, and each piece
     removes itself when it lands. */
  var CONFETTI_COLORS = ['var(--do-first)','var(--schedule)','var(--delegate)','var(--eliminate)','var(--due-today)'];
  function burstConfetti(){
    var layer = document.getElementById('confetti-layer');
    if(!layer) return;
    // Honour the OS setting rather than the media query in our stylesheet, which only disables
    // transitions. Also skip where animate() isn't available rather than leaving pieces on screen.
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!document.body.animate) return;
    // Ticking a long list quickly shouldn't leave hundreds of nodes behind.
    if(layer.childElementCount > 200) layer.innerHTML = '';

    var w = window.innerWidth, h = window.innerHeight;
    for(var i = 0; i < 44; i++){
      var piece = document.createElement('span');
      piece.className = 'confetti-bit';
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.left = (Math.random() * w) + 'px';
      piece.style.top = '0px';
      // A mix of shapes and sizes reads as confetti; one repeated square reads as a loading bar.
      var size = 6 + Math.random() * 6;
      piece.style.width = size + 'px';
      piece.style.height = (size * (i % 4 === 0 ? 1 : 1.7)) + 'px';
      if(i % 5 === 0) piece.style.borderRadius = '50%';
      layer.appendChild(piece);

      // Straight down would look like rain, so each piece drifts sideways and tumbles as it goes.
      var drift = (Math.random() - 0.5) * 220;
      var spin = 360 + Math.random() * 720;
      var fall = h + 80;
      var anim = piece.animate([
        { transform:'translate3d(0,-60px,0) rotate(0deg)', opacity:0 },
        { transform:'translate3d('+(drift*0.3).toFixed(1)+'px,'+(fall*0.12).toFixed(0)+'px,0) rotate('+Math.round(spin*0.15)+'deg)',
          opacity:1, offset:0.12 },
        { transform:'translate3d('+(drift*0.75).toFixed(1)+'px,'+(fall*0.62).toFixed(0)+'px,0) rotate('+Math.round(spin*0.62)+'deg)',
          opacity:1, offset:0.62 },
        { transform:'translate3d('+drift.toFixed(1)+'px,'+fall+'px,0) rotate('+Math.round(spin)+'deg)', opacity:0 }
      ], {
        duration: 2000 + Math.random() * 1400,
        // Staggered starts, so the page fills from the top instead of one solid line dropping.
        delay: Math.random() * 700,
        easing: 'cubic-bezier(.28,.42,.5,1)',
        fill: 'backwards'   // stay off-screen during the delay rather than sitting at the top
      });
      // Closure per piece so each removes itself, not whichever one the loop ended on.
      (function(node){ anim.onfinish = function(){ node.remove(); }; })(piece);
    }
  }

  function moveToQuadrant(id, qkey){
    var t = findTask(id);
    if(!t) return;
    var q = QUADRANTS[qkey];
    var changed = (t.importance !== q.important) || (t.urgency !== q.urgent);
    t.importance = q.important;
    t.urgency = q.urgent;
    if(changed){
      t.quadrantEnteredAt = nowISO();
      if(isSharedTask(t)) logActivity(t, 'Moved to '+q.title);
    }
    persist(); render();
  }

  // Restore un-does whichever removal state put a task in the Archive: if it was soft-deleted,
  // clear that; otherwise it was just completed, so un-complete it.
  function restoreTask(id){
    var t = findTask(id);
    if(!t) return;
    if(t.deleted){
      t.deleted = false;
      t.deletedAt = null;
    } else {
      t.completed = false;
      t.completedAt = null;
    }
    persist(); render();
  }

  // Deleting a task normally just moves it to the Archive (deleted:true) - the record is kept
  // and fully recoverable via Restore. Only when `permanent` is true (the Archive view's own
  // Delete button) does the record actually get removed from state.
  function deleteTask(id, permanent){
    var idx = state.tasks.findIndex(function(t){ return t.id === id; });
    if(idx === -1) return;
    var task = state.tasks[idx];
    if(permanent){
      state.tasks.splice(idx,1);
      persist(); render();
      state.deletedBuffer = { mode:'hard', task: task, index: idx };
      showToast('Permanently deleted "'+escapeHtml(task.title)+'"', true, 5000);
    } else {
      task.deleted = true;
      task.deletedAt = nowISO();
      persist(); render();
      state.deletedBuffer = { mode:'soft', taskId: id };
      showToast('Moved "'+escapeHtml(task.title)+'" to Archive', true, 5000);
    }
  }

  function undoDelete(){
    if(!state.deletedBuffer) return;
    var buf = state.deletedBuffer;
    if(buf.mode === 'hard'){
      var idx = Math.min(buf.index, state.tasks.length);
      state.tasks.splice(idx, 0, buf.task);
    } else {
      var t = findTask(buf.taskId);
      if(t){ t.deleted = false; t.deletedAt = null; }
    }
    state.deletedBuffer = null;
    persist(); render();
    hideToast();
  }

  /* ================= TOAST ================= */
  var toastTimer;
  function showToast(message, withUndo, duration){
    var el = document.getElementById('toast');
    el.innerHTML = escapeHtml(message) + (withUndo ? ' <button id="toast-undo">Undo</button>' : '');
    el.classList.add('show');
    if(withUndo){
      // `true` keeps the original delete-undo behaviour; a function lets any action supply its own.
      var onUndo = (typeof withUndo === 'function') ? withUndo : undoDelete;
      document.getElementById('toast-undo').addEventListener('click', function(){ hideToast(); onUndo(); });
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      hideToast();
      if(withUndo) state.deletedBuffer = null;
    }, duration || 2400);
  }
  function hideToast(){
    document.getElementById('toast').classList.remove('show');
  }

  /* ================= TASK MODAL ================= */
  function openAddTaskModal(){
    var t = {
      id: uid(), title: '', notes: '',
      importance: true, urgency: false, // default: Schedule quadrant -- important, not on fire yet
      assignees: defaultTaskAssignees(), due: null, tags: [],
      subtasks: [], completed: false, completedAt: null,
      quadrantEnteredAt: nowISO(), activity: []
    };
    state.tasks.push(t);
    pendingNewTaskId = t.id;
    render();
    openTaskModal(t.id);
  }

  function openTaskModal(id){
    var sourceTask = findTask(id);
    if(!sourceTask) return;
    var isNew = (pendingNewTaskId === id);

    // Everything in this modal edits a draft copy -- nothing touches real data (or GitHub) until
    // Save is clicked. Cancel, or clicking outside the modal, throws the draft away untouched.
    var draft = Object.assign({}, sourceTask);
    draft.tags = (sourceTask.tags || []).slice();
    draft.subtasks = (sourceTask.subtasks || []).map(function(s){ return Object.assign({}, s); });
    draft.assignees = (sourceTask.assignees || []).slice();
    draft.activity = (sourceTask.activity || []).slice();

    /* Repeats. A repeating task needs a date to repeat from, so the control only appears once a
       due date is set -- otherwise "every Tuesday" has nothing to anchor to. This block is built
       and wired on its own, separately from the rest of the modal, because setting a due date
       changes it: re-rendering the whole modal to update it would tear out the date input the
       person is still standing in, which on a phone closes the picker mid-tap. */
    function taskRepeatHtml(){
      var tFreq = draft.recurrence ? draft.recurrence.freq : '';
      var tFreqSel = tFreq;
      if(tFreq === 'weekly' && draft.recurrence.byWeekday && draft.recurrence.byWeekday.length > 1) tFreqSel = 'custom';
      if(!draft.due){
        return '<div class="field-label">Repeats</div>'
          + '<div class="settings-help" style="margin-top:0;">Set a due date first, and you can make this task repeat from it.</div>';
      }
      var tWeekPicker = '';
      if(tFreq === 'weekly'){
        if(!(draft.recurrence.byWeekday && draft.recurrence.byWeekday.length)){
          draft.recurrence.byWeekday = [new Date(draft.due+'T00:00:00').getDay()];
        }
        var tDays = draft.recurrence.byWeekday;
        tWeekPicker = '<div class="field-label">Repeat on</div><div class="weekday-picker" id="t-weekdays">'
          + WEEKDAY_LABELS.map(function(lbl,i){
              return '<button type="button" data-dow="'+i+'" data-full="'+WEEKDAY_FULL[i]+'" aria-pressed="'+(tDays.indexOf(i)!==-1)+'" class="'+(tDays.indexOf(i)!==-1?'selected':'')+'">'+lbl+'</button>';
            }).join('')
          + '</div>';
      }
      var tDetail = '';
      if(tFreq){
        var tEnds = draft.recurrence.until ? 'until' : (draft.recurrence.count ? 'count' : 'never');
        tDetail = '<div class="row-2" style="margin-top:10px;">'
          + '<div><div class="field-label" style="margin-top:0;">Every</div><input type="number" min="1" class="text-input" id="t-interval" value="'+(draft.recurrence.interval||1)+'"></div>'
          + '<div><div class="field-label" style="margin-top:0;">&nbsp;</div><div style="padding:9px 0;font-size:12.5px;color:var(--ink-muted);">'+({daily:'day(s)',weekly:'week(s)',monthly:'month(s)',yearly:'year(s)'}[tFreq])+'</div></div>'
          + '</div>'
          + tWeekPicker
          + '<div class="field-label">Ends</div>'
          + '<div class="ends-row">'
          + '<label class="ends-option"><input type="radio" name="t-ends" value="never" '+(tEnds==='never'?'checked':'')+'> Never</label>'
          + '<label class="ends-option"><input type="radio" name="t-ends" value="until" '+(tEnds==='until'?'checked':'')+'> On date <input type="date" id="t-until" value="'+(draft.recurrence.until||'')+'" '+(tEnds!=='until'?'disabled':'')+'></label>'
          + '<label class="ends-option"><input type="radio" name="t-ends" value="count" '+(tEnds==='count'?'checked':'')+'> After <input type="number" min="1" id="t-count" value="'+(draft.recurrence.count||5)+'" '+(tEnds!=='count'?'disabled':'')+'> times</label>'
          + '</div>'
          + '<div class="repeat-summary">'+escapeHtml(describeRecurrence(draft.recurrence))
          + (draft.recurrenceDone ? ' Done ' + draft.recurrenceDone + ' time' + (draft.recurrenceDone===1?'':'s') + ' so far.' : '')
          + '</div>';
      }
      return '<div class="field-label">Repeats</div>'
        + '<select class="text-input" id="t-repeat-freq">'
        + '<option value=""'+(tFreqSel===''?' selected':'')+'>Does not repeat</option>'
        + '<option value="daily"'+(tFreqSel==='daily'?' selected':'')+'>Daily</option>'
        + '<option value="weekly"'+(tFreqSel==='weekly'?' selected':'')+'>Weekly</option>'
        + '<option value="custom"'+(tFreqSel==='custom'?' selected':'')+'>Custom - pick days of the week</option>'
        + '<option value="monthly"'+(tFreqSel==='monthly'?' selected':'')+'>Monthly</option>'
        + '<option value="yearly"'+(tFreqSel==='yearly'?' selected':'')+'>Yearly</option>'
        + '</select>'
        + tDetail;
    }

    // Redraws just the repeat block, leaving every other field -- including the date input the
    // person may still have open -- exactly where it was.
    function refreshTaskRepeat(){
      var wrap = document.getElementById('m-repeat');
      if(!wrap) return;
      wrap.innerHTML = taskRepeatHtml();
      bindTaskRepeat();
    }

    function bindTaskRepeat(){
      var tFreqEl = document.getElementById('t-repeat-freq');
      if(tFreqEl) tFreqEl.addEventListener('change', function(e){
        var picked = e.target.value;
        if(!picked){ draft.recurrence = null; }
        else {
          var realFreq = picked === 'custom' ? 'weekly' : picked;
          var keep = (draft.recurrence && draft.recurrence.byWeekday && draft.recurrence.byWeekday.length)
            ? draft.recurrence.byWeekday.slice() : null;
          draft.recurrence = {
            freq: realFreq, interval: 1,
            byWeekday: realFreq === 'weekly' ? (keep || [new Date(draft.due+'T00:00:00').getDay()]) : null,
            until: null, count: null
          };
        }
        refreshTaskRepeat();
      });
      var tInt = document.getElementById('t-interval');
      if(tInt) tInt.addEventListener('input', function(e){ draft.recurrence.interval = Math.max(1, parseInt(e.target.value,10)||1); });
      document.querySelectorAll('#t-weekdays button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var dow = parseInt(btn.dataset.dow,10);
          var list = (draft.recurrence.byWeekday || []).slice();
          var i = list.indexOf(dow);
          if(i === -1) list.push(dow);
          else if(list.length > 1) list.splice(i, 1);
          list.sort(function(a,b){ return a-b; });
          draft.recurrence.byWeekday = list;
          refreshTaskRepeat();
        });
      });
      document.querySelectorAll('input[name="t-ends"]').forEach(function(radio){
        radio.addEventListener('change', function(){
          if(radio.value === 'never'){ draft.recurrence.until = null; draft.recurrence.count = null; }
          else if(radio.value === 'until'){ draft.recurrence.until = draft.recurrence.until || dateAdd(draft.due, 90); draft.recurrence.count = null; }
          else { draft.recurrence.count = draft.recurrence.count || 5; draft.recurrence.until = null; }
          refreshTaskRepeat();
        });
      });
      var tUntil = document.getElementById('t-until');
      if(tUntil) tUntil.addEventListener('change', function(e){ draft.recurrence.until = e.target.value || null; });
      var tCount = document.getElementById('t-count');
      if(tCount) tCount.addEventListener('input', function(e){ draft.recurrence.count = Math.max(1, parseInt(e.target.value,10)||1); });
    }

    function renderTaskForm(){
      var qkey = quadrantOf(draft);
      var priorityBtns = QUADRANT_ORDER.map(function(k){
        var q = QUADRANTS[k];
        var sel = (k === qkey) ? ' sel-'+ (k==='doFirst'?'do-first':k) : '';
        return '<button class="priority-btn'+sel+'" data-q="'+k+'">'+q.title+'</button>';
      }).join('');

      var assignees = draft.assignees || [];
      var assigneeChips = state.family.length ? state.family.map(function(m){
        var on = assignees.indexOf(m.id) !== -1;
        return '<span class="tag-chip attendee-chip'+(on?' active':'')+'" data-a="'+m.id+'"><span class="adot" style="background:'+m.color+'"></span>'+escapeHtml(m.name)+'</span>';
      }).join('') : '<span class="settings-help" style="margin:0;">Add family members in Family Settings to assign tasks to specific people.</span>';

      var tagsHtml = (draft.tags||[]).map(function(tag,i){
        return '<span class="tag-chip">'+escapeHtml(tag)+'<button data-idx="'+i+'" data-action="rm-tag" aria-label="Remove tag">'+icon('close')+'</button></span>';
      }).join('');

      var subtasksHtml = (draft.subtasks||[]).map(function(s){
        return '<div class="subtask-row" data-id="'+s.id+'">'
          + '<input type="checkbox" '+(s.done?'checked':'')+' data-action="st-toggle">'
          + '<span class="st-text'+(s.done?' done':'')+'">'+escapeHtml(s.text)+'</span>'
          + '<button class="rm" data-action="st-remove" aria-label="Remove">'+icon('close')+'</button></div>';
      }).join('');

      var activityHtml = '';
      if(isSharedTask(draft) && draft.activity && draft.activity.length){
        activityHtml = '<div class="field-label">Activity</div><div class="activity-log">'
          + draft.activity.map(function(a){ return '<div>'+escapeHtml(a.text)+' — '+fmtRelative(a.ts)+'</div>'; }).join('')
          + '</div>';
      }

      var repeatHtml = taskRepeatHtml();

      var html = ''
        + '<div class="scrim" id="scrim">'
        + '<div class="modal">'
        + '<input class="modal-title-input" id="m-title" placeholder="Task title" value="'+escapeHtml(draft.title)+'">'
        + '<div class="field-label">Priority</div><div class="priority-grid">'+priorityBtns+'</div>'
        + '<div class="field-label">Assigned to</div><div class="tag-list" id="m-assignee">'+assigneeChips+'</div>'
        + '<div class="row-2" style="margin-top:18px;">'
        + '<div><div class="field-label" style="margin-top:0;">Due date</div><input type="date" id="m-due" value="'+(draft.due||'')+'"></div>'
        + '<div><div class="field-label" style="margin-top:0;">Status</div><button class="status-toggle'+(draft.completed?' complete':'')+'" id="m-status">'+(draft.completed?icon('refresh')+' Mark incomplete':icon('check')+' Mark complete')+'</button></div>'
        + '</div>'
        + '<div id="m-repeat">' + repeatHtml + '</div>'
        + '<div class="field-label">Tags</div><div class="tag-list" id="m-tags">'+tagsHtml+'</div>'
        + '<input class="dashed-input" id="m-tag-input" placeholder="Add a tag, press Enter">'
        + '<div class="field-label">Subtasks</div><div id="m-subtasks">'+subtasksHtml+'</div>'
        + '<input class="dashed-input" id="m-subtask-input" placeholder="Add a subtask, press Enter">'
        + '<div class="field-label">Notes</div><textarea class="notes" id="m-notes">'+escapeHtml(draft.notes||'')+'</textarea>'
        + activityHtml
        + '<div class="modal-footer">'
        + '<button class="btn-delete" id="m-delete">Delete task</button>'
        + '<div style="display:flex;gap:10px;">'
        + '<button class="btn-sm" id="m-cancel">Cancel</button>'
        + '<button class="btn-close" id="m-save">Save</button>'
        + '</div>'
        + '</div>'
        + '</div></div>';

      document.getElementById('modal-root').innerHTML = html;

      if(isNew) document.getElementById('m-title').focus();

      document.getElementById('scrim').addEventListener('click', function(e){ if(e.target.id === 'scrim') doCancel(); });
      document.getElementById('m-cancel').addEventListener('click', doCancel);
      document.getElementById('m-save').addEventListener('click', doSave);

      document.getElementById('m-title').addEventListener('input', function(e){ draft.title = e.target.value; });

      document.querySelectorAll('.priority-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var qk = btn.dataset.q, q = QUADRANTS[qk];
          var changed = (draft.importance !== q.important) || (draft.urgency !== q.urgent);
          draft.importance = q.important; draft.urgency = q.urgent;
          if(changed){
            draft.quadrantEnteredAt = nowISO();
            if(isSharedTask(draft)) logActivity(draft, 'Reassigned to '+q.title);
          }
          renderTaskForm();
        });
      });

      document.querySelectorAll('#m-assignee .attendee-chip').forEach(function(chip){
        chip.addEventListener('click', function(){
          var memberId = chip.dataset.a;
          draft.assignees = draft.assignees || [];
          var wasShared = isSharedTask(draft);
          var idx = draft.assignees.indexOf(memberId);
          if(idx === -1) draft.assignees.push(memberId); else draft.assignees.splice(idx,1);
          if(wasShared || isSharedTask(draft)){
            var names = draft.assignees.map(function(aid){ return (familyMember(aid)||{}).name; }).filter(Boolean).join(', ');
            logActivity(draft, 'Reassigned to '+(names || 'nobody'));
          }
          renderTaskForm();
        });
      });

      document.getElementById('m-due').addEventListener('change', function(e){
        draft.due = e.target.value || null;
        if(!draft.due) draft.recurrence = null;   // nothing left to repeat from
        // Only the repeat block depends on the due date, so only the repeat block is redrawn.
        // A full re-render here would replace this very input while the picker is still open.
        refreshTaskRepeat();
      });

      bindTaskRepeat();

      document.getElementById('m-status').addEventListener('click', function(){
        draft.completed = !draft.completed;
        draft.completedAt = draft.completed ? nowISO() : null;
        if(isSharedTask(draft)) logActivity(draft, draft.completed?'Marked complete':'Marked incomplete');
        renderTaskForm();
      });

      document.querySelectorAll('[data-action="rm-tag"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          draft.tags.splice(parseInt(btn.dataset.idx,10),1);
          renderTaskForm();
        });
      });
      document.getElementById('m-tag-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter' && e.target.value.trim()){
          draft.tags = draft.tags || [];
          draft.tags.push(e.target.value.trim());
          renderTaskForm();
        }
      });

      document.querySelectorAll('[data-action="st-toggle"]').forEach(function(cb){
        cb.addEventListener('change', function(){
          var row = cb.closest('.subtask-row');
          var s = (draft.subtasks||[]).find(function(x){ return x.id === row.dataset.id; });
          if(s) s.done = cb.checked;
          renderTaskForm();
        });
      });
      document.querySelectorAll('[data-action="st-remove"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var row = btn.closest('.subtask-row');
          draft.subtasks = (draft.subtasks||[]).filter(function(x){ return x.id !== row.dataset.id; });
          renderTaskForm();
        });
      });
      document.getElementById('m-subtask-input').addEventListener('keydown', function(e){
        if(e.key === 'Enter' && e.target.value.trim()){
          draft.subtasks = draft.subtasks || [];
          draft.subtasks.push({ id: uid(), text: e.target.value.trim(), done:false });
          renderTaskForm();
        }
      });

      document.getElementById('m-notes').addEventListener('input', function(e){ draft.notes = e.target.value; });

      document.getElementById('m-delete').addEventListener('click', function(){
        document.getElementById('modal-root').innerHTML = '';
        if(pendingNewTaskId === id) pendingNewTaskId = null;
        deleteTask(id);
      });
    }

    function doCancel(){
      document.getElementById('modal-root').innerHTML = '';
      if(isNew){
        pendingNewTaskId = null;
        state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
      }
      render();
    }

    function doSave(){
      // The tag/subtask inputs only add their entry to the draft on Enter - if the user typed
      // something and clicked Save directly instead, that text would otherwise just be sitting
      // unread in the input when we wipe the modal below, and silently vanish. Commit it first.
      var pendingTag = (document.getElementById('m-tag-input')||{}).value;
      if(pendingTag && pendingTag.trim()){
        draft.tags = draft.tags || [];
        draft.tags.push(pendingTag.trim());
      }
      var pendingSubtask = (document.getElementById('m-subtask-input')||{}).value;
      if(pendingSubtask && pendingSubtask.trim()){
        draft.subtasks = draft.subtasks || [];
        draft.subtasks.push({ id: uid(), text: pendingSubtask.trim(), done:false });
      }
      var titleTrim = (draft.title||'').trim();
      document.getElementById('modal-root').innerHTML = '';
      if(isNew && !titleTrim){
        pendingNewTaskId = null;
        state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
        render();
        return;
      }
      var fields = {
        title: titleTrim || sourceTask.title,
        importance: draft.importance, urgency: draft.urgency,
        assignees: (draft.assignees||[]).slice(),
        due: draft.due || null,
        tags: (draft.tags||[]).slice(),
        subtasks: (draft.subtasks||[]).map(function(s){ return Object.assign({}, s); }),
        completed: draft.completed, completedAt: draft.completedAt,
        quadrantEnteredAt: draft.quadrantEnteredAt,
        // Copied, not referenced, so the discarded draft can't keep a live handle on the
        // saved task's weekday array.
        recurrence: draft.recurrence
          ? Object.assign({}, draft.recurrence, { byWeekday: (draft.recurrence.byWeekday||[]).slice() })
          : null,
        recurrenceDone: draft.recurrenceDone || 0,
        lastCompletedFor: draft.lastCompletedFor || null,
        notes: draft.notes || '',
        activity: (draft.activity||[]).slice()
      };
      Object.assign(sourceTask, fields);
      persist(); render();
      if(isNew){
        pendingNewTaskId = null;
        var addedQ = quadrantOf(sourceTask);
        showToast('Added to '+QUADRANTS[addedQ].title, false, 2400);
      }
    }

    renderTaskForm();
  }

  /* ================= CALENDAR: DATE HELPERS ================= */
  function dateAdd(dateStr, days){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+days);
    return toLocalDateStr(d);
  }
  function dateDiffDays(a,b){
    return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
  }
  function addMonths(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth()+n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return toLocalDateStr(d);
  }
  function addYears(dateStr, n){
    var d = new Date(dateStr+'T00:00:00');
    d.setFullYear(d.getFullYear()+n);
    return toLocalDateStr(d);
  }
  function startOfWeek(dateStr){ // Sunday-start week
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()-d.getDay());
    return toLocalDateStr(d);
  }
  function startOfMonth(dateStr){
    return dateStr.slice(0,7)+'-01';
  }
  function fmtLong(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  }
  function fmtMonthYear(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  }
  var WEEKDAY_LABELS = ['S','M','T','W','T','F','S'];
  var WEEKDAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  /* ================= CALENDAR: RECURRENCE ENGINE ================= */
  var MAX_RECUR_ITERATIONS = 400;

  function eventSpanDays(ev){
    if(!ev.endDate) return 0;
    return Math.max(0, dateDiffDays(ev.date, ev.endDate));
  }
  function occurrenceInRange(startDate, spanDays, rangeStart, rangeEnd){
    var endDate = spanDays ? dateAdd(startDate, spanDays) : startDate;
    return !(endDate < rangeStart || startDate > rangeEnd);
  }
  function findEventById(id){
    return state.events.find(function(e){ return e.id === id; });
  }
  // Expands all events into concrete occurrences intersecting [rangeStart, rangeEnd] (inclusive, 'YYYY-MM-DD').
  /* Produces the dates a recurrence rule generates, from startDate up to limitDate.
     visit(dateStr) returns false to stop early (how callers apply a "count" limit).
     Shared by calendar events and repeating tasks so there is exactly one implementation
     of "every 2 weeks on Mon and Wed" to get right. */
  function walkRecurrence(startDate, rule, limitDate, visit){
    if(!rule || !rule.freq) return;
    var interval = Math.max(1, rule.interval || 1);
    var weekdayMode = rule.freq === 'weekly' && rule.byWeekday && rule.byWeekday.length;

    if(weekdayMode){
      // Walk whole weeks, visiting the chosen days within each. Stepping one day at a time
      // (the original approach) ignored the interval entirely and burned the iteration budget
      // seven times faster, so long-running series stopped generating after about 13 months.
      var days = rule.byWeekday.slice().sort(function(a,b){ return a-b; });
      var weekStart = startOfWeek(startDate);
      var done = false;
      for(var w = 0; w < MAX_RECUR_ITERATIONS && !done; w++){
        var blockStart = dateAdd(weekStart, w * 7 * interval);
        if(blockStart > limitDate) break;
        if(rule.until && blockStart > rule.until) break;
        for(var di = 0; di < days.length; di++){
          var cand = dateAdd(blockStart, days[di]);
          if(cand < startDate) continue;                 // before the series starts
          if(rule.until && cand > rule.until){ done = true; break; }
          if(cand > limitDate){ done = true; break; }
          if(visit(cand) === false){ done = true; break; }
        }
      }
      return;
    }

    var cursor = startDate;
    for(var i = 0; i < MAX_RECUR_ITERATIONS; i++){
      if(rule.until && cursor > rule.until) break;
      if(cursor > limitDate) break;
      if(visit(cursor) === false) break;
      if(rule.freq === 'daily') cursor = dateAdd(cursor, interval);
      else if(rule.freq === 'weekly') cursor = dateAdd(cursor, 7*interval);
      else if(rule.freq === 'monthly') cursor = addMonths(cursor, interval);
      else if(rule.freq === 'yearly') cursor = addYears(cursor, interval);
      else break;
    }
  }

  function expandOccurrences(rangeStart, rangeEnd){
    var out = [];
    var safetyLimit = dateAdd(rangeEnd, 3);

    state.events.forEach(function(ev){
      var span = eventSpanDays(ev);
      // A whole imported series can be hidden; skipping it here keeps it out of every view at
      // once rather than leaving each one to remember.
      if(isHiddenImport(ev, null) && !state.showHiddenImports) return;

      if(ev.recurrenceId || !ev.recurrence){
        // one-off event, or a standalone override tied to a series
        if(occurrenceInRange(ev.date, span, rangeStart, rangeEnd)){
          out.push(Object.assign({}, ev, { occurrenceId: ev.id, occurrenceDate: ev.date, isOverride: !!ev.recurrenceId, isVirtual:false }));
        }
        return;
      }

      // recurring master
      var rule = ev.recurrence;
      var interval = Math.max(1, rule.interval || 1);
      var weekdayMode = rule.freq === 'weekly' && rule.byWeekday && rule.byWeekday.length;
      var matched = 0;

      function emit(dateStr){
        matched++;
        if(rule.count && matched > rule.count) return false;   // series is finished
        if(isHiddenImport(ev, dateStr) && !state.showHiddenImports) return true;  // one date of a series
        if((ev.exceptionDates||[]).indexOf(dateStr) === -1 && occurrenceInRange(dateStr, span, rangeStart, rangeEnd)){
          out.push(Object.assign({}, ev, {
            occurrenceId: ev.id+'::'+dateStr, occurrenceDate: dateStr, date: dateStr,
            endDate: span ? dateAdd(dateStr, span) : ev.endDate,
            isOverride:false, isVirtual:true, masterId: ev.id
          }));
        }
        return true;
      }

      walkRecurrence(ev.date, rule, safetyLimit, emit);
    });

    out.sort(function(a,b){ return (a.occurrenceDate+(a.time||'')).localeCompare(b.occurrenceDate+(b.time||'')); });
    return out;
  }

  // scope: 'this' | 'following' | 'all'. occ must be a virtual occurrence (occ.isVirtual === true).
  function applyEditScope(occ, scope, fields){
    var master = findEventById(occ.masterId);
    if(!master) return;
    if(scope === 'all'){
      var f = Object.assign({}, fields);
      delete f.date; // series start date doesn't move on an "all" edit
      Object.assign(master, f);
    } else if(scope === 'this'){
      master.exceptionDates = master.exceptionDates || [];
      if(master.exceptionDates.indexOf(occ.occurrenceDate) === -1) master.exceptionDates.push(occ.occurrenceDate);
      state.events.push(Object.assign({}, master, fields, {
        id: uid(), recurrence: null, exceptionDates: [],
        recurrenceId: master.id, overrideDate: occ.occurrenceDate,
        date: fields.date || occ.occurrenceDate
      }));
    } else if(scope === 'following'){
      var cutoff = dateAdd(occ.occurrenceDate, -1);
      var oldUntil = master.recurrence.until;
      master.recurrence = Object.assign({}, master.recurrence, { until: cutoff });
      var newRule = Object.assign({}, master.recurrence, { until: oldUntil });
      if(fields.recurrence) newRule = Object.assign(newRule, fields.recurrence);
      state.events.push(Object.assign({}, master, fields, {
        id: uid(), date: occ.occurrenceDate, exceptionDates: [],
        recurrence: newRule, recurrenceId: null, overrideDate: null
      }));
    }
  }

  function deleteOccurrence(occ, scope){
    if(occ.isOverride || !occ.isVirtual){
      state.events = state.events.filter(function(e){ return e.id !== occ.occurrenceId; });
      return;
    }
    var master = findEventById(occ.masterId);
    if(!master) return;
    if(scope === 'this'){
      master.exceptionDates = master.exceptionDates || [];
      master.exceptionDates.push(occ.occurrenceDate);
    } else if(scope === 'following'){
      master.recurrence.until = dateAdd(occ.occurrenceDate, -1);
    } else if(scope === 'all'){
      state.events = state.events.filter(function(e){ return e.id !== master.id && e.recurrenceId !== master.id; });
    }
  }

  // Plain-English read-back of a repeat rule, so you can see what you've set without
  // decoding "every 2 / weekly / Mon,Wed".
  // Two or three words for a task card, where the full sentence would not fit.
  function shortRecurrence(rule){
    if(!rule || !rule.freq) return '';
    var n = Math.max(1, rule.interval || 1);
    if(rule.freq === 'weekly' && rule.byWeekday && rule.byWeekday.length > 1){
      return rule.byWeekday.slice().sort(function(a,b){ return a-b; })
        .map(function(d){ return WEEKDAY_FULL[d].slice(0,3); }).join(' ');
    }
    if(n === 1) return { daily:'Daily', weekly:'Weekly', monthly:'Monthly', yearly:'Yearly' }[rule.freq] || rule.freq;
    var unit = { daily:'day', weekly:'week', monthly:'month', yearly:'year' }[rule.freq] || rule.freq;
    return 'Every ' + n + ' ' + unit + 's';
  }

  function describeRecurrence(rule){
    if(!rule || !rule.freq) return 'Does not repeat.';
    var n = Math.max(1, rule.interval || 1);
    var out;
    if(rule.freq === 'weekly' && rule.byWeekday && rule.byWeekday.length){
      var names = rule.byWeekday.slice().sort(function(a,b){ return a-b; }).map(function(d){ return WEEKDAY_FULL[d]; });
      var list = names.length === 1 ? names[0]
        : names.slice(0,-1).join(', ') + ' and ' + names[names.length-1];
      out = (n === 1 ? 'Every week on ' : 'Every ' + n + ' weeks on ') + list;
    } else {
      var unit = { daily:'day', weekly:'week', monthly:'month', yearly:'year' }[rule.freq] || rule.freq;
      out = n === 1 ? 'Every ' + unit : 'Every ' + n + ' ' + unit + 's';
    }
    if(rule.until) out += ', until ' + fmtDate(rule.until);
    else if(rule.count) out += ', ' + rule.count + ' time' + (rule.count === 1 ? '' : 's');
    return out + '.';
  }

  function promptScope(title, cb){
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="scrim" id="scope-scrim"><div class="modal" style="max-width:380px;">'
      + '<div class="field-label" style="margin-top:0;">'+escapeHtml(title)+'</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      + '<button class="btn-sm" data-scope="this" style="text-align:left;padding:11px 14px;">This event only</button>'
      + '<button class="btn-sm" data-scope="following" style="text-align:left;padding:11px 14px;">This and following events</button>'
      + '<button class="btn-sm" data-scope="all" style="text-align:left;padding:11px 14px;">All events in the series</button>'
      + '<button class="btn-sm" data-scope="cancel" style="text-align:left;padding:11px 14px;color:var(--ink-muted);">Cancel</button>'
      + '</div></div></div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#scope-scrim').addEventListener('click', function(e){
      if(e.target.id === 'scope-scrim') document.body.removeChild(wrap);
    });
    wrap.querySelectorAll('button[data-scope]').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.body.removeChild(wrap);
        if(btn.dataset.scope !== 'cancel') cb(btn.dataset.scope);
      });
    });
  }

  /* ================= CALENDAR: EVENT MODAL ================= */
  // defaultTime is passed when you tap an empty half-hour on the day grid, so the new event
  // lands where you tapped instead of defaulting to all-day.
  function openAddEventModal(defaultDate, defaultTime){
    var base = {
      id: uid(), title:'', category:'other', attendees:['all'],

      allDay: !defaultTime, time: defaultTime || null,
