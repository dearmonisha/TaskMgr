<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="color-scheme" content="light dark">
<title>Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f9f2e9;
    --surface:#fffbf6;
    --ink:#322318;
    --ink-muted:#6d6059;
    --hairline:#d5ccc4;
    --do-first:#bc5460;
    --schedule:#008fa0;
    --delegate:#8765be;
    --eliminate:#3e8f44;
    --do-first-tint:#f6e8e9;
    --schedule-tint:#e6f2f3;
    --delegate-tint:#efe9f5;
    --eliminate-tint:#e9f2ea;
    --avatar-you:#13808a;
    --avatar-monisha:#955c82;
    --due-today:#7a4a00;
    --due-today-bg:#f3e6cf;
    --overdue:#a8372e;
    --overdue-bg:#f5dcda;
    --primary-btn:#462c19;
    --radius-card:8px;
    --radius-panel:10px;
    --radius-pill:999px;
    --pad:18px;
    --gap:16px;
    --font-serif:'Lora', serif;
    --font-sans:'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:24px 24px 60px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- Header ---------- */
  header.app-header{margin-bottom:20px;}
  .header-top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;}
  .brand h1{font-family:var(--font-serif);font-size:32px;font-weight:700;margin:0;}
  .brand p{margin:2px 0 0;font-size:13.5px;color:var(--ink-muted);}
  .brand h1[contenteditable], .brand p[contenteditable]{outline:none;border-radius:4px;}
  .brand h1[contenteditable]:hover, .brand p[contenteditable]:hover{background:rgba(0,0,0,0.03);}

  .view-switcher{display:inline-flex;background:var(--hairline);background:rgba(213,204,196,0.45);padding:4px;border-radius:var(--radius-pill);gap:2px;}
  .view-switcher button{border:none;background:transparent;padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;color:var(--ink-muted);}
  .view-switcher button.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(50,35,24,0.12);}

  .header-row2{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px;justify-content:space-between;}
  .filters-search{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0;}
  .pill-tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:rgba(213,204,196,0.3);padding:4px;border-radius:var(--radius-pill);max-width:100%;}
  .pill-tabs button{border:none;background:transparent;padding:7px 14px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .pill-tabs button.active{background:var(--primary-btn);color:#fff;}

  .search-box{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-pill);padding:7px 14px;min-width:220px;}
  .search-box svg{flex:none;opacity:0.5;}
  .search-box input{border:none;outline:none;background:transparent;font-size:13px;width:100%;color:var(--ink);}

  .quick-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:260px;max-width:520px;}
  /* The calendar toolbar's quick-add holds a search box plus two buttons ("Add Event…", "My
     Calendars…") that never shrink below their text width -- 260px understated that, so with a
     full family roster the row-wrap math never triggered and the buttons silently overflowed past
     the page edge instead of dropping to their own line. This states the real minimum. */
  #calendar-toolbar .quick-add{min-width:380px;}
  .quick-add input{flex:1;border:1.5px dashed var(--hairline);border-radius:var(--radius-pill);padding:9px 16px;background:var(--surface);font-size:13px;outline:none;color:var(--ink);}
  .quick-add input:focus{border-color:var(--schedule);}
  .quick-add button{border:none;background:var(--primary-btn);color:#fff;padding:9px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;white-space:nowrap;}
  .quick-add button:hover{opacity:0.9;}
  .quick-add button.btn-add-detail{background:transparent;border:1.5px solid var(--primary-btn);color:var(--primary-btn);padding:8px 16px;}
  .quick-add button.btn-add-detail:hover{background:rgba(70,44,25,0.06);opacity:1;}


  /* Confetti for a finished task. Purely decorative, so it's aria-hidden, never intercepts a
     click, and doesn't run at all for anyone who asked for reduced motion. */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
  .confetti-bit{position:absolute;top:0;border-radius:1px;will-change:transform,opacity;}

  /* Lives in the header (outside any single tab's toolbar) so a sync error stays visible no
     matter which view you're on. Quiet by default; becomes an actual banner on error so it's
     hard to miss regardless of which tab you're looking at. */
  .sync-banner{display:flex;justify-content:flex-end;margin-top:10px;}
  .sync-status{font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:4px 6px;border-radius:var(--radius-pill);}
  .sync-status .dot{width:7px;height:7px;border-radius:50%;background:#9aa;flex:none;}
  .sync-status.ok .dot{background:#3e8f44;}
  .sync-status.busy .dot{background:#c9922f;}
  .sync-status.err{width:100%;justify-content:center;background:var(--overdue-bg);border:1px solid var(--overdue);color:var(--overdue);font-weight:700;padding:8px 12px;}
  .sync-status.err .dot{background:var(--overdue);}
  .settings-gear{border:1px solid var(--hairline);background:var(--surface);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}

  .cal-nav{display:flex;align-items:center;gap:6px;}
  .cal-nav button{border:1px solid var(--hairline);background:var(--surface);border-radius:var(--radius-pill);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);}
  .cal-nav #cal-prev,.cal-nav #cal-next{width:30px;padding:6px 0;text-align:center;}
  .cal-period-label{font-family:var(--font-serif);font-weight:600;font-size:14px;margin-left:4px;white-space:nowrap;}

  /* ---------- Matrix ---------- */
  .matrix-outer{margin-top:22px;}
  .matrix-cross{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:24px 1fr 1fr;column-gap:var(--gap);row-gap:var(--gap);}
  .axis-top{grid-row:1;text-align:center;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;color:var(--ink-muted);}
  .axis-top.urgent{grid-column:2;}
  .axis-top.not-urgent{grid-column:3;}
  .axis-left{grid-column:1;text-align:center;font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;color:var(--ink-muted);writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;}
  .axis-left.important{grid-row:2;}
  .axis-left.not-important{grid-row:3;}
  /* When a row's quadrants are both collapsed the rotated label is the tallest thing in it, so
     it would hold the row open on its own and leave its underline dangling past the panels.
     Pinned to the top it reads alongside the headers instead. */
  .matrix-cross.has-collapsed .axis-left{align-self:start;}

  .quadrant{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);display:flex;flex-direction:column;overflow:hidden;}
  .q-do-first{grid-column:2;grid-row:2;}
  .q-schedule{grid-column:3;grid-row:2;}
  .q-delegate{grid-column:2;grid-row:3;}
  .q-eliminate{grid-column:3;grid-row:3;}

  .q-header{display:flex;align-items:flex-start;gap:8px;padding:14px var(--pad) 10px;border-bottom:1px solid var(--hairline);}
  .q-header .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
  .q-header-text{flex:1;min-width:0;}
  .q-header-text .q-title{font-family:var(--font-serif);font-style:italic;font-weight:700;font-size:18px;line-height:1.2;}
  .q-header-text .q-subtitle{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .q-count{background:rgba(50,35,24,0.08);padding:3px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;flex:none;}

  .q-do-first .q-header{background:var(--do-first-tint);}
  .q-schedule .q-header{background:var(--schedule-tint);}
  .q-delegate .q-header{background:var(--delegate-tint);}
  .q-eliminate .q-header{background:var(--eliminate-tint);}

  .q-body{padding:12px;min-height:220px;max-height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;transition:background .12s,border-color .12s;border:2px dashed transparent;border-radius:0 0 var(--radius-panel) var(--radius-panel);}
  .q-body.drag-over{border-color:currentColor;}
  .q-do-first .q-body.drag-over{background:var(--do-first-tint);color:var(--do-first);}
  .q-schedule .q-body.drag-over{background:var(--schedule-tint);color:var(--schedule);}
  .q-delegate .q-body.drag-over{background:var(--delegate-tint);color:var(--delegate);}
  .q-eliminate .q-body.drag-over{background:var(--eliminate-tint);color:var(--eliminate);}

  .q-empty{margin:auto;text-align:center;font-style:italic;color:var(--ink-muted);font-size:12.5px;padding:20px;}
  /* An empty section is its header and nothing else. align-self stops the grid stretching it
     back to the height of its tallest neighbour, which would undo the whole point. */
  .quadrant.is-collapsed{align-self:start;}
  .quadrant.is-collapsed .q-header{border-bottom:0;border-radius:var(--radius-panel);}
  .quadrant.is-collapsed .q-title,.quadrant.is-collapsed .q-count{opacity:.72;}
  /* Empty quadrants are still drop targets -- the panel stands in for the missing body. */
  .quadrant.is-collapsed.drag-over{border-color:currentColor;border-style:dashed;}
  .q-do-first.is-collapsed.drag-over{background:var(--do-first-tint);color:var(--do-first);}
  .q-schedule.is-collapsed.drag-over{background:var(--schedule-tint);color:var(--schedule);}
  .q-delegate.is-collapsed.drag-over{background:var(--delegate-tint);color:var(--delegate);}
  .q-eliminate.is-collapsed.drag-over{background:var(--eliminate-tint);color:var(--eliminate);}

  /* ---------- Task card ---------- */
  .task-card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--radius-card);padding:12px 14px;box-shadow:0 2px 6px rgba(50,35,24,0.12);cursor:pointer;position:relative;}
  .task-card:active{cursor:grabbing;}
  .task-card.dragging{opacity:0.4;}
  .tc-top{display:flex;align-items:flex-start;gap:8px;}
  .tc-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--surface);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .tc-check.checked{background:var(--eliminate);border-color:var(--eliminate);color:#fff;font-size:11px;}
  .tc-title{flex:1;font-size:14px;font-weight:500;color:var(--ink);word-break:break-word;}
  .tc-title.done{text-decoration:line-through;opacity:0.55;}
  .tc-avatars{display:flex;flex:none;}
  .avatar{width:22px;height:22px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}
  .avatar.you{background:var(--avatar-you);}
  .avatar.monisha{background:var(--avatar-monisha);margin-left:-8px;}

  .tc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .meta-pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);background:rgba(50,35,24,0.06);color:var(--ink-muted);white-space:nowrap;}
  .meta-pill.due-overdue{background:var(--overdue-bg);color:var(--overdue);}
  .meta-pill.due-today{background:var(--due-today-bg);color:var(--due-today);}
  .meta-pill.tag{background:rgba(0,143,160,0.1);color:#0b6b78;}

  /* below 640px: stack quadrants */
  @media (max-width:640px){
    .matrix-cross{display:flex;flex-direction:column;gap:var(--gap);}
    .axis-top,.axis-left{display:none;}
    .quadrant{width:100%;}
  }

  /* below 480px: modal fields stop fighting for width on phones */
  @media (max-width:480px){
    .scrim{padding:0;align-items:stretch;}
    .modal{max-width:100%;min-height:100%;border-radius:0;padding:18px 16px 24px;}
    .modal-title-input{font-size:19px;}
    .row-2{flex-direction:column;gap:16px;}
    .priority-grid{gap:6px;}
    .priority-btn{font-size:12px;padding:9px 8px;}
    .seg3 button{font-size:11.5px;padding:9px 2px;}
  }

  /* ---------- List view ---------- */
  .list-view{margin-top:22px;display:flex;flex-direction:column;gap:18px;}
  .list-group{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);overflow:hidden;}
  .list-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline);cursor:pointer;}
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:rgba(50,35,24,0.03);}
  .list-row .tc-title{flex:1;font-size:13.5px;}
  .list-empty{padding:16px;font-style:italic;color:var(--ink-muted);font-size:12.5px;text-align:center;}

  /* ---------- Archive view ---------- */
  .archive-view{margin-top:22px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);overflow:hidden;}
  .archive-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairline);}
  .archive-row:last-child{border-bottom:none;}
  .archive-row.deleted{background:rgba(168,55,46,0.04);}
  .archive-row .tc-title{flex:1;font-size:13.5px;}
  .archive-date{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
  .archive-row.deleted .archive-date{color:var(--overdue);}
  .btn-sm{border:1px solid var(--hairline);background:var(--surface);padding:5px 12px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;color:var(--ink);}
  .btn-sm:hover{background:rgba(50,35,24,0.05);}
  .btn-sm.danger{border-color:var(--overdue);color:var(--overdue);}

  /* ---------- Calendar module ---------- */
  .cal-wrap{margin-top:22px;}

  /* Countdown strip */
  .countdown-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;}
  .countdown-card{flex:none;min-width:150px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);padding:14px 16px;box-shadow:0 2px 6px rgba(50,35,24,0.1);cursor:pointer;}
  .countdown-card .cc-icon{font-size:20px;}
  .countdown-card .cc-title{font-family:var(--font-serif);font-weight:700;font-size:14px;margin-top:6px;line-height:1.2;}
  .countdown-card .cc-when{font-size:11.5px;color:var(--ink-muted);margin-top:4px;font-weight:600;}
  .countdown-card .cc-when.today{color:var(--overdue);}

  /* Event chip (shared by month/week/agenda) */
  .event-chip{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
  .event-chip .ec-icon{flex:none;}
  .event-chip .ec-title{overflow:hidden;text-overflow:ellipsis;}
  .event-chip.task-chip{font-style:italic;}
  .event-chip .ec-title.done{text-decoration:line-through;opacity:0.8;}
  .agenda-card.task-agenda-card{font-style:italic;}
  .agenda-card .ac-title.done{text-decoration:line-through;opacity:0.55;}
  .agenda-card.task-agenda-card.done{opacity:0.7;}

  /* Month grid (Fridge Calendar) */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-weekday{text-align:center;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-muted);padding-bottom:6px;}
  .month-cell{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .month-cell.outside{background:rgba(213,204,196,0.15);opacity:0.55;}
  .month-cell.today{border-color:var(--schedule);border-width:2px;}
  .month-cell .mc-num{font-size:11.5px;font-weight:700;color:var(--ink-muted);}
  .month-cell.today .mc-num{color:var(--schedule);}
  .month-more{font-size:10.5px;color:var(--ink-muted);font-weight:600;cursor:pointer;padding:2px 4px;}

  /* Week lanes (Family Lanes) */
  .week-wrap{overflow-x:auto;}
  .week-grid{display:grid;grid-template-columns:110px repeat(7,minmax(110px,1fr));gap:6px;min-width:700px;}
  .week-head{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-muted);text-align:center;padding-bottom:6px;}
  .week-head.today{color:var(--schedule);}
  .week-lane-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:8px 4px;}
  .week-lane-label .adot{width:10px;height:10px;border-radius:50%;flex:none;}
  .week-cell{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;min-height:64px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .week-cell.today{border-color:var(--schedule);border-width:2px;}

  /* Agenda rail */
  .agenda-rail{display:flex;flex-direction:column;gap:22px;}
  .agenda-day-label{font-family:var(--font-serif);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .agenda-day-label .today-badge{background:var(--schedule);color:#fff;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:var(--radius-pill);}
  .agenda-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .agenda-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--hairline);border-left:4px solid var(--ink-muted);border-radius:var(--radius-card);padding:12px 14px;box-shadow:0 2px 6px rgba(50,35,24,0.1);cursor:pointer;}
  .agenda-card .ac-icon{font-size:18px;flex:none;}
  .agenda-card .ac-body{flex:1;min-width:0;}
  .agenda-card .ac-title{font-weight:600;font-size:13.5px;}
  .agenda-card .ac-meta{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}
  .agenda-card .ac-avatars{flex:none;display:flex;}
  .agenda-empty{font-style:italic;color:var(--ink-muted);font-size:12.5px;}

  /* Kid mode: bigger touch targets across the calendar */
  body.kid-mode .cal-wrap .event-chip{font-size:12.5px;padding:5px 10px;}
  body.kid-mode .cal-wrap .agenda-card{padding:16px 18px;}
  body.kid-mode .cal-wrap .agenda-card .ac-title{font-size:16px;}
  body.kid-mode .cal-wrap .agenda-card .ac-icon{font-size:24px;}
  body.kid-mode .cal-wrap .cat-btn,
  body.kid-mode #calendar-toolbar button{font-size:14px;padding:10px 16px;}
  body.kid-mode .countdown-card{min-width:170px;padding:18px 20px;}
  body.kid-mode .countdown-card .cc-title{font-size:16px;}

  @media (max-width:640px){
    .month-grid{grid-template-columns:repeat(7,1fr);gap:3px;}
    .month-cell{min-height:64px;padding:4px;}
    .month-cell .mc-num{font-size:10px;}
    .event-chip{font-size:9.5px;padding:2px 5px;}
  }

  /* ---------- Vision board ---------- */
  .dream-wrap{margin-top:22px;}
  .dream-board-title{font-family:var(--font-serif);font-size:22px;font-weight:700;margin-bottom:18px;}
  .dream-group{margin-bottom:26px;}
  .dream-group-header{display:flex;align-items:center;gap:8px;font-family:var(--font-serif);font-weight:700;font-size:16px;padding-bottom:6px;border-bottom:2px solid;margin-bottom:12px;}
  .dream-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .dream-card{background:var(--surface);border:1px solid var(--hairline);border-left:4px solid transparent;border-radius:var(--radius-card);padding:12px 14px;box-shadow:0 2px 6px rgba(50,35,24,0.1);cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
  .dream-card.achieved{background:rgba(62,143,68,0.06);}
  .dream-check{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;}
  .dream-card.achieved .dream-check{background:var(--eliminate-tint);border-color:var(--eliminate);}
  .dream-body{flex:1;min-width:0;}
  .dream-title{font-family:var(--font-serif);font-weight:700;font-size:15px;line-height:1.3;word-break:break-word;}
  .dream-title.done{text-decoration:line-through;opacity:0.6;}
  .dream-progress{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .dream-progress-bar{flex:1;height:6px;background:rgba(50,35,24,0.08);border-radius:999px;overflow:hidden;}
  .dream-progress-fill{height:100%;border-radius:999px;}
  .dream-progress-label{font-size:11px;color:var(--ink-muted);font-weight:600;white-space:nowrap;}
  .dream-empty-state{padding:40px 20px;text-align:center;font-style:italic;color:var(--ink-muted);}
  .dream-empty-state a{color:var(--schedule);font-style:normal;font-weight:600;}

  /* Kid mode: bigger cards, bigger touch targets */
  body.kid-mode .dream-board-title{font-size:26px;}
  body.kid-mode .dream-group-header{font-size:19px;}
  body.kid-mode .dream-card{padding:16px 18px;}
  body.kid-mode .dream-title{font-size:18px;}
  body.kid-mode .dream-check{width:44px;height:44px;font-size:20px;}
  body.kid-mode #dream-toolbar button{font-size:14px;padding:10px 16px;}

  @media (max-width:640px){
    .dream-cards{grid-template-columns:1fr;}
  }

  /* ---------- Compass (Vision / Mission / Goals / Priorities) ---------- */
  .compass-wrap{margin-top:22px;}
  .compass-section{margin-bottom:30px;}
  .compass-hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-muted);}
  .compass-reflection-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--due-today-bg);border:1px solid #e0c58e;color:var(--due-today);padding:12px 16px;border-radius:10px;margin-bottom:22px;font-size:13px;}
  .compass-reflection-banner button{flex:none;}

  .priority-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .priority-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 6px rgba(50,35,24,0.1);min-height:96px;}
  .priority-num{font-family:var(--font-serif);font-weight:700;font-size:22px;color:var(--schedule);}
  .priority-text{font-size:14px;font-weight:600;outline:none;line-height:1.35;}
  .priority-text:empty:before{content:'Click to edit…';color:var(--ink-muted);font-style:italic;font-weight:400;}
  .priority-card .rm{align-self:flex-end;border:none;background:transparent;color:var(--ink-muted);font-size:13px;padding:0;margin-top:auto;}
  .priority-add{align-items:center;justify-content:center;cursor:pointer;border:1.5px dashed var(--hairline);background:transparent;box-shadow:none;font-family:inherit;}
  .priority-add-label{color:var(--ink-muted);font-size:13px;font-weight:600;}

  .compass-vision-text{font-family:var(--font-serif);font-style:italic;font-weight:600;font-size:19px;line-height:1.4;outline:none;padding:8px 10px;border-radius:8px;margin:0 -10px;}
  .compass-vision-text:hover,.compass-vision-text:focus{background:rgba(0,0,0,0.03);}
  .compass-vision-text:empty:before{content:attr(data-placeholder);color:var(--ink-muted);font-style:italic;font-weight:400;}

  .mission-row{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--hairline);}
  .mission-row:last-child{border-bottom:none;}
  .mission-bullet{font-weight:700;color:var(--schedule);flex:none;font-size:13px;}
  .mission-text{flex:1;outline:none;font-size:13.5px;padding:2px 4px;border-radius:4px;}
  .mission-text:hover,.mission-text:focus{background:rgba(0,0,0,0.03);}
  .mission-text:empty:before{content:'e.g. protect my study time before entertainment';color:var(--ink-muted);font-style:italic;}

  .goal-junior-stars{font-size:16px;letter-spacing:2px;margin-top:6px;}
  .goal-target-date{font-size:11px;color:var(--ink-muted);margin-top:4px;font-weight:600;}

  /* Senior: clean, data-forward. Junior: bigger, badge/achievement-flavored. */
  .compass-senior .priority-card{padding:14px;}
  .compass-senior .dream-card{border-radius:8px;}
  .compass-junior .compass-vision-text{font-size:22px;}
  .compass-junior .priority-num{font-size:28px;}
  .compass-junior .priority-card{background:var(--surface);border-width:2px;border-radius:14px;}
  .compass-junior .dream-card{border-width:2px;border-radius:14px;}
  .compass-junior .dream-check{width:40px;height:40px;font-size:19px;}
  .compass-junior .dream-group-header{font-size:18px;}

  .priority-reflect-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .priority-reflect-row .priority-num{flex:none;width:28px;}

  body.kid-mode .compass-vision-text{font-size:22px;}
  body.kid-mode .priority-num{font-size:26px;}
  body.kid-mode #compass-toolbar button{font-size:14px;padding:10px 16px;}

  @media (max-width:640px){
    .priority-grid3{grid-template-columns:1fr;}
  }

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(50,35,24,0.35);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(50,35,24,0.3);padding:26px;margin:auto;}
  .modal-title-input{width:100%;font-family:var(--font-serif);font-size:21px;font-weight:600;border:none;border-bottom:2px solid var(--hairline);outline:none;background:transparent;padding:4px 2px 8px;color:var(--ink);}
  .modal-title-input:focus{border-color:var(--schedule);}
  .field-label{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-muted);margin:18px 0 8px;}
  .priority-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .priority-btn{min-width:0;border:1.5px solid var(--hairline);background:var(--surface);padding:10px;border-radius:8px;font-size:12.5px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .priority-btn.sel-do-first{border-color:var(--do-first);background:var(--do-first-tint);color:var(--do-first);}
  .priority-btn.sel-schedule{border-color:var(--schedule);background:var(--schedule-tint);color:var(--schedule);}
  .priority-btn.sel-delegate{border-color:var(--delegate);background:var(--delegate-tint);color:var(--delegate);}
  .priority-btn.sel-eliminate{border-color:var(--eliminate);background:var(--eliminate-tint);color:var(--eliminate);}

  .seg3{display:flex;border:1.5px solid var(--hairline);border-radius:var(--radius-pill);overflow:hidden;}
  .seg3 button{flex:1;min-width:0;border:none;background:var(--surface);padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg3 button.active{background:var(--primary-btn);color:#fff;}

  .row-2{display:flex;gap:12px;}
  .row-2 > div{flex:1;min-width:0;}
  input[type=date],.text-input{width:100%;max-width:100%;box-sizing:border-box;border:1.5px solid var(--hairline);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;background:var(--surface);color:var(--ink);}
  input[type=date]:focus,.text-input:focus{border-color:var(--schedule);}
  .status-toggle{width:100%;border:1.5px solid var(--hairline);background:var(--surface);border-radius:8px;padding:9px;font-size:13px;font-weight:600;}
  .status-toggle.complete{background:var(--eliminate);border-color:var(--eliminate);color:#fff;}

  .tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .tag-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,143,160,0.1);color:#0b6b78;padding:4px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;}
  .tag-chip button{border:none;background:transparent;color:inherit;font-size:12px;line-height:1;padding:0;}
  .dashed-input{border:1.5px dashed var(--hairline);border-radius:var(--radius-pill);padding:6px 14px;font-size:12px;outline:none;background:transparent;width:100%;color:var(--ink);}
  .dashed-input:focus{border-color:var(--schedule);}

  /* ---------- Event modal extras ---------- */
  .category-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .cat-btn{border:1.5px solid var(--hairline);background:var(--surface);border-radius:var(--radius-pill);padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-muted);white-space:nowrap;}
  .cat-btn.selected{border-color:var(--primary-btn);background:rgba(70,44,25,0.08);color:var(--ink);}
  .attendee-chip{cursor:pointer;opacity:0.45;user-select:none;}
  .attendee-chip.active{opacity:1;}
  .attendee-chip .adot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .check-inline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);padding-top:10px;cursor:pointer;}
  .check-inline input{width:16px;height:16px;flex:none;}
  .time-picker-row{display:flex;align-items:center;gap:6px;}
  .time-select{border:1.5px solid var(--hairline);border-radius:8px;padding:9px 6px;font-size:13px;outline:none;background:var(--surface);color:var(--ink);}
  .time-select:focus{border-color:var(--schedule);}
  #ev-time-hour,#ev-time-minute{width:60px;}
  #ev-time-ampm{width:66px;}
  .time-colon{font-weight:700;color:var(--ink-muted);}
  .color-pop{
    flex:1 1 100%;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    margin-top:10px;padding:10px;border-radius:var(--radius-card);
    background:var(--surface-2);border:1px solid var(--line);
  }
  .color-chip{
    width:26px;height:26px;border-radius:50%;border:2px solid transparent;
    box-shadow:0 0 0 1.5px var(--hairline);cursor:pointer;padding:0;flex:none;
  }
  .color-chip.on{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--ink);}
  .color-reset{
    border:1px solid var(--hairline);background:var(--surface);color:var(--ink-muted);
    border-radius:var(--radius-pill);padding:5px 12px;font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .color-reset:hover{color:var(--ink);}
  .meta-pill.repeats{background:var(--accent-soft, rgba(0,143,160,0.1));color:var(--accent, #0b6b78);}
  .event-chip.future,.agenda-card.future{opacity:.62;}
  .src-dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block;margin-right:6px;vertical-align:1px;}
  #cal-source-tabs button{display:inline-flex;align-items:center;}
  .repeat-summary{
    margin-top:12px;padding:9px 12px;border-radius:8px;
    background:var(--accent-soft, rgba(0,143,160,0.08));
    color:var(--accent, #0b6b78);font-size:12.5px;font-weight:600;
  }
  .weekday-picker{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
  .weekday-picker button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-muted);flex:none;}
  .weekday-picker button.selected{background:var(--primary-btn);color:#fff;border-color:var(--primary-btn);}
  .ends-row{display:flex;flex-direction:column;gap:8px;margin-top:8px;margin-bottom:16px;}
  .ends-option{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .ends-option input[type=radio]{width:15px;height:15px;flex:none;}
  .ends-option input[type=date],.ends-option input[type=number]{width:130px;padding:6px 10px;font-size:12px;border:1.5px solid var(--hairline);border-radius:8px;background:var(--surface);color:var(--ink);}
  .ends-option input:disabled{opacity:0.4;}

  .subtask-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
  .subtask-row input[type=checkbox]{width:16px;height:16px;flex:none;}
  .subtask-row .st-text{flex:1;font-size:13px;}
  .subtask-row .st-text.done{text-decoration:line-through;opacity:0.55;}
  .subtask-row button.rm{border:none;background:transparent;color:var(--ink-muted);font-size:13px;}

  textarea.notes{width:100%;min-height:70px;border:1.5px solid var(--hairline);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;resize:vertical;background:var(--surface);color:var(--ink);}
  textarea.notes:focus{border-color:var(--schedule);}

  .activity-log{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;}
  .activity-log div{font-size:12px;color:var(--ink-muted);}

  .modal-footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--hairline);padding-top:16px;}
  .btn-close{border:none;background:var(--primary-btn);color:#fff;padding:8px 18px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;}
  .btn-delete{border:1.5px solid var(--overdue);color:var(--overdue);background:transparent;padding:8px 16px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;}

  /* ---------- Settings modal ---------- */
  .settings-field{margin-bottom:12px;}
  .settings-field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em;}
  .settings-help{font-size:12px;color:var(--ink-muted);margin-top:14px;line-height:1.5;}
  .settings-help a{color:var(--schedule);}
  .settings-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-primary{border:none;background:var(--primary-btn);color:#fff;padding:9px 18px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;}
  .banner{display:flex;align-items:center;gap:10px;background:var(--due-today-bg);border:1px solid #e0c58e;color:var(--due-today);padding:10px 16px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
  .banner button{margin-left:auto;border:none;background:var(--primary-btn);color:#fff;padding:6px 14px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;flex:none;}
  .banner .dismiss{background:transparent;color:var(--due-today);border:1px solid currentColor;}

  .family-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px;}
  /* Category editor rows. Same shape as a family row, but the name field carries the weight. */

  /* ---------- Message board ----------
     A single column at reading width. Notes are short, so the card is quiet: the name and the
     time do the framing and the text carries the weight. */
  .msg-wrap{max-width:680px;margin:18px auto 0;display:flex;flex-direction:column;gap:16px;}
  .msg-composer-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .msg-composer-who{font-size:13px;font-weight:600;color:var(--ink-muted);}
  .msg-input{
    width:100%;box-sizing:border-box;resize:vertical;min-height:110px;
    border:1px solid var(--hairline);border-radius:var(--radius-card);padding:12px 14px;
    background:var(--surface-2);font:inherit;font-size:15px;color:var(--ink);outline:none;
  }
  .msg-input:focus{border-color:var(--accent);}
  /* Room for the floating + so it never sits on top of the last note's buttons. */
  .msg-empty{
    text-align:center;color:var(--ink-muted);padding:44px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .msg-empty p{margin:0;font-size:14px;}

  .msg-list{display:flex;flex-direction:column;gap:12px;padding-bottom:88px;}
  .msg-card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);
    padding:14px 16px;position:relative;
  }
  .msg-card.pinned{border-color:var(--due-today);background:var(--due-today-bg);}
  .msg-pinned-flag{
    position:absolute;top:-9px;left:14px;display:inline-flex;align-items:center;gap:4px;
    background:var(--due-today);color:#fff;border-radius:var(--radius-pill);
    padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  }
  .msg-pinned-flag .ic{width:11px;height:11px;}
  .msg-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .msg-who{font-size:13px;font-weight:700;}
  .msg-when{font-size:11.5px;color:var(--ink-faint);margin-left:auto;white-space:nowrap;}
  .msg-text{font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;}
  .msg-actions{display:flex;gap:14px;margin-top:11px;}
  .msg-actions button{
    background:none;border:0;padding:0;font:inherit;font-size:12px;font-weight:600;
    color:var(--ink-muted);cursor:pointer;
  }
  .msg-actions button:hover{color:var(--ink);text-decoration:underline;}
  .msg-actions button.danger:hover{color:var(--overdue);}

  @media (max-width:760px){
    .msg-wrap{margin-top:12px;gap:13px;}
    .msg-input{font-size:16px;}   /* 16px stops iOS zooming the page on focus */
  }

  .cat-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:9px;position:relative;}
  .cat-row .cat-icon{flex:none;width:118px;}
  .cat-row .cat-name{flex:1;min-width:130px;}
  .cat-row .cat-preview{flex:none;display:inline-flex;width:22px;justify-content:center;}
  .cat-row .cat-locked{
    flex:none;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-faint);padding:0 6px;
  }
  /* .color-pop is flex:1 1 100%, so it wraps onto its own line under the row it belongs to. */
  .family-row .fam-name{flex:1.2;min-width:110px;}
  .family-row .fam-email{flex:1.6;min-width:150px;}
  .family-row .fam-role{flex:none;width:120px;}
  .family-row .fam-board{flex:none;width:140px;}
  .family-row .fam-timezone{flex:1.4;min-width:170px;}
  .color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--hairline);flex:none;padding:0;}
  .family-row .rm{border:none;background:transparent;color:var(--ink-muted);font-size:14px;flex:none;padding:4px;}
  @media (max-width:480px){
    .family-row{flex-wrap:wrap;}
    .family-row .fam-name,.family-row .fam-email,.family-row .fam-timezone{flex:1 1 100%;}
    .family-row .fam-role{flex:1;width:auto;}
  }

  /* ---------- Toast ---------- */
  .toast-wrap{position:fixed;bottom:28px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:200;}
  .toast{background:var(--primary-btn);color:#fff;padding:11px 20px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s;pointer-events:auto;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast button{border:none;background:transparent;color:#ffd27a;font-weight:700;font-size:12.5px;}

  .hidden{display:none !important;}

  /* ==========================================================================
     v2 — MOBILE-FIRST REFRESH
     Everything below overrides the original desktop-era styles above. It is kept
     in one block so the older rules stay readable/diffable and this layer can be
     reasoned about as "the redesign".
     ========================================================================== */

  /* ---------- 1. Tokens: refreshed palette + dark mode ---------- */
  :root{
    --paper:#f6f2ec;
    --surface:#ffffff;
    --surface-2:#faf7f3;
    --ink:#1e1a16;
    --ink-muted:#6f665e;
    --ink-faint:#9b928a;
    --hairline:#e6dfd6;
    --hairline-strong:#d6cec4;

    --do-first:#c8505f;
    --schedule:#0e8ea0;
    --delegate:#7b5fc4;
    --eliminate:#3f8c4a;

    --do-first-tint:#fbeced;
    --schedule-tint:#e6f4f6;
    --delegate-tint:#efeafa;
    --eliminate-tint:#e9f4ea;

    --due-today:#8a5300;
    --due-today-bg:#fbeed4;
    --overdue:#b23a2f;
    --overdue-bg:#fadedb;

    --primary-btn:#2c2119;
    --on-primary:#fff;
    --accent:#0e8ea0;

    --radius-card:14px;
    --radius-panel:18px;
    --radius-pill:999px;
    --radius-sheet:24px;

    --shadow-sm:0 1px 2px rgba(30,26,22,.06), 0 1px 3px rgba(30,26,22,.05);
    --shadow-md:0 2px 6px rgba(30,26,22,.06), 0 8px 20px rgba(30,26,22,.07);
    --shadow-lg:0 10px 40px rgba(30,26,22,.18);

    --tap:44px;
    --nav-h:64px;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#141210;
      --surface:#1d1a17;
      --surface-2:#232019;
      --ink:#f2ece4;
      --ink-muted:#a79d93;
      --ink-faint:#7e756c;
      --hairline:#322d27;
      --hairline-strong:#413a32;

      --do-first:#e5737f;
      --schedule:#3fb8c9;
      --delegate:#a68ce8;
      --eliminate:#5fb96c;

      --do-first-tint:#33201f;
      --schedule-tint:#152c2f;
      --delegate-tint:#241f33;
      --eliminate-tint:#182b1b;

      --due-today:#f0c375;
      --due-today-bg:#33280f;
      --overdue:#f08b80;
      --overdue-bg:#3a1f1b;

      --primary-btn:#f2ece4;
      --on-primary:#191512;
      --accent:#3fb8c9;

      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 2px 8px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.3);
      --shadow-lg:0 12px 48px rgba(0,0,0,.6);
    }
    /* Emoji-free UI still uses a couple of colour-on-colour chips; keep them legible. */
    .banner{background:var(--due-today-bg);border-color:#5a4520;color:var(--due-today);}
    input,textarea,select{color-scheme:dark;}
  }

  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    letter-spacing:-0.005em;
  }
  /* Nothing in this app is allowed to make the page wider than the screen —
     that horizontal overflow was the "grey band down the right side" on phones. */
  .wrap{max-width:1240px;padding:20px 20px 40px;overflow-x:clip;}

  ::-webkit-scrollbar{height:6px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:999px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* Inline SVG icon defaults */
  .ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.14em;}
  .ic-fill{fill:currentColor;stroke:none;}
  .only-phone{display:none!important;}

  /* ---------- 2. Chrome: header, switcher, toolbars ---------- */
  header.app-header{margin-bottom:16px;}
  .brand h1{font-size:28px;letter-spacing:-0.02em;}
  .brand p{font-size:13px;color:var(--ink-muted);}

  .view-switcher{background:rgba(120,110,100,0.12);padding:4px;gap:2px;}
  .view-switcher button{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;}
  .view-switcher button.active{background:var(--surface);box-shadow:var(--shadow-sm);}
  .view-switcher .ic{width:15px;height:15px;}

  .settings-gear{width:38px;height:38px;color:var(--ink-muted);transition:background .15s;}
  .settings-gear:hover{background:var(--surface-2);color:var(--ink);}
  .settings-gear .ic{width:17px;height:17px;}

  .pill-tabs{background:rgba(120,110,100,0.1);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .pill-tabs::-webkit-scrollbar{display:none;}
  .pill-tabs button{white-space:nowrap;padding:8px 14px;}
  .pill-tabs button.active{background:var(--primary-btn);color:var(--on-primary);}

  .search-box{min-width:0;flex:1 1 200px;border-radius:var(--radius-pill);}
  .search-box:focus-within{border-color:var(--accent);}

  /* The old fixed min-widths here are exactly what forced the page wider than a
     phone screen. Width now comes from the flex row, never from a hard floor. */
  .quick-add{min-width:0;flex:1 1 260px;max-width:560px;}
  #calendar-toolbar .quick-add{min-width:0;}
  /* The task toolbar's quick-add is one button now that the quick-add box is gone. Leaving it
     sized for a text field reserved up to 560px for a 130px button, which squeezed the filters
     until the search dropped onto its own line with a screen's worth of nothing beside it. */
  #task-toolbar .quick-add{flex:0 0 auto;max-width:none;}
  #task-toolbar .filters-search{flex:1 1 auto;}
  #task-toolbar .search-box{max-width:420px;}
  .quick-add input{min-width:0;border-style:solid;border-color:var(--hairline);background:var(--surface);}
  .quick-add button{background:var(--primary-btn);color:var(--on-primary);}
  .quick-add button.btn-add-detail{border-color:var(--hairline-strong);color:var(--ink);}


  .cal-nav button{color:var(--ink);}
  .cal-nav button:hover{background:var(--surface-2);}

  /* ---------- 3. Cards / panels ---------- */
  .quadrant{border-radius:var(--radius-panel);box-shadow:var(--shadow-sm);}
  .q-header{padding:14px 16px 12px;}
  .q-header-text .q-title{font-style:normal;letter-spacing:-0.01em;}
  .q-count{background:rgba(120,110,100,0.14);}
  .q-body{max-height:none;}

  .task-card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .1s;}
  .task-card:hover{box-shadow:var(--shadow-md);}
  .tc-check{width:22px;height:22px;border-width:1.5px;color:transparent;transition:background .12s,border-color .12s;}
  .tc-check .ic{width:13px;height:13px;stroke-width:2.6;}
  .tc-check.checked{color:#fff;}
  .avatar{border-color:var(--surface);}
  .meta-pill{background:rgba(120,110,100,0.12);}
  .meta-pill .ic{width:11px;height:11px;margin-right:3px;}

  .list-group{border-radius:var(--radius-panel);box-shadow:var(--shadow-sm);}
  .list-row{padding:13px 16px;min-height:52px;}
  .archive-view{border-radius:var(--radius-panel);box-shadow:var(--shadow-sm);}
  .archive-row{padding:13px 16px;}

  /* ---------- 4. Calendar ---------- */
  .countdown-strip{gap:10px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .countdown-strip::-webkit-scrollbar{display:none;}
  .countdown-card{scroll-snap-align:start;border-radius:var(--radius-panel);box-shadow:var(--shadow-sm);min-width:158px;}
  .countdown-card .cc-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;}
  .countdown-card .cc-icon .ic{width:17px;height:17px;}
  .countdown-card .cc-title{font-size:14px;}

  .event-chip{border-radius:8px;padding:4px 8px;gap:6px;line-height:1.25;}
  .event-chip .ec-icon .ic{width:12px;height:12px;}
  .event-chip.task-chip{font-style:normal;}

  .month-grid{gap:5px;}
  .month-cell{border-radius:10px;box-shadow:none;}
  .month-cell.today{border-color:var(--accent);}
  .month-cell.today .mc-num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .week-cell{border-radius:10px;}
  .agenda-card{border-radius:var(--radius-card);box-shadow:var(--shadow-sm);border-left-width:4px;padding:13px 15px;}
  .agenda-card .ac-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
  .agenda-card .ac-icon .ic{width:16px;height:16px;}
  .agenda-day-label{font-size:15px;}

  /* Phone month view: a dot per event instead of unreadable 9px chips.
     Tapping a day opens the day sheet (see .day-sheet). */
  .month-cell.compact{min-height:0;aspect-ratio:1/1;align-items:center;justify-content:flex-start;gap:0;padding:5px 2px 4px;cursor:pointer;}
  .month-cell.compact .mc-num{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .month-cell.compact.outside .mc-num{color:var(--ink-faint);}
  .mc-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:100%;}
  .mc-dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .mc-dot.hollow{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--hairline-strong);}
  .mc-plus{font-size:9px;font-weight:700;color:var(--ink-faint);line-height:1;}
  .month-cell.compact.has-events{background:var(--surface);}
  .month-cell.compact.sel{border-color:var(--ink);border-width:2px;}
  .month-cell.compact.today .mc-num{background:var(--accent);color:#fff;}
  .agenda-card.task-agenda-card{font-style:normal;}
  .month-day-section{margin-top:20px;}
  .month-day-section .agenda-day-label{margin-bottom:10px;}
  .wk-day.empty .wk-day-head{border-bottom:none;opacity:.65;}
  .wk-day.empty{box-shadow:none;background:transparent;}

  /* Phone week view: one stacked block per day instead of a 700px sideways grid. */
  .week-stack{display:flex;flex-direction:column;gap:12px;}
  .wk-day{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-panel);overflow:hidden;box-shadow:var(--shadow-sm);}
  .wk-day-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--hairline);font-weight:700;font-size:13.5px;}
  .wk-day-head .wk-dow{color:var(--ink-muted);font-weight:600;}
  .wk-day.today .wk-day-head{background:var(--schedule-tint);color:var(--accent);}
  .wk-day-body{padding:10px 12px;display:flex;flex-direction:column;gap:7px;}
  .wk-empty{font-size:12.5px;color:var(--ink-faint);font-style:italic;padding:2px 2px 4px;}
  .wk-row{display:flex;align-items:center;gap:9px;}
  .wk-row .event-chip{flex:1;min-width:0;}

  /* ---------- 4a. Horizon board ----------
     Same panel language as the matrix, but laid out as a severity scale left to right,
     with the undated column running full width underneath since it isn't part of the scale. */
  .horizon-outer{margin-top:22px;}
  .horizon-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);}
  .horizon-board .span-all{grid-column:1/-1;}
  .horizon-col .q-body{min-height:110px;max-height:none;}
  .horizon-col .q-body.is-empty{display:flex;align-items:center;justify-content:center;}
  .h-overdue .q-header{background:var(--overdue-bg);}
  .h-today   .q-header{background:var(--due-today-bg);}
  .h-week    .q-header{background:var(--schedule-tint);}
  .h-later   .q-header{background:var(--delegate-tint);}
  .h-none    .q-header{background:rgba(120,110,100,0.1);}

  .week-load{margin-bottom:20px;}
  .week-load h2,.subject-bar h2{
    font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 9px;
  }
  .load-row{display:flex;gap:6px;align-items:flex-end;max-width:560px;}
  /* Each day is a button: tapping it filters the board below to that day's tasks. */
  .load-day{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;
    font:inherit;color:inherit;background:none;border:0;padding:4px 2px 3px;
    border-radius:8px;cursor:pointer;transition:background .12s ease;
  }
  .load-day:hover{background:var(--surface-2);}
  /* Where next week starts. The This week column stops at Saturday, so the strip says where. */
  .load-day.newweek{margin-left:9px;position:relative;}
  .load-day.newweek::before{
    content:'';position:absolute;left:-6px;top:6px;bottom:6px;
    border-left:1px dashed var(--hairline-strong);
  }
  .load-day:focus-visible{outline:2px solid var(--schedule);outline-offset:1px;}
  .load-bar{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--schedule);min-height:4px;transition:background .12s ease;}
  .load-day.busy .load-bar{background:var(--overdue);}
  .load-day.empty .load-bar{background:var(--hairline-strong);}
  /* Selection is a ring and a tint, not a recolour: the bar's own colour is carrying "this is
     your busiest day", which is information worth keeping while you look at one. */
  .load-day.picked{background:var(--schedule-tint);box-shadow:inset 0 0 0 1.5px var(--schedule);}
  .load-day.picked .load-label,.load-day.picked .load-n{color:var(--ink);font-weight:700;}
  .load-label{font-size:10.5px;color:var(--ink-muted);font-weight:600;white-space:nowrap;}
  .load-n{font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .load-note{font-size:12.5px;color:var(--ink-muted);margin:9px 0 0;}
  .load-clear{
    font:inherit;font-size:12.5px;background:none;border:0;padding:0;margin-left:2px;
    color:var(--schedule);font-weight:600;text-decoration:underline;cursor:pointer;
  }
  .subject-bar{margin-bottom:18px;}

  /* ---------- Hiding imported events ---------- */
  .hide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .hidden-list{
    flex-basis:100%;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--hairline-strong);
  }
  .hidden-row{
    display:flex;align-items:center;gap:9px;padding:5px 0;
    border-bottom:1px solid var(--hairline);
  }
  .hidden-row:last-child{border-bottom:0;}
  .hidden-title{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hidden-when{font-size:11px;color:var(--ink-muted);white-space:nowrap;font-variant-numeric:tabular-nums;}

  @media (max-width:1024px){ .horizon-board{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:640px){
    .horizon-board{grid-template-columns:1fr;}
    .horizon-outer{margin-top:14px;}
    .load-row{max-width:none;}
  }

  /* ---------- 4b. Day grid (Outlook-style) ----------
     A 24-hour column of 30-minute slots. Lines are drawn as a repeating gradient rather than
     48 divs, and blocks are absolutely positioned from their start minute, so the grid stays
     cheap to render even on a day with a lot on it. */
  .day-wrap{display:flex;flex-direction:column;min-height:0;}

  .day-allday{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);
    padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow-sm);
  }
  .day-allday-label{
    flex:none;width:62px;font-family:var(--font-mono, var(--font-sans));
    font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-faint);padding-top:5px;
  }
  .day-allday-items{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;}
  .day-allday-empty{font-size:12.5px;color:var(--ink-faint);font-style:italic;padding-top:3px;}

  .day-empty{
    text-align:center;font-size:13px;color:var(--ink-faint);font-style:italic;
    padding:10px 0 14px;
  }

  .day-scroll{
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);
    box-shadow:var(--shadow-sm);
  }
  .day-grid{position:relative;display:flex;}

  .day-gutter{
    position:relative;flex:none;width:66px;
    border-right:1px solid var(--line);background:var(--surface-2);
  }
  .day-hour{
    position:absolute;right:9px;transform:translateY(-50%);
    font-size:11px;font-weight:600;color:var(--ink-faint);white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .day-hour:first-child{transform:none;}

  .day-canvas{
    position:relative;flex:1;min-width:0;cursor:copy;
    /* hairline every 30 min, stronger every hour */
    background-image:
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--slot) * 2)),
      repeating-linear-gradient(to bottom, color-mix(in srgb, var(--line) 78%, transparent) 0 1px, transparent 1px var(--slot));
  }

  .day-block{
    position:absolute;overflow:hidden;border-radius:7px;padding:4px 8px;
    color:#fff;cursor:pointer;box-shadow:var(--shadow-sm);
    border-left:3px solid rgba(0,0,0,.22);
    transition:filter .12s ease;
  }
  .day-block:hover{filter:brightness(1.07);}
  .day-block .db-title{font-size:12.5px;font-weight:700;line-height:1.25;}
  .day-block .db-meta{font-size:11px;opacity:.9;line-height:1.3;margin-top:1px;}
  /* Too short to stack two lines — put them side by side and let the title win. */
  .day-block.compact{display:flex;align-items:baseline;gap:7px;padding:2px 8px;}
  .day-block.compact .db-title{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-block.compact .db-meta{font-size:10.5px;margin-top:0;white-space:nowrap;flex:none;}

  .day-now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--overdue);z-index:3;pointer-events:none;}
  .day-now-dot{
    position:absolute;left:-5px;top:-5px;width:9px;height:9px;border-radius:50%;
    background:var(--overdue);
  }

  /* ---------- 5. Modals → bottom sheets on phones ---------- */
  .scrim{background:rgba(20,16,12,0.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .modal{border-radius:20px;box-shadow:var(--shadow-lg);}
  .sheet-handle{display:none;}

  /* ---------- 6. Bottom navigation (phones only) ---------- */
  .mobile-nav{
    display:none;
    position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--hairline);
    padding-bottom:var(--safe-b);
  }
  .mobile-nav-inner{display:flex;align-items:stretch;height:var(--nav-h);}
  .mobile-nav button{
    flex:1;border:none;background:transparent;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;padding:0;
    color:var(--ink-faint);font-size:10.5px;font-weight:600;letter-spacing:0.01em;
    -webkit-tap-highlight-color:transparent;
  }
  .mobile-nav button .ic{width:22px;height:22px;stroke-width:1.8;transition:transform .18s;}
  .mobile-nav button.active{color:var(--ink);}
  .mobile-nav button.active .ic{stroke-width:2.15;transform:translateY(-1px);}
  .mobile-nav button.active .nav-label{color:var(--ink);}

  /* ---------- 7. Floating action button (phones only) ---------- */
  .fab{
    display:none;position:fixed;right:16px;z-index:85;
    bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
    width:56px;height:56px;border-radius:20px;border:none;
    background:var(--primary-btn);color:var(--on-primary);
    box-shadow:0 8px 24px rgba(30,26,22,.28);
    align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  /* The message board has no toolbar Add button, so its + floats at every screen size. */
  .fab.always{display:flex;bottom:28px;}
  .fab .ic{width:24px;height:24px;stroke-width:2.2;}
  .fab:active{transform:scale(0.94);}

  /* ---------- 8. Day sheet (phone month view) ---------- */
  .day-sheet-title{display:flex;align-items:baseline;gap:9px;margin-bottom:14px;}
  .day-sheet-title h3{margin:0;font-family:var(--font-serif);font-size:19px;font-weight:700;}
  .day-sheet-title .dst-sub{font-size:12px;color:var(--ink-muted);font-weight:600;}
  .day-sheet-list{display:flex;flex-direction:column;gap:8px;}

  /* ==========================================================================
     PHONE  (<=760px)
     ========================================================================== */
  @media (max-width:760px){
    body{font-size:15px;}
    /* Room for the bottom nav + the iOS home indicator. */
    .wrap{padding:0 14px calc(var(--nav-h) + var(--safe-b) + 28px);max-width:100%;}

    /* --- sticky compact header --- */
    header.app-header{
      position:sticky;top:0;z-index:60;margin:0 -14px 12px;padding:8px 14px 10px;
      background:color-mix(in srgb, var(--paper) 90%, transparent);
      backdrop-filter:saturate(180%) blur(14px);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      border-bottom:1px solid var(--hairline);
    }
    .header-top{gap:10px;align-items:center;flex-wrap:nowrap;}
    .brand{min-width:0;flex:1;}
    .brand h1{font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand p{display:none;}
    .view-switcher{display:none;}          /* replaced by the bottom nav */
    .mobile-nav{display:block;}
    .fab{display:flex;}

    .header-row2{margin-top:10px;gap:8px;flex-direction:column;align-items:stretch;}
    /* Explicit widths here, not content-derived ones: a horizontally scrollable pill row
       reports a wide min-content size, which was stretching the whole toolbar (and with it
       the page) past the screen edge. */
    .filters-search{gap:8px;flex-wrap:nowrap;flex-direction:column;align-items:stretch;width:100%;max-width:100%;min-width:0;}
    .pill-tabs{width:100%;max-width:100%;min-width:0;}
    .search-box{width:100%;flex:none;padding:10px 14px;}
    .search-box input{font-size:16px;}    /* 16px stops iOS zooming the page on focus */
    .quick-add{width:100%;max-width:100%;flex:none;gap:8px;}
    .quick-add input{flex:1 1 auto;min-width:0;padding:11px 16px;font-size:16px;}
    .quick-add button{padding:11px 18px;min-height:var(--tap);}
    .quick-add .btn-add-detail{display:none;}   /* the FAB does this now */
    #open-my-calendars{display:none;}           /* reachable from the settings sheet */
    #add-goal-btn,#add-dream-btn{display:none;} /* the FAB does these now */
    #add-event-btn{display:none;}               /* the FAB does this now */
    /* Its only child is "Add Task…", which the FAB already covers -- an empty flex row would
       still take a gap's worth of a small screen. */
    #task-toolbar .quick-add{display:none;}

    .banner{font-size:12px;padding:10px 12px;gap:8px;margin:10px 0 0;border-radius:12px;flex-wrap:wrap;}
    .banner span{flex:1 1 100%;}
    .banner button{padding:8px 14px;}
    #setup-banner{margin-bottom:0;}
    /* Search is one tap away rather than permanently eating a row of a small screen. */
    .only-phone{display:flex!important;}
    #task-toolbar .search-box,#calendar-toolbar .quick-add{display:none;}
    #task-toolbar.search-open .search-box{display:flex;}
    #calendar-toolbar.search-open .quick-add{display:flex;}
    #cal-toggle-search{margin-left:8px;}
    .sync-banner{margin-top:6px;}
    .sync-status{font-size:11px;}

    /* --- matrix --- */
    .matrix-outer{margin-top:14px;}
    .matrix-cross{gap:12px;}
    .q-body{min-height:0;padding:10px;gap:9px;}
    .q-header{padding:13px 15px 11px;}
    .q-header-text .q-title{font-size:16.5px;}
    .q-header-text .q-subtitle{font-size:11.5px;}
    .task-card{padding:13px 14px;}
    .tc-title{font-size:15px;}
    .tc-check{width:26px;height:26px;}
    .meta-pill{font-size:11px;padding:4px 10px;}

    /* --- list / archive --- */
    .list-view{margin-top:14px;gap:14px;}
    .list-row{padding:14px;gap:11px;min-height:56px;}
    .list-row .tc-title{font-size:15px;}
    .archive-view{margin-top:14px;}
    .archive-row{flex-wrap:wrap;gap:9px;padding:14px;}
    /* !important because the row's title carries an inline flex:1 from the renderer. */
    .archive-row .tc-title{flex:1 1 100%!important;order:1;font-size:14.5px;}
    .archive-row .tc-avatars{order:0;}
    .archive-row .archive-date{order:2;margin-right:auto;}
    .archive-row .btn-sm{order:3;padding:8px 14px;}

    /* --- calendar --- */
    .cal-wrap{margin-top:12px;}
    .countdown-strip{margin:0 -14px 16px;padding:0 14px 10px;}
    #cal-subview-tabs{display:flex;width:100%;}
    #cal-subview-tabs button{flex:1;text-align:center;}
    .cal-nav{width:100%;gap:6px;}
    .cal-nav button{min-height:var(--tap);min-width:var(--tap);display:flex;align-items:center;justify-content:center;}
    .cal-nav #cal-prev,.cal-nav #cal-next{width:var(--tap);}
    .cal-nav #cal-today{padding:6px 14px;}
    .cal-period-label{margin-left:auto;font-size:15px;}

    .month-grid{gap:4px;}
    .month-weekday{font-size:10px;padding-bottom:4px;}
    .day-gutter{width:52px;}
    .day-hour{right:6px;font-size:10.5px;}
    .day-allday{padding:9px 12px;gap:9px;}
    .day-allday-label{width:auto;font-size:10px;}
    .day-block .db-title{font-size:12px;}
    .day-block .db-meta{font-size:10.5px;}
    .agenda-rail{gap:18px;}
    .agenda-card{padding:14px;gap:11px;}
    .agenda-card .ac-title{font-size:15px;}
    .agenda-card .ac-meta{font-size:12px;}

    /* --- compass / dreams --- */
    .compass-wrap,.dream-wrap{margin-top:14px;}
    .compass-vision-text{font-size:17px;}
    .priority-card{padding:14px;}
    .dream-card{padding:14px;}
    #compass-mode-toggle{width:100%!important;}

    /* --- modals become bottom sheets --- */
    .scrim{padding:0;align-items:flex-end;}
    .modal{
      max-width:100%;width:100%;margin:0;
      border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
      padding:8px 18px 0;
      max-height:92vh;max-height:92dvh;overflow-y:auto;min-height:0;
      animation:sheet-up .26s cubic-bezier(.22,1,.36,1);
      -webkit-overflow-scrolling:touch;
    }
    /* Grab handle drawn on every sheet without touching each modal's markup. */
    .modal::before{content:"";display:block;width:38px;height:4px;border-radius:999px;background:var(--hairline-strong);margin:6px auto 14px;}
    @keyframes sheet-up{from{transform:translateY(24px);opacity:.7;}to{transform:translateY(0);opacity:1;}}
    .modal-title-input{font-size:19px;}
    .field-label{margin:16px 0 7px;}
    .row-2{flex-direction:column;gap:14px;}
    .priority-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .priority-btn{padding:13px 10px;font-size:13px;white-space:normal;}
    .seg3 button{padding:12px 4px;font-size:12.5px;}
    input[type=date],.text-input,textarea.notes,.time-select{font-size:16px;padding:12px;}
    .status-toggle{padding:13px;}
    /* Sticky action bar: sits flush on the sheet's bottom edge (the sheet itself has no
       bottom padding) so scrolled content can never peek out underneath it. */
    .modal-footer{
      position:sticky;bottom:0;margin-top:20px;padding:14px 0 calc(18px + var(--safe-b));
      background:var(--surface);gap:10px;box-shadow:0 -12px 16px -12px rgba(0,0,0,.25);
    }
    .modal-footer button{flex:1;padding:13px 16px;font-size:14px;}
    .cat-btn{padding:10px 14px;font-size:12.5px;}
    .weekday-picker button{width:var(--tap);height:var(--tap);font-size:13px;}
    .check-inline{min-height:var(--tap);}
    .subtask-row{padding:7px 0;}
    .subtask-row input[type=checkbox]{width:20px;height:20px;}
    .family-row{gap:7px;padding:12px 12px 14px;border:1px solid var(--hairline);border-radius:var(--radius-card);background:var(--surface-2);position:relative;}
    .family-row .fam-remove{position:absolute;top:8px;right:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
    .family-row .fam-remove .ic{width:15px;height:15px;}

    /* --- toast clears the nav --- */
    .toast-wrap{bottom:calc(var(--nav-h) + var(--safe-b) + 20px);padding:0 16px;}
    .toast{width:100%;justify-content:center;}
  }

  /* Small phones */
  @media (max-width:380px){
    .mobile-nav button{font-size:9.5px;}
    .mobile-nav button .ic{width:21px;height:21px;}
    .brand h1{font-size:18px;}
    .month-cell.compact .mc-num{font-size:12px;}
  }

  /* ==========================================================================
     DESKTOP  (>=1025px)
     The old layout was a 1240px column of fixed-height panels, so on a wide screen
     it read as a small card floating in a field of paper. Here the shell fills the
     window: wider measure, tighter header rhythm, and work areas that grow into the
     space below the fold instead of stopping short of it.
     ========================================================================== */
  @media (min-width:1025px){
    .wrap{max-width:1640px;padding:22px 32px 28px;}

    /* Tighter vertical rhythm up top — that header was spending ~90px on air. */
    header.app-header{margin-bottom:12px;}
    .header-row2{margin-top:12px;}
    .sync-banner{margin-top:8px;}
    .brand h1{font-size:29px;}
    .brand p{margin-top:1px;}

    /* --- matrix fills the viewport, each quadrant scrolls its own overflow --- */
    .matrix-outer{margin-top:16px;}
    /* min-height is set by applyFillHeights() from the element's real offset — a CSS
       calc() can't know how tall the toolbars and countdown strip ended up. */
    .quadrant{height:100%;min-height:0;}
    .quadrant.is-collapsed{height:auto;}   /* nothing in it to scroll, so nothing to fill */
    .q-body{flex:1 1 auto;min-height:0;max-height:none;padding:14px;}
    .matrix-cross.matrix-empty{min-height:0;}
    .matrix-cross.matrix-empty .q-body{min-height:170px;}
    .q-empty{
      margin:auto;width:100%;max-width:360px;padding:26px 20px;
      border:1.5px dashed var(--hairline-strong);border-radius:var(--radius-card);
      font-style:normal;color:var(--ink-faint);
    }

    /* --- list view: two columns rather than one narrow ribbon --- */
    .list-view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;}

    /* --- calendar --- */
    .month-grid{grid-template-rows:auto repeat(6, minmax(92px, 1fr));}
    .month-cell{min-height:0;}
    .day-scroll{max-height:none;}
    /* Agenda cards at 1600px would be one absurdly long line each, so the rail flows
       into columns — same reading width, no empty half-page. (display:block matters:
       CSS columns are ignored inside a flex container.) */
    .agenda-rail{display:block;column-gap:30px;}
    .agenda-day{break-inside:avoid;}
    .agenda-day + .agenda-day{margin-top:22px;}
    .archive-view,.compass-wrap{max-width:1200px;}
    .compass-vision-text{max-width:900px;}
  }
  @media (min-width:1360px){
    .agenda-rail{column-count:2;}
    .agenda-day{margin-bottom:24px;}
    .agenda-day + .agenda-day{margin-top:0;}
  }
  /* Very wide: a task card stretched across half a 1920px screen is mostly empty, so the
     cards inside each quadrant flow into their own responsive grid instead. */
  @media (min-width:1560px){
    .q-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-content:start;}
    .q-body.is-empty{display:flex;align-items:center;justify-content:center;}
    .agenda-rail{column-count:3;}
    .list-row .tc-title{font-size:14px;}
  }

  /* Tablet: two-up matrix, keep the desktop switcher */
  @media (min-width:761px) and (max-width:1024px){
    .wrap{padding:20px 18px 48px;}
    .matrix-cross{grid-template-columns:20px 1fr 1fr;}
    .brand h1{font-size:25px;}
  }

  /* ---------- 8b. Contrast: anything that hard-coded #fff on a themed background ----------
     In dark mode the "dark" button colour becomes light, so white-on-it disappears.
     These all read off the theme instead. */
  .btn-close,.btn-primary,.banner button,.toast{background:var(--primary-btn);color:var(--on-primary);}
  .banner .dismiss{background:transparent;color:var(--due-today);}
  .toast button{color:var(--accent);}
  .seg3 button.active,.weekday-picker button.selected{background:var(--primary-btn);color:var(--on-primary);border-color:var(--primary-btn);}
  .today-badge{background:var(--accent);color:var(--paper);}
  .status-toggle.complete,.tc-check.checked{background:var(--eliminate);color:var(--paper);}
  .month-cell.compact.today .mc-num{color:var(--paper);}
  .dream-card.achieved{background:color-mix(in srgb, var(--eliminate) 10%, transparent);}

  /* ---------- 9. Icon fit-and-finish in the places emoji used to sit ---------- */
  /* Every "remove" control shares one look — some of these had no rule at all and were
     falling back to the browser's default grey button. */
  button.rm{border:none;background:transparent;color:var(--ink-faint);display:inline-flex;
    align-items:center;justify-content:center;gap:5px;border-radius:50%;padding:6px;
    min-width:32px;min-height:32px;font-size:12.5px;font-weight:600;}
  button.rm:hover{background:rgba(120,110,100,0.14);color:var(--overdue);}
  .priority-card .rm{border-radius:var(--radius-pill);padding:6px 12px;}
  .cat-btn{display:inline-flex;align-items:center;gap:6px;}
  .cat-btn .ic{width:14px;height:14px;}
  .dream-check .ic{width:18px;height:18px;}
  .dream-card.achieved .dream-check{color:var(--eliminate);}
  .goal-junior-stars{display:flex;gap:3px;letter-spacing:0;font-size:0;}
  .goal-junior-stars .ic{width:17px;height:17px;color:#e0a52a;}
  .goal-junior-stars .star-off{opacity:.3;}
  .dream-group-header .ic{width:17px;height:17px;}
  .tag-chip button .ic,.subtask-row button.rm .ic,.priority-card .rm .ic,.mission-row .rm .ic,.family-row .rm .ic{width:12px;height:12px;}
  .status-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;}
  .status-toggle .ic{width:15px;height:15px;}
  .btn-close .ic{width:14px;height:14px;margin-right:5px;}
  .settings-help .ic{width:13px;height:13px;margin-right:4px;}
  .agenda-card .ac-icon,.countdown-card .cc-icon{box-shadow:var(--shadow-sm);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }

</style>
</head>

<script>
(function(){
  "use strict";

  /* ================= CONSTANTS ================= */
  var QUADRANTS = {
    doFirst:   { key:'doFirst',   title:'Do First',  subtitle:'Urgent & Important',      accent:'var(--do-first)',   cls:'q-do-first',   important:true,  urgent:true  },
    schedule:  { key:'schedule',  title:'Schedule',  subtitle:'Important, Not Urgent',   accent:'var(--schedule)',   cls:'q-schedule',   important:true,  urgent:false },
    delegate:  { key:'delegate',  title:'Delegate',  subtitle:'Urgent, Not Important',   accent:'var(--delegate)',   cls:'q-delegate',   important:false, urgent:true  },
    eliminate: { key:'eliminate', title:'Eliminate', subtitle:'Neither',                 accent:'var(--eliminate)',  cls:'q-eliminate',  important:false, urgent:false }
  };
  var QUADRANT_ORDER = ['doFirst','schedule','delegate','eliminate'];

  /* The horizon board. Columns are worked out from the due date rather than chosen, which is
     the whole point: a student's syllabus already decides both importance and urgency, so
     asking them to classify each task is asking a question they don't have. */
  var HORIZON = {
    overdue: { key:'overdue', title:'Overdue',   subtitle:'past its date',   accent:'var(--overdue)', cls:'h-overdue' },
    today:   { key:'today',   title:'Today',     subtitle:'due today',       accent:'var(--due-today)', cls:'h-today' },
    week:    { key:'week',    title:'This week', subtitle:'before Sunday',   accent:'var(--schedule)', cls:'h-week' },
    later:   { key:'later',   title:'Later',     subtitle:'next week onward',accent:'var(--delegate)', cls:'h-later' },
    none:    { key:'none',    title:'No date yet', subtitle:'pick one up when there\'s a gap', accent:'var(--ink-faint)', cls:'h-none' }
  };
  var HORIZON_ORDER = ['overdue','today','week','later','none'];

  // The calendar week this date sits in, Sunday through Saturday.
  function weekStart(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    return dateAdd(dateStr, -d.getDay());
  }
  function weekEnd(dateStr){ return dateAdd(weekStart(dateStr), 6); }

  function horizonBucket(task){
    if(!task.due) return 'none';
    var today = todayStr();
    if(task.due < today) return 'overdue';
    if(task.due === today) return 'today';
    // "This week" means the week on the wall -- Sunday to Saturday -- not a rolling seven days.
    // On a Thursday, "next 7 days" reaches into next week, so something due next Wednesday
    // showed up under "This week", which is exactly the thing a student plans around.
    return task.due <= weekEnd(today) ? 'week' : 'later';
  }

  // On a Saturday the week is already over, so "before Sunday" would be a promise of nothing.
  function horizonSubtitle(key){
    if(key !== 'week') return HORIZON[key].subtitle;
    var today = todayStr();
    return weekEnd(today) === today ? 'the week is done' : 'before Sunday';
  }

  // Adults keep the matrix; kids get the horizon board unless someone says otherwise.
  function boardStyleFor(member){
    if(member && member.board) return member.board;
    return (member && member.role === 'kid') ? 'horizon' : 'matrix';
  }
  function currentBoardStyle(){ return boardStyleFor(state.currentFamilyMember); }
  var LS_TASKS = 'eisenhower_tasks_local_v1';
  var LS_CALENDAR = 'eisenhower_calendar_local_v1';
  var LS_DREAMS = 'eisenhower_dreams_local_v1';
  var LS_COMPASS = 'eisenhower_compass_local_v1';
  var LS_CAL_SOURCES = 'tm_cal_sources_v1';   // per-device calendar visibility
  var LS_MIGRATION = 'tm_migration_hint_v1'; // owner/repo of the old GitHub store, for the one-off import form
  var LS_META = 'eisenhower_meta_v1'; // title/subtitle

  /* ================= UTIL ================= */
  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
  function nowISO(){ return new Date().toISOString(); }
  // Local-calendar-day date string (never UTC) -- toISOString() would shift the date near midnight
  // depending on the viewer's timezone, which is wrong for "today"/due-date/calendar-day logic.
  function toLocalDateStr(d){
    var y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
    return y + '-' + (m<10?'0':'') + m + '-' + (day<10?'0':'') + day;
  }
  function todayStr(){ return toLocalDateStr(new Date()); }
  function fmtDate(d){
    if(!d) return '';
    var dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  function fmtRelative(iso){
    var diff = Date.now() - new Date(iso).getTime();
    var m = Math.floor(diff/60000);
    if(m < 1) return 'just now';
    if(m < 60) return m+'m ago';
    var h = Math.floor(m/60);
    if(h < 24) return h+'h ago';
    var d = Math.floor(h/24);
    return d+'d ago';
  }
  function pad2(n){ return (n<10?'0':'')+n; }
  // 24h 'HH:MM' -> '6:00 PM'. All time-of-day display in the app goes through this -- never
  // military/24h time, per family preference.
  function formatTime12(timeStr){
    if(!timeStr) return '';
    var parts = timeStr.split(':');
    var h = parseInt(parts[0],10), m = parts[1] || '00';
    if(isNaN(h)) return timeStr;
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ':' + m + ' ' + ampm;
  }
  // Common US timezones a family is likely to be spread across. Kept as a curated list (rather
  // than the full IANA database) so the Family Settings picker stays simple.
  var TIMEZONE_OPTIONS = [
    { value:'America/New_York',    label:'Eastern (New York)' },
    { value:'America/Chicago',     label:'Central (Chicago)' },
    { value:'America/Denver',      label:'Mountain (Denver)' },
    { value:'America/Phoenix',     label:'Mountain, no DST (Phoenix)' },
    { value:'America/Los_Angeles', label:'Pacific (Los Angeles)' },
    { value:'America/Anchorage',   label:'Alaska' },

    }
  }

  /* ================= SYNC =================
     Replaces the old "each browser PUTs whole JSON files to GitHub with its own
     token" design. That model had three fatal properties for a household of six:
     a conflict retry that force-overwrote whoever wrote first, no re-read after
     page load (so a tab open since breakfast wrote breakfast's data back over
     dinner's), and a write-scoped token sitting in localStorage on every device.

     This talks to /api on the same origin instead:
       * per-item writes, so two people editing different things never collide;
       * a monotonic cursor, so every device polls only what changed;
       * an op ledger, so a retried write can't re-apply an old edit;
       * no credentials anywhere on the device — Cloudflare Access already knows
         who you are, and the Worker reads that identity server-side.

     The rest of the app is untouched: it still mutates state.tasks / state.events
     and calls persist(). What changed is that persist() now diffs state against a
     shadow copy of what the server last confirmed, and emits ops only for the
     items that actually changed. */

  var LS_CURSOR = 'tm_sync_cursor_v1';
  var LS_QUEUE  = 'tm_sync_queue_v1';

  // kind -> where it lives in state, and how to identify one
  var SYNC_KINDS = {
